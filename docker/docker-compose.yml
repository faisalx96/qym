version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qym -d qym"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      QYM_ENVIRONMENT: ${QYM_ENVIRONMENT}
      QYM_BASE_URL: ${QYM_BASE_URL}
      QYM_ROOT_PATH: ${QYM_ROOT_PATH:-}
      QYM_DATABASE_URL: ${QYM_DATABASE_URL}
      # Default `all`: this container serves HTTP and runs the background
      # loops. Set QYM_ROLE=api and start the `worker` profile to split them.
      QYM_ROLE: ${QYM_ROLE:-all}
      # >1 serves HTTP from N processes; with QYM_ROLE=all one more process
      # runs the background loops (qym_platform/serve.py). Default: 1 process.
      QYM_WEB_WORKERS: ${QYM_WEB_WORKERS:-1}
      QYM_MAINTENANCE_MODE: ${QYM_MAINTENANCE_MODE:-false}
      QYM_EVENT_LOG_MODE: ${QYM_EVENT_LOG_MODE:-full}
      QYM_SPAN_RETENTION_DAYS: ${QYM_SPAN_RETENTION_DAYS:-60}
      QYM_DELETED_RUN_GRACE_DAYS: ${QYM_DELETED_RUN_GRACE_DAYS:-30}
      QYM_ADMIN_BOOTSTRAP_TOKEN: ${QYM_ADMIN_BOOTSTRAP_TOKEN}
      QYM_AUTH_MODE: ${QYM_AUTH_MODE}
      QYM_AUTH_SESSION_SECRET: ${QYM_AUTH_SESSION_SECRET}
      QYM_AUTH_LOCAL_ENABLED: ${QYM_AUTH_LOCAL_ENABLED}
      QYM_AUTH_LOCAL_SIGNUP: ${QYM_AUTH_LOCAL_SIGNUP:-false}
      QYM_AUTH_LOGIN_MAX_FAILURES_PER_EMAIL: ${QYM_AUTH_LOGIN_MAX_FAILURES_PER_EMAIL:-5}
      QYM_AUTH_LOGIN_MAX_FAILURES_PER_CLIENT: ${QYM_AUTH_LOGIN_MAX_FAILURES_PER_CLIENT:-30}
      QYM_AUTH_LOGIN_FAILURE_WINDOW_SECONDS: ${QYM_AUTH_LOGIN_FAILURE_WINDOW_SECONDS:-300}
      QYM_AUTH_LOGIN_EMAIL_CEILING: ${QYM_AUTH_LOGIN_EMAIL_CEILING:-50}
      QYM_AUTH_LOGIN_EMAIL_CEILING_WINDOW_SECONDS: ${QYM_AUTH_LOGIN_EMAIL_CEILING_WINDOW_SECONDS:-900}
      # The ingress addresses whose X-Forwarded-For uvicorn trusts. Empty means
      # unset (entrypoint.sh drops it), so the startup warning still shows.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
      QYM_UVICORN_ARGS: ${QYM_UVICORN_ARGS:-}
      QYM_AUTH_GOOGLE_CLIENT_ID: ${QYM_AUTH_GOOGLE_CLIENT_ID}
      QYM_AUTH_GOOGLE_CLIENT_SECRET: ${QYM_AUTH_GOOGLE_CLIENT_SECRET}
      QYM_AUTH_GITHUB_CLIENT_ID: ${QYM_AUTH_GITHUB_CLIENT_ID}
      QYM_AUTH_GITHUB_CLIENT_SECRET: ${QYM_AUTH_GITHUB_CLIENT_SECRET}
      QYM_AUTH_GITLAB_URL: ${QYM_AUTH_GITLAB_URL:-}
      QYM_AUTH_GITLAB_CLIENT_ID: ${QYM_AUTH_GITLAB_CLIENT_ID:-}
      QYM_AUTH_GITLAB_CLIENT_SECRET: ${QYM_AUTH_GITLAB_CLIENT_SECRET:-}
      QYM_LLM_CONFIG_ENCRYPTION_KEY: ${QYM_LLM_CONFIG_ENCRYPTION_KEY}
      QYM_ANALYSIS_MAX_CONCURRENCY: ${QYM_ANALYSIS_MAX_CONCURRENCY:-20}
      QYM_ANALYSIS_MAX_RETRIES: ${QYM_ANALYSIS_MAX_RETRIES:-1}
      QYM_PLATFORM_CA_BUNDLE: ${QYM_PLATFORM_CA_BUNDLE:-}
      QYM_PLATFORM_SSL_VERIFY: ${QYM_PLATFORM_SSL_VERIFY:-}
      QYM_CA_BUNDLE: ${QYM_CA_BUNDLE:-}
      QYM_SSL_VERIFY: ${QYM_SSL_VERIFY:-}
      QYM_PRODUCT_EVAL_RUN_COUNT: ${QYM_PRODUCT_EVAL_RUN_COUNT:-3}
      QYM_MAX_UPLOAD_BYTES: ${QYM_MAX_UPLOAD_BYTES:-104857600}
    # Nothing is written into the container: read-only root filesystem, and a
    # bounded tmpfs for /tmp (multipart parsing, HOME). Keep the tmpfs above
    # QYM_MAX_UPLOAD_BYTES.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os, urllib.request; urllib.request.urlopen(\"http://localhost:8000\" + os.getenv(\"QYM_ROOT_PATH\", \"\").rstrip(\"/\") + \"/healthz\").read()'"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-backup:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ${QYM_BACKUP_PATH:-./backups}:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/bash", "/backup.sh"]
    restart: unless-stopped

  # Optional split layout: `docker compose --profile worker up` with
  # QYM_ROLE=api in .env. Not started by default.
  worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "qym_platform.worker"]
    environment:
      QYM_DATABASE_URL: ${QYM_DATABASE_URL}
      QYM_ROLE: worker
      QYM_SKIP_MIGRATIONS: "1"
      QYM_ENVIRONMENT: ${QYM_ENVIRONMENT:-dev}
      QYM_MAINTENANCE_MODE: ${QYM_MAINTENANCE_MODE:-false}
      QYM_EVENT_LOG_MODE: ${QYM_EVENT_LOG_MODE:-full}
      QYM_SPAN_RETENTION_DAYS: ${QYM_SPAN_RETENTION_DAYS:-60}
      QYM_DELETED_RUN_GRACE_DAYS: ${QYM_DELETED_RUN_GRACE_DAYS:-30}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

