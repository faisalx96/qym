# Ingress for the service split (docker/docker-compose.split.yml).
#
# SDK clients keep QYM_BASE_URL pointed here: exactly the three ingest paths
# go to the ingestion service, /ingestion/ and /workers/ to their services,
# everything else (UI, /api/*, the other /v1/* routes such as
# /v1/runs/{id}/submit|approve|owner) to main. Paths are passed through
# unchanged (no prefix stripping): each service serves its own prefix.
# The same rules for Kubernetes ingress-nginx are in docs/internal/OPERATIONS.md.

upstream qym_main      { server main:8000; }
upstream qym_ingestion { server ingestion:8000; }
upstream qym_workers   { server workers:8000; }

server {
    listen 8080;

    # Ingest bodies are up to QYM_MAX_INGEST_BODY_BYTES (20 MB), uploads up
    # to QYM_MAX_UPLOAD_BYTES (100 MB); the services enforce the real limits.
    client_max_body_size 110m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;

    location = /v1/runs                  { proxy_pass http://qym_ingestion; }
    location = /v1/runs:upload           { proxy_pass http://qym_ingestion; }
    location ~ ^/v1/runs/[^/]+/events$   { proxy_pass http://qym_ingestion; }
    location /ingestion/                 { proxy_pass http://qym_ingestion; }
    location /workers/                   { proxy_pass http://qym_workers; }
    location / {
        # Analysis progress is streamed (analyze-stream): do not buffer it.
        proxy_buffering off;
        proxy_pass http://qym_main;
    }
}
