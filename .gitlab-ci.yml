variables:
  PROJECT_NAME: qym
  DEPLOYMENT_NAME: qym
  ENV: "dev"

stages:
  - workflow
  - package

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      variables:
        ENV: "dev"
    - if: '$CI_COMMIT_BRANCH == "qa"'
      variables:
        ENV: "qa"
    - if: '$CI_COMMIT_BRANCH == "preprod"'
      variables:
        ENV: "preprod"
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables:
        ENV: "prod"
    - if: '$CI_COMMIT_BRANCH == "prod"'
      variables:
        ENV: "prod"
    - if: '$CI_COMMIT_BRANCH == "eval"'
      variables:
        ENV: "preprod"
    - when: always



package:
  stage: package
  only:
    refs:
      - dev
      - qa
      - main
      - master
      - preprod
      - eval
  script:
    - source /internet.sh
    # The UI assets image. CUSTOM_FRONTEND_IMAGE (CI/CD variable) names a
    # prebuilt image to reuse; when it is empty the image is built from
    # docker/Dockerfile.frontend, pushed, and used for this build.
    - |
      if [ -n "$CUSTOM_FRONTEND_IMAGE" ]; then
        FRONTEND_IMAGE="$CUSTOM_FRONTEND_IMAGE"
        echo "Reusing the frontend assets image $FRONTEND_IMAGE"
      else
        FRONTEND_IMAGE="$REGISTRY/$HARBOR_PROJECT/$PROJECT_NAME-frontend:$ENV-$CI_COMMIT_SHORT_SHA"
        echo "CUSTOM_FRONTEND_IMAGE not set: building $FRONTEND_IMAGE"
        podman build \
          --build-arg FRONTEND_BASE_IMAGE=$CUSTOM_FRONTEND_BASE_IMAGE \
          -v "$CI_BUILDS_DIR":"$CI_BUILDS_DIR" \
          -t "$FRONTEND_IMAGE" \
          -t "$REGISTRY"/"$HARBOR_PROJECT"/"$PROJECT_NAME"-frontend:$ENV-latest \
          --annotation org.opencontainers.image.revision=$ENV-"$CI_COMMIT_SHA" \
          -f docker/Dockerfile.frontend \
          .
        podman push --creds "$HARBOR_USERNAME":"$HARBOR_PASSWORD" "$FRONTEND_IMAGE"
        podman push --creds "$HARBOR_USERNAME":"$HARBOR_PASSWORD" "$REGISTRY"/"$HARBOR_PROJECT"/"$PROJECT_NAME"-frontend:$ENV-latest
      fi
    - >
      podman build \
        --build-arg BASE_IMAGE=$CUSTOM_BASE_IMAGE \
        --build-arg FRONTEND_IMAGE=$FRONTEND_IMAGE \
        --build-arg PIP_INDEX_URL=$CUSTOM_PIP_INDEX_URL \
        --build-arg PIP_TRUSTED_HOST=$CUSTOM_PIP_TRUSTED_HOST \
        --build-arg PIP_SEARCH_INDEX=$CUSTOM_PIP_SEARCH_INDEX \
        --build-arg PIP_SEARCH_TRUSTED_HOST=$CUSTOM_PIP_SEARCH_TRUSTED_HOST \
        -v "$CI_BUILDS_DIR":"$CI_BUILDS_DIR" \
        -t "$REGISTRY"/"$HARBOR_PROJECT"/"$PROJECT_NAME":$ENV-latest \
        --annotation org.opencontainers.image.revision=$ENV-"$CI_COMMIT_SHA" \
        -f docker/Dockerfile \
        .
    - podman push --creds "$HARBOR_USERNAME":"$HARBOR_PASSWORD" "$REGISTRY"/"$HARBOR_PROJECT"/"$PROJECT_NAME":$ENV-latest
    - podman image tag "$REGISTRY"/"$HARBOR_PROJECT"/"$PROJECT_NAME":$ENV-latest "$REGISTRY"/"$HARBOR_PROJECT"/"$PROJECT_NAME":$ENV-"$CI_COMMIT_SHORT_SHA"
    - podman push --creds "$HARBOR_USERNAME":"$HARBOR_PASSWORD" "$REGISTRY"/"$HARBOR_PROJECT"/"$PROJECT_NAME":$ENV-"$CI_COMMIT_SHORT_SHA"
