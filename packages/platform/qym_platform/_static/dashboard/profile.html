<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قيِّم • Profile</title>
  <link rel="icon" type="image/png" href="/static/qym_icon.png">
  <link rel="stylesheet" href="/static/dashboard.css?v=p1-20261001">
  <link rel="stylesheet" href="/static/shell.css?v=p0-20260930-3">
  <script src="/static/qym_safe.js?v=p0-20260930"></script>
  <script src="/static/auth.js?v=p0-20260930"></script>
  <script src="/static/shell.js?v=p1-20261001"></script>
  <style>
    .page {
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }
    .hero h1 {
      margin: 0;
      font-size: var(--font-title);
    }
    .hero p {
      margin: 6px 0 0;
      color: var(--text-muted);
    }
    .actions {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: var(--space-md);
    }
    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 10px;
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
    }
    .panel h2 {
      margin: 0 0 var(--space-md);
      font-size: var(--font-md);
    }
    .kv-label {
      font-size: var(--font-sm);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .kv-value {
      color: var(--text-primary);
      font-family: var(--font-mono);
      word-break: break-word;
    }
    .project-list {
      display: grid;
      gap: var(--space-sm);
    }
    .project-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .project-meta strong {
      display: block;
      margin-bottom: 4px;
    }
    .project-meta span {
      color: var(--text-muted);
      font-size: var(--font-sm);
    }
    .role-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      background: rgba(0, 212, 170, 0.08);
      border: 1px solid rgba(0, 212, 170, 0.22);
      color: var(--accent-primary);
      font-size: var(--font-xs);
      font-family: var(--font-mono);
      text-transform: uppercase;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--space-md);
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: var(--font-sm);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .form-input, .form-textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 10px 12px;
      font-size: var(--font-sm);
      font-family: var(--font-sans);
    }
    .form-textarea {
      min-height: 88px;
      resize: vertical;
    }
    .inline-note {
      color: var(--text-muted);
      font-size: var(--font-sm);
      margin-top: 10px;
    }
    .message {
      margin-top: var(--space-sm);
      color: var(--accent-primary);
      font-size: var(--font-sm);
    }
    .bootstrap-panel {
      display: none;
      border-color: rgba(0, 212, 170, 0.24);
      background: rgba(0, 212, 170, 0.06);
    }
    .bootstrap-copy {
      margin: 0 0 var(--space-md);
      color: var(--text-muted);
      font-size: var(--font-sm);
      line-height: 1.5;
    }
    .bootstrap-form {
      display: flex;
      align-items: stretch;
      gap: var(--space-sm);
      max-width: 560px;
    }
    .bootstrap-form .form-input {
      font-family: var(--font-mono);
    }
    .bootstrap-message {
      margin-top: var(--space-sm);
      color: var(--text-muted);
      font-size: var(--font-sm);
    }
    .bootstrap-message.error {
      color: var(--error);
    }
    @media (max-width: 640px) {
      .bootstrap-form {
        flex-direction: column;
      }
    }
  </style>
  <link rel="stylesheet" href="/static/ui_components.css?v=p0-20260930">
  <script defer src="/static/ui_components.js?v=p1-20261001"></script>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <h1>Profile</h1>
        <p>Your access is now project-scoped. API keys live inside each project’s settings page.</p>
      </div>
      <div class="actions">
      </div>
    </section>

    <section class="panel">
      <h2>Account</h2>
      <div class="grid" id="account-grid"></div>
    </section>

    <section class="panel bootstrap-panel" id="bootstrap-panel">
      <h2>Grant Admin Access</h2>
      <p class="bootstrap-copy">Enter the admin bootstrap token to promote your account. This is only available before the first active admin exists.</p>
      <div class="bootstrap-form">
        <input class="form-input" id="bootstrap-token-input" type="password" placeholder="Bootstrap token" autocomplete="one-time-code">
        <button class="btn btn-primary" id="bootstrap-submit-btn" type="button">Promote</button>
      </div>
      <div class="bootstrap-message" id="bootstrap-message" role="status" aria-live="polite"></div>
    </section>

    <section class="panel">
      <h2>Projects</h2>
      <div class="project-list" id="projects-list"></div>
    </section>

  </main>

  <script>
    (() => {
      'use strict';

      function apiUrl(path) {
        const root = (window.__QYM_ROOT_PATH__ || '').replace(/\/$/, '');
        return `${window.location.origin}${root}/${String(path || '').replace(/^\/+/, '')}`;
      }

      function escapeHtml(value) {
        return QymSafe.escapeHtml(value == null ? '' : String(value));
      }

      function projectUrl(slug, suffix = '') {
        const root = (window.__QYM_ROOT_PATH__ || '').replace(/\/$/, '');
        const clean = String(suffix || '').replace(/^\/+/, '');
        return `${root}/projects/${encodeURIComponent(slug)}${clean ? `/${clean}` : ''}`;
      }

      async function loadProfile() {
        const meRes = await fetch(apiUrl('v1/me'));
        if (window.QymAuth && window.QymAuth.handle401(meRes)) return;
        if (!meRes.ok) throw new Error('Failed to load profile');

        const me = await meRes.json();
        renderProfile(me);
      }

      function renderProfile(me) {
        const defaultProject = me.default_project;
        var openBtn = document.getElementById('open-default-project');
        if (openBtn) openBtn.href = defaultProject ? projectUrl(defaultProject.slug) : ((window.__QYM_ROOT_PATH__ || '').replace(/\/$/, '') + '/');
        renderBootstrapPanel(me);

        document.getElementById('account-grid').innerHTML = [
          ['Display Name', me.display_name || '—'],
          ['Email', me.email || '—'],
          ['Global Role', me.role || '—'],
          ['Default Project', defaultProject ? defaultProject.name : '—'],
        ].map(([label, value]) => `
          <div class="panel" style="margin:0; padding:14px;">
            <div class="kv-label">${escapeHtml(label)}</div>
            <div class="kv-value">${escapeHtml(value)}</div>
          </div>
        `).join('');

        const projects = Array.isArray(me.projects) ? me.projects : [];
        document.getElementById('projects-list').innerHTML = projects.length ? projects.map((project) => `
          <div class="project-card">
            <div class="project-meta">
              <strong>${escapeHtml(project.name)}</strong>
              <span>${escapeHtml(project.slug)}</span>
            </div>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <span class="role-pill qym-tag qym-tag--role ${escapeHtml(String(project.role || 'member').toLowerCase())}">${escapeHtml(project.role || 'MEMBER')}</span>
              <a class="btn btn-secondary" href="${escapeHtml(projectUrl(project.slug))}">Open</a>
              <a class="btn btn-secondary" href="${escapeHtml(projectUrl(project.slug, 'settings'))}">Settings</a>
            </div>
          </div>
        `).join('') : '<div class="inline-note">You do not belong to any active projects yet.</div>';
      }

      function renderBootstrapPanel(me) {
        const panel = document.getElementById('bootstrap-panel');
        const input = document.getElementById('bootstrap-token-input');
        const message = document.getElementById('bootstrap-message');
        if (!panel || !input || !message) return;
        const canBootstrap = Boolean(me && me.can_bootstrap_admin && me.role !== 'ADMIN');
        panel.style.display = canBootstrap ? 'block' : 'none';
        if (!canBootstrap) {
          input.value = '';
          setBootstrapMessage('');
        }
      }

      function setBootstrapMessage(text, isError) {
        const message = document.getElementById('bootstrap-message');
        if (!message) return;
        message.textContent = text || '';
        message.classList.toggle('error', Boolean(isError));
      }

      async function bootstrapAdmin() {
        const input = document.getElementById('bootstrap-token-input');
        const button = document.getElementById('bootstrap-submit-btn');
        const token = input.value.trim();
        if (!token) {
          setBootstrapMessage('Token is required.', true);
          input.focus();
          return;
        }

        button.disabled = true;
        setBootstrapMessage('Promoting…');
        try {
          const res = await fetch(apiUrl('v1/auth/bootstrap-admin'), {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bootstrap_token: token }),
          });
          if (window.QymAuth && window.QymAuth.handle401(res)) return;
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            setBootstrapMessage(data.detail || 'Admin bootstrap failed.', true);
            return;
          }
          setBootstrapMessage('Admin access granted. Refreshing…');
          window.location.reload();
        } catch (error) {
          setBootstrapMessage('Admin bootstrap failed.', true);
        } finally {
          button.disabled = false;
        }
      }

      document.getElementById('bootstrap-submit-btn').addEventListener('click', bootstrapAdmin);
      document.getElementById('bootstrap-token-input').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') bootstrapAdmin();
      });
      loadProfile().catch((error) => {
        document.getElementById('account-grid').innerHTML = `<div class="inline-note">${escapeHtml(error.message)}</div>`;
      });
    })();
  </script>
</body>
</html>
