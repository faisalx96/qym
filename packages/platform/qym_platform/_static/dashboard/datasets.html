    async function renderItemPageRuns(host, item, v){
      host.innerHTML = '<div class="dsx-skel-row"><div class="dsx-skeleton" style="width:80%"></div></div>';
      try {
        const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '/runs?project_slug=' + encodeURIComponent(state.slug));
        host.innerHTML = '';
        const runs = resp.runs || [];
        if (!runs.length) {
          host.appendChild(el('div', { className: 'dsx-empty' }, [el('h3', null, 'No runs yet'), el('p', null, 'This item has not been used in any run.')])); return;
        }
        const agg = resp.aggregates || {};
        const aggWrap = el('div', { className: 'dsx-run-aggregate qym-stat-strip', style: { marginBottom: '12px' } });
        [['Runs', agg.run_count], ['Errors', agg.error_count || 0], ['Avg latency', fmtSeconds(agg.avg_latency_ms)]].forEach(([label, value]) => {
          aggWrap.appendChild(el('div', { className: 'tile qym-stat-strip__item' }, [el('div', { className: 'label qym-stat-strip__label' }, label), el('div', { className: 'value qym-stat-strip__value' }, String(value == null ? '—' : value))]));
        });
        Object.keys(agg.metrics || {}).sort().forEach(metric => {
          const m = agg.metrics[metric] || {};
          aggWrap.appendChild(el('div', { className: 'tile qym-stat-strip__item' }, [el('div', { className: 'label qym-stat-strip__label' }, metric), el('div', { className: 'value qym-stat-strip__value' }, metricScoreNode(m.avg))]));
        });
        host.appendChild(aggWrap);

        const wrap = el('div', { className: 'dsx-item-runs-wrap' });
        host.appendChild(wrap);

        function runScoreByMetric(run){
          const out = {};
          (run.scores || []).forEach(score => { out[score.metric_name] = score; });
          return out;
        }
        const metricNames = Array.from(new Set(runs.flatMap(r => (r.scores || []).map(s => s.metric_name)))).sort();
        function currentSort(){
          const raw = state.itemRunSort || 'created_desc';
          if (raw.startsWith('metric:')) {
            const parts = raw.split(':');
            return { key: 'metric:' + (parts[1] || ''), dir: parts[2] === 'asc' ? 'asc' : 'desc' };
          }
          const idx = raw.lastIndexOf('_');
          return idx > 0 ? { key: raw.slice(0, idx), dir: raw.slice(idx + 1) === 'asc' ? 'asc' : 'desc' } : { key: 'created', dir: 'desc' };
        }
        function sortValue(run, key){
          const runName = run.run_name || run.external_run_id || run.run_id || '';
          if (key === 'run_name') return runName.toLowerCase();
          if (key === 'created') return new Date(run.created_at || run.started_at || 0).getTime();
          if (key === 'model') return String(run.model || '').toLowerCase();
          if (key === 'output') return String(run.error ? ('ERROR: ' + run.error) : fullPreview(run.output)).toLowerCase();
          if (key === 'latency') return run.latency_ms == null ? null : Number(run.latency_ms);
          if (key.startsWith('metric:')) {
            const metric = key.slice('metric:'.length);
            const score = runScoreByMetric(run)[metric];
            if (!score) return null;
            if (score.score_numeric != null) return Number(score.score_numeric);
            return score.score_raw == null ? null : String(score.score_raw).toLowerCase();
          }
          return runName.toLowerCase();
        }
        function sortedRuns(){
          const sort = currentSort();
          return runs.slice().sort((a, b) => {
            const av = sortValue(a, sort.key);
            const bv = sortValue(b, sort.key);
            const am = av == null || av === '';
            const bm = bv == null || bv === '';
            if (am !== bm) return am ? 1 : -1;
            let cmp = 0;
            if (typeof av === 'number' && typeof bv === 'number') cmp = av - bv;
            else cmp = String(av).localeCompare(String(bv));
            if (cmp === 0) cmp = String(a.run_id || '').localeCompare(String(b.run_id || ''));
            return sort.dir === 'desc' ? -cmp : cmp;
          });
        }
        function sortStateFor(key){
          const sort = currentSort();
          return sort.key === key ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
        }
        function sortValueFor(key, nextDir){
          if (key.startsWith('metric:')) return key + ':' + nextDir;
          return key + '_' + nextDir;
        }
        function runTableColumns(){
          const columns = [
            { id: 'run_name', label: 'Run name', className: 'col-run-name', sortKey: 'run_name', width: 230, minWidth: 150 },
            { id: 'created', label: 'Run date', className: 'col-run-date', sortKey: 'created', width: 150, minWidth: 120 },
            { id: 'model', label: 'Model', className: 'col-run-model', sortKey: 'model', width: 130, minWidth: 96 },
            { id: 'output', label: 'Output', className: 'col-run-output', sortKey: 'output', width: 255, minWidth: 170, flex: 1 },
            { id: 'latency', label: 'Latency', className: 'col-latency', sortKey: 'latency', width: 94, minWidth: 92 },
          ];
          metricNames.forEach(metric => columns.push({ id: 'metric:' + metric, label: metric, className: 'col-metric', sortKey: 'metric:' + metric, width: metricColumnWidth(metric), minWidth: 72 }));
          columns.push({ id: 'trace', label: 'Trace', className: 'col-run-trace', width: 64, minWidth: 62, resizable: false });
          return columns;
        }
        function renderRunRow(r){
          const row = el('tr');
          const runName = r.run_name || r.external_run_id || r.run_id;
          const runBtn = el('button', { className: 'run-name', type: 'button', onclick: e => { e.stopPropagation(); navigateToApp(runDetailUrl(r.run_id)); } }, runName);
          row.appendChild(el('td', { className: 'col-run-name' }, runBtn));
          row.appendChild(el('td', { className: 'col-run-date' }, fullDateTime(r.created_at || r.started_at)));
          row.appendChild(el('td', { className: 'col-run-model' }, r.model || '—'));
          const outputText = r.error ? ('ERROR: ' + r.error) : fullPreview(r.output);
          const outputWrap = el('div', { className: 'dsx-run-output-body' });
          const output = el('div', { className: 'dsx-item-run-output' }, outputText || '—');
          if (state.itemRunOutputsExpanded && outputText) {
            output.classList.add('expanded');
            row.classList.add('output-expanded');
          }
          outputWrap.appendChild(output);
          row.appendChild(el('td', { className: 'col-run-output' }, outputWrap));
          row.appendChild(el('td', { className: 'col-latency', style: { fontFamily: 'var(--font-mono)' } }, fmtSeconds(r.latency_ms)));
          const scoresByMetric = runScoreByMetric(r);
          metricNames.forEach(metric => {
            const score = scoresByMetric[metric];
            const value = score ? (score.score_numeric != null ? score.score_numeric : score.score_raw) : null;
            const peers = runs.map(run => {
              const peerScore = runScoreByMetric(run)[metric];
              return peerScore ? (peerScore.score_numeric != null ? peerScore.score_numeric : peerScore.score_raw) : null;
            });
            row.appendChild(el('td', { className: 'col-metric', title: score ? (score.explanation || score.label || '') : '' }, metricScoreNode(value, peers)));
          });
          const traceEndpoint = apiUrl('/api/runs/' + encodeURIComponent(r.run_id) + '/items/' + encodeURIComponent(r.item_id) + '/trace');
          row.appendChild(el('td', { className: 'col-run-trace' }, el('button', {
            className: 'dsx-trace-icon-btn trace-drawer-btn qym-icon-action',
            type: 'button',
            title: 'Open trace viewer',
            'aria-label': 'Open trace viewer',
            'data-trace-endpoint': traceEndpoint,
            'data-trace-item-label': runName + ' · ' + r.item_id,
            'data-trace-id': r.trace_id || '',
            'data-trace-url': r.trace_url || '',
            html: ICON_TRACE,
          })));
          return row;
        }
        function renderRunsTable(){
          const scrollLeft = wrap.scrollLeft;
          const columns = runTableColumns();
          const minTableWidth = columns.reduce((sum, column) => sum + (column.width || column.minWidth || 44), 0);
          window.QymDataTable.render({
            host: wrap,
            tableClass: 'dsx-table dsx-item-runs-table',
            storageKey: 'datasets.item.runs.v4',
            minWidth: Math.max(1120, minTableWidth),
            scrollLeft,
            columns,
            rows: sortedRuns(),
            sortState: sortStateFor,
            onSort: (_column, nextDir, sortKey) => {
              state.itemRunSort = sortValueFor(sortKey, nextDir);
              renderRunsTable();
            },
            renderRow: renderRunRow,
          });
          const outputHeader = wrap.querySelector('th.col-run-output');
          if (outputHeader) {
            const expanded = !!state.itemRunOutputsExpanded;
            const toggle = el('button', {
              className: 'tv-expand-btn dsx-output-expand-btn qym-icon-action',
              type: 'button',
              title: expanded ? 'Collapse outputs' : 'Expand outputs',
              'aria-label': expanded ? 'Collapse outputs' : 'Expand outputs',
              html: ICON_EXPAND,
            });
            toggle.addEventListener('click', e => {
              e.preventDefault();
              e.stopPropagation();
              state.itemRunOutputsExpanded = !state.itemRunOutputsExpanded;
              renderRunsTable();
            });
            outputHeader.appendChild(toggle);
          }
        }
        renderRunsTable();
      } catch(e) {
        host.innerHTML = '<div class="dsx-empty"><p>' + escapeHtml(e.message || 'Failed to load runs') + '</p></div>';
      }
    }

    async function openItemDrawerImpl(itemId){
      const v = state.activeVersion; if (!v) return;
      const isDraft = v.status === 'draft';
      // Update URL
      if (state.itemId !== itemId) { history.replaceState({}, '', buildUrl({ item: itemId })); state.itemId = itemId; }

      let item;
      try { const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(itemId) + '?project_slug=' + encodeURIComponent(state.slug)); item = resp.item; }
      catch(e) { Shell.toast(e.message || 'Failed to load item', 'error'); return; }

      const ddTab = { current: 'details' };
      const drawer = Shell.openDrawer({
        title: 'Item ' + item.item_id,
        subtitle: v.version + ' · index ' + item.index + ' · updated ' + relTime(item.updated_at),
        width: 600,
        headerActions: [
          { label: '←', title: 'Previous', onClick: () => navigateItem(-1) },
          { label: '→', title: 'Next', onClick: () => navigateItem(1) },
          { label: '⧉', title: 'Copy ID', onClick: () => copyToClipboard(item.item_id) },
        ],
        onClose: () => { history.replaceState({}, '', buildUrl({ item: null })); state.itemId = null; },
        onKey: (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
          const ae = document.activeElement;
          if (ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT' || ae.isContentEditable || ae.closest('.dsx-jsoneditor, [contenteditable]'))) return;
          if (e.key === 'j' || e.key === 'J') navigateItem(1);
          if (e.key === 'k' || e.key === 'K') navigateItem(-1);
        },
        render: (api) => render(api.body),
      });
      state.drawerApi = drawer;

      function render(host){
        host.classList.add('dsx-item-drawer-body');
        host.innerHTML = '';
        const tabs = el('div', { className: 'dsx-drawer-tabs qym-tabs', role: 'tablist', 'aria-label': 'Item drawer sections' });
        ['details', 'runs', 'history'].forEach(t => {
          const b = el('button', {
            className: 'dsx-drawer-tab qym-tabs__tab' + (ddTab.current === t ? ' active' : ''),
            type: 'button',
            role: 'tab',
            id: 'dsx-drawer-tab-' + t,
            'aria-controls': 'dsx-drawer-panel',
            'aria-selected': ddTab.current === t ? 'true' : 'false',
            onclick: () => {
              ddTab.current = t;
              render(host);
              document.getElementById('dsx-drawer-tab-' + t)?.focus({ preventScroll: true });
            },
          }, t[0].toUpperCase() + t.slice(1));
        tabs.appendChild(b);
        });
        host.appendChild(tabs);
        const body = el('div', {
          className: 'dsx-drawer-section',
          id: 'dsx-drawer-panel',
          role: 'tabpanel',
          'aria-labelledby': 'dsx-drawer-tab-' + ddTab.current,
        });
        if (ddTab.current === 'runs') body.classList.add('runs-compact');
        if (ddTab.current === 'details') renderDetails(body);
        else if (ddTab.current === 'runs') renderRuns(body);
        else renderHistory(body);
        host.appendChild(body);
      }

      function renderDetails(body){
        if (!isDraft) {
          const hint = el('div', { className: 'shell-form-help' });
          hint.innerHTML = 'This version is published. <button class="shell-btn shell-btn-primary" style="padding:4px 10px;margin-left:6px;font-size:var(--font-sm);">Create draft to edit</button>';
          hint.querySelector('button').addEventListener('click', () => { drawer.close(); createDraftFromVersionFlow(v.version); });
          body.appendChild(hint);
        }
        body.appendChild(buildJSONField('Input', 'input'));
        body.appendChild(buildJSONField('Expected output', 'expected_output'));
        body.appendChild(buildJSONField('Metadata', 'metadata'));

        if (isDraft) {
          const footer = el('div', { style: { display: 'flex', justifyContent: 'space-between', gap: '8px', marginTop: '12px' } });
          const delBtn = el('button', { className: 'shell-btn shell-btn-danger', onclick: deleteItem }, 'Delete');
          const saveBtn = el('button', { className: 'shell-btn shell-btn-primary', onclick: saveItem }, 'Save changes');
          footer.appendChild(delBtn); footer.appendChild(saveBtn);
          body.appendChild(footer);
        }
      }

      function fieldStatusDot(text, ok){
        const dot = el('div', { style: { textAlign: 'right', fontSize: 'var(--font-sm)', color: 'var(--text-muted)', marginTop: '4px' } });
        dot.innerHTML = '<span class="dsx-json-dot' + (ok ? '' : ' invalid') + '"></span> ' + text;
        return dot;
      }
      function buildJSONField(label, key){
        const wrap = el('div');
        const lbl = el('div', { className: 'field-label' });
        lbl.appendChild(el('span', null, label));
        const actions = el('div', { className: 'actions' });
        lbl.appendChild(actions);
        wrap.appendChild(lbl);

        const raw = fullPreview(item[key]);
        let expanded = false;
        const expandBtn = el('button', { title: 'Expand / collapse' }, '⤢ Expand');

        if (!isDraft) {
          // Read-only: colorized, full-height view (no cramped textarea).
          const view = el('pre', { className: 'dsx-json-view' + (raw === '' ? ' empty' : '') });
          if (raw === '') view.textContent = '(empty)';
          else view.innerHTML = highlightJSONHtml(raw);
          const copyBtn = el('button', { title: 'Copy' }, '⧉ Copy');
          copyBtn.addEventListener('click', () => copyToClipboard(raw));
          expandBtn.addEventListener('click', () => { expanded = !expanded; view.classList.toggle('expanded', expanded); expandBtn.textContent = expanded ? '⤡ Collapse' : '⤢ Expand'; });
          actions.appendChild(expandBtn); actions.appendChild(copyBtn);
          wrap.appendChild(view);
          const res = coerceCellValue(raw, key === 'metadata' ? 'metadata' : key, false);
          const kind = res.ok ? (typeof res.value === 'string' ? 'string' : (res.value === null ? 'empty' : 'valid JSON')) : (res.error || 'invalid');
          wrap.appendChild(fieldStatusDot(kind, res.ok));
          return wrap;
        }

        // Editable: syntax-highlight overlay behind a transparent, auto-growing textarea.
        const code = el('div', { className: 'dsx-code' });
        const hl = el('pre', { className: 'dsx-code-hl' });
        const ed = el('textarea', { className: 'dsx-code-input', spellcheck: 'false' });
        ed.value = raw;
        code.appendChild(hl); code.appendChild(ed);
        const dot = el('div', { style: { textAlign: 'right', fontSize: 'var(--font-sm)', color: 'var(--text-muted)', marginTop: '4px' } });

        function autoGrow(){
          ed.style.height = 'auto';
          const cap = expanded ? Infinity : Math.round(window.innerHeight * 0.55);
          ed.style.height = Math.max(92, Math.min(ed.scrollHeight, cap)) + 'px';
        }
        function sync(){ hl.innerHTML = highlightJSONHtml(ed.value) + '\n'; hl.scrollTop = ed.scrollTop; hl.scrollLeft = ed.scrollLeft; }
        function validate(){
          const res = coerceCellValue(ed.value, key === 'metadata' ? 'metadata' : key, false);
          if (!res.ok) { code.classList.add('invalid'); dot.innerHTML = '<span class="dsx-json-dot invalid"></span> ' + (res.error || 'invalid'); return; }
          code.classList.remove('invalid');
          const kind = typeof res.value === 'string' ? 'string' : (res.value === null ? 'empty' : 'valid JSON');
          dot.innerHTML = '<span class="dsx-json-dot"></span> ' + kind;
        }

        const copyBtn = el('button', { title: 'Copy' }, '⧉ Copy');
        copyBtn.addEventListener('click', () => copyToClipboard(ed.value));
        const formatBtn = el('button', { title: 'Format JSON' }, '{} Format');
        formatBtn.addEventListener('click', () => { try { ed.value = JSON.stringify(JSON.parse(ed.value), null, 2); sync(); autoGrow(); validate(); } catch(_) { Shell.toast('Not valid JSON', 'error'); } });
        expandBtn.addEventListener('click', () => { expanded = !expanded; code.classList.toggle('expanded', expanded); expandBtn.textContent = expanded ? '⤡ Collapse' : '⤢ Expand'; autoGrow(); });
        actions.appendChild(formatBtn); actions.appendChild(expandBtn); actions.appendChild(copyBtn);

        ed.addEventListener('input', () => { sync(); autoGrow(); validate(); });
        ed.addEventListener('scroll', () => { hl.scrollTop = ed.scrollTop; hl.scrollLeft = ed.scrollLeft; });
        sync(); validate();
        requestAnimationFrame(autoGrow);

        wrap.appendChild(code); wrap.appendChild(dot);
        ed.dataset.field = key;
        wrap._editor = ed;
        return wrap;
      }
      function collectValues(host){
        const body = {};
        const fields = host.querySelectorAll('.dsx-drawer-section > div');
        fields.forEach(f => {
          if (f._editor) {
            const key = f._editor.dataset.field;
            const kind = key === 'metadata' ? 'metadata' : key;
            const res = coerceCellValue(f._editor.value, kind, !!f._editor._forceString);
            if (!res.ok) throw new Error(res.error || ('Invalid value for ' + key));
            body[key] = res.value;
          }
        });
        return body;
      }
      async function saveItem(){
        try {
          const host = drawer.body;
          const body = collectValues(host);
          const upd = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '?project_slug=' + encodeURIComponent(state.slug), { method: 'PATCH', body });
          Object.assign(item, upd.item);
          Shell.toast('Saved', 'success');
          drawer.setSubtitle(v.version + ' · index ' + item.index + ' · updated ' + relTime(item.updated_at));
          if (typeof state.refreshItemRow === 'function') state.refreshItemRow(item);
        } catch(e) { Shell.toast(e.message || 'Save failed', 'error'); }
      }
      async function deleteItem(){
        const ok = await Shell.openConfirmDialog({ title: 'Delete item?', description: 'This will remove "' + item.item_id + '" from this draft.', confirmLabel: 'Delete', danger: true });
        if (!ok || !ok.confirmed) return;
        try {
          await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '?project_slug=' + encodeURIComponent(state.slug), { method: 'DELETE' });
          Shell.toast('Item deleted', 'success');

          refreshDetailView({ force: true });
        } catch(e) { Shell.toast(e.message || 'Delete failed', 'error'); }
      }

      async function renderRuns(body){
        body.innerHTML = '<div class="dsx-skel-row"><div class="dsx-skeleton" style="width:80%"></div></div>';
        try {
          const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '/runs?project_slug=' + encodeURIComponent(state.slug));
          body.innerHTML = '';
          const runs = resp.runs || [];
          if (runs.length === 0) { body.appendChild(el('div', { className: 'dsx-empty' }, [el('h3', null, 'No runs yet'), el('p', null, 'This item has not been used in any run.')])); return; }
          const agg = resp.aggregates || {};
          const aggWrap = el('div', { className: 'dsx-run-aggregate qym-stat-strip' });
          const aggTiles = [
            ['Runs', agg.run_count],
            ['Errors', agg.error_count || 0],
            ['Avg latency', fmtSeconds(agg.avg_latency_ms)],
          ];
          Object.keys(agg.metrics || {}).sort().forEach(metric => {
            const m = agg.metrics[metric] || {};
            aggTiles.push(['Avg ' + metric, metricScoreNode(m.avg)]);
          });
          aggTiles.forEach(([label, value]) => {
            aggWrap.appendChild(el('div', { className: 'tile qym-stat-strip__item' }, [
              el('div', { className: 'label qym-stat-strip__label' }, label),
              el('div', { className: 'value qym-stat-strip__value' }, value == null ? '—' : value),
            ]));
          });
          body.appendChild(aggWrap);

          const table = el('table', { className: 'dsx-run-result-table' });
          const thead = el('thead');
          const trh = el('tr');
          const metricNames = Array.from(new Set(runs.flatMap(r => (r.scores || []).map(s => s.metric_name)))).sort();
          ['Run name'].concat(metricNames).concat(['Latency']).forEach(h => trh.appendChild(el('th', null, h)));
          thead.appendChild(trh);
          table.appendChild(thead);
          const tbody = el('tbody');
          runs.forEach(r => {
            const row = el('tr');
            const runName = r.run_name || r.external_run_id || r.run_id;
            const runLink = el('button', { className: 'id run-link', type: 'button', onclick: e => { e.stopPropagation(); navigateToApp(runDetailUrl(r.run_id)); } }, runName);
            runLink.addEventListener('mouseenter', () => schedulePreviewPopover(runLink, runName));
            runLink.addEventListener('mouseleave', hidePreviewPopover);
            runLink.addEventListener('focus', () => showPreviewPopover(runLink, runName));
            runLink.addEventListener('blur', hidePreviewPopover);
            row.appendChild(el('td', null, [
              runLink,
            ]));
            const scoresByMetric = {};
            (r.scores || []).forEach(s => { scoresByMetric[s.metric_name] = s; });
            metricNames.forEach(metric => {
              const score = scoresByMetric[metric];
              row.appendChild(el('td', { style: { fontFamily: 'var(--font-mono)' } }, metricScoreNode(score ? (score.score_numeric != null ? score.score_numeric : score.score_raw) : null)));
            });
            row.appendChild(el('td', { style: { fontFamily: 'var(--font-mono)' } }, fmtSeconds(r.latency_ms)));
            tbody.appendChild(row);
          });
          table.appendChild(tbody);
          body.appendChild(table);
        } catch(e) { body.innerHTML = '<div class="dsx-empty"><p>'+escapeHtml(e.message || 'Failed to load runs')+'</p></div>'; }
      }

      // Build a stacked before→after diff for the fields that changed between two snapshots.
      const HISTORY_DIFF_FIELDS = [['input', 'input'], ['expected_output', 'expected'], ['metadata', 'metadata'], ['labels', 'labels']];
      function historyDiffBody(before, after){
        before = before || {}; after = after || {};
        const wrap = el('div', { className: 'dsx-hist-diff' });
        let changed = 0;
        HISTORY_DIFF_FIELDS.forEach(([key, label]) => {
          const b = before[key], a = after[key];
          const beforeStr = b == null ? '' : (typeof b === 'string' ? b : prettyJSON(b));
          const afterStr = a == null ? '' : (typeof a === 'string' ? a : prettyJSON(a));
          if (beforeStr === afterStr) return;
          changed++;
          const field = el('div', { className: 'dsx-hist-diff-field' });
          field.appendChild(el('div', { className: 'name' }, label));
          if (beforeStr !== '') field.appendChild(el('div', { className: 'dsx-hist-diff-pane before', html: '<span class="label">before</span>' + highlightDiff(beforeStr, afterStr, 'before') }));
          if (afterStr !== '') field.appendChild(el('div', { className: 'dsx-hist-diff-pane after', html: '<span class="label">after</span>' + highlightDiff(beforeStr, afterStr, 'after') }));
          wrap.appendChild(field);
        });
        if (!changed) wrap.appendChild(el('div', { className: 'dsx-history-unchanged' }, 'No field changes recorded.'));
        return wrap;
      }

      async function revertToRevision(r, body){
        const snap = (r.after && Object.keys(r.after).length) ? r.after : (r.before || {});
        const ok = await Shell.openConfirmDialog({ title: 'Revert item?', description: 'Restore this item to revision #' + r.revision_number + ' (' + r.change_type + '). This creates a new revision.', confirmLabel: 'Revert' });
        if (!ok || !ok.confirmed) return;
        try {
          const reqBody = { item_id: item.item_id, input: snap.input, expected_output: snap.expected_output, metadata: snap.metadata || {}, labels: snap.labels || [] };
          const upd = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '?project_slug=' + encodeURIComponent(state.slug), { method: 'PATCH', body: reqBody });
          Object.assign(item, upd.item);
          Shell.toast('Reverted to revision #' + r.revision_number, 'success');
          drawer.setSubtitle(v.version + ' · index ' + item.index + ' · updated ' + relTime(item.updated_at));
          if (typeof state.refreshItemRow === 'function') state.refreshItemRow(item);
          renderHistory(body);
        } catch(e) { Shell.toast(e.message || 'Revert failed', 'error'); }
      }

      async function renderHistory(body){
        body.innerHTML = '<div class="dsx-skel-row"><div class="dsx-skeleton" style="width:80%"></div></div>';
        try {
          const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '/lineage?project_slug=' + encodeURIComponent(state.slug));
          body.innerHTML = '';
          const lineage = resp.lineage || [];
          const hasAny = lineage.some(node => (node.revisions || []).length || node.item);
          if (!hasAny) { body.appendChild(el('div', { className: 'dsx-empty' }, [el('p', null, 'No lineage recorded for this item.')])); return; }
          lineage.forEach(node => {
            const version = node.version || {};
            const versionEntry = el('div', { className: 'dsx-history-entry' });
            const versionHead = el('div', { className: 'dsx-history-head' });
            versionHead.appendChild(el('span', null, [
              el('span', { className: 'qym-tag qym-tag--version', title: 'Version status: ' + (version.status || 'unknown') }, version.version || 'version'),
              document.createTextNode(' '),
              userLabelPill('Drafted By', version.created_by) || el('span', { className: 'actor' }, 'unknown'),
            ]));
            versionHead.appendChild(el('span', { className: 'when' }, relTime(version.published_at || version.created_at)));
            versionEntry.appendChild(versionHead);
            const revs = node.revisions || [];
            if (!node.item) {
              versionEntry.appendChild(el('div', { className: 'dsx-history-unchanged' }, 'Item is not present in this version.'));
            } else if (revs.length === 0) {
              versionEntry.appendChild(el('div', { className: 'dsx-history-unchanged' }, 'No direct edits recorded in this version.'));
            }
            body.appendChild(versionEntry);

            revs.slice().reverse().forEach(r => {
              const entry = el('div', { className: 'dsx-history-entry', style: { marginLeft: '14px' } });
              const head = el('div', { className: 'dsx-history-head' });
              head.appendChild(el('span', null, [
                el('span', { className: 'dsx-pill qym-badge ' + (r.change_type === 'created' ? 'success' : r.change_type === 'deleted' ? 'remove' : 'info') }, r.change_type),
                document.createTextNode(' '),
                el('span', { className: 'rev' }, '#' + r.revision_number),
                document.createTextNode(' '),
                userLabelPill('Edited By', r.actor) || el('span', { className: 'actor', title: r.actor_email || r.actor_user_id || '' }, r.actor_name || r.actor_email || r.actor_user_id || 'system'),
              ]));
              head.appendChild(el('span', { className: 'when' }, relTime(r.created_at)));
              entry.appendChild(head);
              entry.appendChild(historyDiffBody(r.before, r.after));
              if (isDraft) {
                const actions = el('div', { className: 'dsx-history-actions' });
                actions.appendChild(el('button', { className: 'shell-btn shell-btn-secondary', style: { padding: '4px 10px', fontSize: 'var(--font-sm)' }, onclick: () => revertToRevision(r, body) }, '↩ Revert to this'));
                entry.appendChild(actions);
              }
              body.appendChild(entry);
            });
          });
        } catch(e) { body.innerHTML = '<div class="dsx-empty"><p>'+escapeHtml(e.message || 'Failed to load history')+'</p></div>'; }
      }

      async function navigateItem(delta){
        try {
          const params = new URLSearchParams();
          params.set('project_slug', state.slug);
          if (state.search) params.set('search', state.search);
          if (state.sort) params.set('sort', state.sort);
          if (state.label) params.set('label', state.label);
          const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '/neighbors?' + params.toString());
          const target = delta < 0 ? resp.previous : resp.next;
          if (!target) {
            Shell.toast(delta < 0 ? 'Already at first item' : 'Already at last item', 'info');
            return;
          }
          drawer.close();
          openItemDrawer(target.item_id);
        } catch(e) {
          Shell.toast(e.message || 'Could not navigate item', 'error');
        }
      }
    }

    // -------------------------------------------------------------
    // RUNS TAB
    // -------------------------------------------------------------
    async function renderRunsTab(host){
      // The runs list tracks the version chosen in the hero version selector — switching versions
      // there re-renders this tab, so the runs always reflect the currently selected version.
      const activeLabel = state.activeVersion ? state.activeVersion.version : null;

      const listHost = el('div');
      host.appendChild(listHost);

      async function load(){
        listHost.innerHTML = '';
        const loading = el('div', { className: 'dsx-skel-row' }); loading.appendChild(el('div', { className: 'dsx-skeleton', style: { width: '80%' } })); listHost.appendChild(loading);
        try {
          const params = new URLSearchParams();
          params.set('project_slug', state.slug);
          params.set('limit', 100);
          if (activeLabel) params.set('version', activeLabel);
          const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/runs?' + params.toString());
          listHost.innerHTML = '';
          const runs = (resp.runs || []).filter(r => !activeLabel || r.version_label === activeLabel);
          if (runs.length === 0) {
            const empty = el('div', { className: 'dsx-empty' }, [
              el('div', { className: 'icon' }, '▷'),
              el('h3', null, 'No runs yet'),
              el('p', null, activeLabel
                ? ('No runs reference ' + activeLabel + ' yet.')
                : 'When you run an evaluation that references this dataset, it will appear here.'),
            ]);
            const acts = el('div', { className: 'dsx-empty-actions' });
            acts.appendChild(el('a', { className: 'shell-btn shell-btn-secondary', href: 'https://docs.qym.ai/cli/dataset', target: '_blank', rel: 'noopener' }, 'How to run a dataset →'));
            empty.appendChild(acts);
            listHost.appendChild(empty);
            return;
          }
          const tableWrap = el('div', { className: 'dsx-table-wrap flush' });
          const metricNames = (resp.metric_names && resp.metric_names.length)
            ? resp.metric_names
            : Array.from(new Set(runs.flatMap(r => Object.keys(r.metric_averages || {})))).sort();
          const columns = [
            { id: 'run_name', label: 'Run name', className: 'col-run-name', sortKey: 'run_name', width: 230, minWidth: 150, flex: 1 },
            { id: 'status', label: 'Status', className: 'col-run-status', sortKey: 'status', width: 118, minWidth: 92 },
            { id: 'created', label: 'Run date', className: 'col-run-date', sortKey: 'created', width: 150, minWidth: 120 },
            { id: 'model', label: 'Model', className: 'col-run-model', sortKey: 'model', width: 150, minWidth: 110 },
            { id: 'latency', label: 'Latency', className: 'col-latency', sortKey: 'latency', width: 94, minWidth: 92 },
          ];
          metricNames.forEach(metric => columns.push({ id: 'metric:' + metric, label: metric, className: 'col-metric', sortKey: 'metric:' + metric, width: metricColumnWidth(metric), minWidth: 72 }));
          columns.push({ id: 'actions', label: '', className: 'col-actions', width: 44, minWidth: 44, resizable: false });
          function currentSort(){
            const raw = state.datasetRunSort || 'created_desc';
            if (raw.startsWith('metric:')) {
              const parts = raw.split(':');
              return { key: 'metric:' + (parts[1] || ''), dir: parts[2] === 'asc' ? 'asc' : 'desc' };
            }
            const idx = raw.lastIndexOf('_');
            return idx > 0 ? { key: raw.slice(0, idx), dir: raw.slice(idx + 1) === 'asc' ? 'asc' : 'desc' } : { key: 'created', dir: 'desc' };
          }
          function sortStateFor(key){
            const sort = currentSort();
            return sort.key === key ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
          }
          function sortValue(r, key){
            const runName = r.run_name || r.external_run_id || r.id || '';
            if (key === 'run_name') return String(runName).toLowerCase();
            if (key === 'created') return new Date(r.started_at || r.completed_at || 0).getTime() || 0;
            if (key === 'model') return String(r.model || '').toLowerCase();
            if (key === 'status') return String(r.status || '').toLowerCase();
            if (key === 'latency') return r.avg_latency_ms == null ? null : Number(r.avg_latency_ms);
            if (key.startsWith('metric:')) {
              const metric = key.slice('metric:'.length);
              const value = (r.metric_averages || {})[metric];
              return value == null ? null : Number(value);
            }
            return String(runName).toLowerCase();
          }
          function sortedRuns(){
            const sort = currentSort();
            return runs.slice().sort((a, b) => {
              const av = sortValue(a, sort.key);
              const bv = sortValue(b, sort.key);
              const am = av == null || av === '';
              const bm = bv == null || bv === '';
              if (am !== bm) return am ? 1 : -1;
              let cmp = 0;
              if (typeof av === 'number' && typeof bv === 'number') cmp = av - bv;
              else cmp = String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: 'base' });
              if (cmp === 0) cmp = String(a.id || '').localeCompare(String(b.id || ''));
              return sort.dir === 'desc' ? -cmp : cmp;
            });
          }
          function sortValueFor(key, nextDir){
            if (key.startsWith('metric:')) return key + ':' + nextDir;
            return key + '_' + nextDir;
          }
          function renderRunsTable(){
            const scrollLeft = tableWrap.scrollLeft;
            const minTableWidth = columns.reduce((sum, column) => sum + (column.width || column.minWidth || 44), 0);
            window.QymDataTable.render({
              host: tableWrap,
              tableClass: 'dsx-table',
              storageKey: 'datasets.runs.v2',
              minWidth: Math.max(736, minTableWidth),
              scrollLeft,
              columns,
              rows: sortedRuns(),
              sortState: sortStateFor,
              onSort: (_column, nextDir, sortKey) => {
                state.datasetRunSort = sortValueFor(sortKey, nextDir);
                renderRunsTable();
              },
              renderRow: renderRunRow,
            });
          }
          function renderRunRow(r){
            const status = String(r.status || '—').toUpperCase();
            const runName = r.run_name || r.external_run_id || r.id;
            const tr = el('tr', { onclick: () => navigateToApp(runDetailUrl(r.id)) });
            tr.appendChild(el('td', { className: 'col-run-name' }, el('button', {
              className: 'run-name',
              type: 'button',
              title: runName,
              onclick: e => { e.stopPropagation(); navigateToApp(runDetailUrl(r.id)); },
            }, runName)));
            tr.appendChild(el('td', { className: 'col-run-status' }, [el('span', { className: 'status-badge qym-badge status-' + status, title: status }, status)]));
            tr.appendChild(el('td', { className: 'col-run-date' }, fullDateTime(r.started_at || r.completed_at)));
            tr.appendChild(el('td', { className: 'col-run-model' }, r.model || '—'));
            tr.appendChild(el('td', { className: 'col-latency', style: { fontFamily: 'var(--font-mono)' } }, fmtSeconds(r.avg_latency_ms)));
            metricNames.forEach(metric => {
              const value = (r.metric_averages || {})[metric];
              const peers = runs.map(candidate => (candidate.metric_averages || {})[metric]);
              tr.appendChild(el('td', { className: 'col-metric' }, metricScoreNode(value, peers)));
            });
            tr.appendChild(el('td', { className: 'col-actions' }, '→'));
            return tr;
          }
          listHost.appendChild(tableWrap);
          renderRunsTable();
        } catch(e) { listHost.innerHTML = ''; listHost.appendChild(el('div', { className: 'dsx-empty' }, [el('p', null, e.message || 'Failed to load runs')])); }
      }
      load();
    }

    // -------------------------------------------------------------
    // LINEAGE TAB
    // -------------------------------------------------------------
    // Turn a raw change_summary record into a human-readable {glyph, label, detail}.
    function describeChange(change, versionsById){
      const s = (change && change.change_summary) || {};
      const type = s.type || 'change';
      switch (type) {
        case 'created': {
          const from = s.from_version_id && versionsById[s.from_version_id];
          return { glyph: '✚', label: 'Created', detail: from ? ('forked from ' + from.version) : 'new dataset' };
        }
        case 'published':
          return { glyph: '✔', label: 'Published', detail: pluralize(s.item_count || 0, 'item') };
        case 'uploaded':
          return { glyph: '↑', label: 'Uploaded', detail: [
            s.source_type ? ('source: ' + s.source_type) : null,
            s.item_count != null ? pluralize(s.item_count, 'item') : null,
          ].filter(Boolean).join(' · ') };
        case 'alias_set':
          return { glyph: '★', label: 'Alias set', detail: s.alias || '' };
        default:
          return { glyph: '•', label: type, detail: '' };
      }
    }

    function renderChangeEntry(change, versionsById){
      const d = describeChange(change, versionsById);
      const row = el('div', { className: 'dsx-lineage-change' });
      row.appendChild(el('span', { className: 'glyph' }, d.glyph));
      row.appendChild(el('span', { className: 'ctype' }, d.label));
      if (d.detail) row.appendChild(el('span', { className: 'cdetail' }, d.detail));
      if (change.created_at) row.appendChild(el('span', { className: 'cwhen' }, relTime(change.created_at)));
      return row;
    }

    async function renderLineageTab(host){
      const wrap = el('div', { style: { padding: 'var(--space-lg) var(--space-xl)' } });
      const headerRow = el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '12px', marginBottom: '12px' } });
      const titleCol = el('div');
      titleCol.appendChild(el('h2', { style: { fontSize: 'var(--font-lg)', fontWeight: 650, margin: '0 0 4px 0' } }, 'Version history'));
      titleCol.appendChild(el('p', { className: 'shell-form-help', style: { margin: 0 } }, 'How each version descends from its parent, and what changed along the way. Click a version to open it.'));
      headerRow.appendChild(titleCol);
      wrap.appendChild(headerRow);
      host.appendChild(wrap);
      const skel = el('div', { className: 'dsx-skel-row' }); skel.appendChild(el('div', { className: 'dsx-skeleton', style: { width: '70%' } })); wrap.appendChild(skel);
      try {
        const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/lineage?project_slug=' + encodeURIComponent(state.slug));
        wrap.removeChild(skel);
        const versions = resp.versions || [];
        if (versions.length === 0) { wrap.appendChild(el('div', { className: 'dsx-empty' }, [el('p', null, 'No lineage data yet.')])); return; }

        // Index versions and render the parent/child tree.
        const byId = {}; versions.forEach(v => byId[v.id] = v);

        const lineage = el('div', { className: 'dsx-lineage' });
        const seen = new Set();
        const childrenByParent = {};
        versions.forEach(v => {
          if (v.parent_version_id && byId[v.parent_version_id]) {
            (childrenByParent[v.parent_version_id] = childrenByParent[v.parent_version_id] || []).push(v);
          }
        });
        Object.keys(childrenByParent).forEach(k => childrenByParent[k].sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0)));
        function renderNode(v){
          if (seen.has(v.id)) return null; // guard against cycles / multiple roots
          seen.add(v.id);
          const children = childrenByParent[v.id] || [];
          const node = el('div', { className: 'dsx-lineage-tree-node' + (children.length ? ' has-children' : '') });
          const row = el('div', { className: 'dsx-lineage-node' + (state.activeVersion && state.activeVersion.id === v.id ? ' active' : '') });
          // Same gutter pattern as the version picker: muted mono vN first, bold name after.
          row.appendChild(el('span', { style: { color: v.name ? 'var(--text-muted)' : 'var(--text-primary)', fontFamily: 'var(--font-mono)', fontWeight: v.name ? 500 : 650 } }, v.version));
          if (v.name) row.appendChild(el('span', { style: { fontWeight: 650 }, title: v.name + ' (' + v.version + ')' }, v.name));
          row.appendChild(el('span', { className: 'dsx-pill qym-badge ' + (v.status === 'draft' ? 'warning' : 'published') }, v.status));
          (v.aliases || []).forEach(a => row.appendChild(el('span', { className: 'qym-tag qym-tag--version' + (a === 'production' ? ' qym-tag--accent' : '') }, a)));
          row.appendChild(el('span', { className: 'dsx-lineage-meta' }, '· ' + pluralize(v.item_count || 0, 'item') + ' · ' + pluralize(v.run_count || 0, 'run')));
          const deltas = v.change_counts || {};
          const deltaWrap = el('span', { className: 'dsx-lineage-deltas' });
          const added = Number(deltas.added || 0);
          const deleted = Number(deltas.deleted || 0);
          const modified = Number(deltas.modified || 0);
          if (added) deltaWrap.appendChild(el('span', { className: 'qym-tag qym-tag--count qym-tag--success', title: 'Questions added relative to parent' }, '+' + added));
          if (deleted) deltaWrap.appendChild(el('span', { className: 'qym-tag qym-tag--count qym-tag--danger', title: 'Questions deleted relative to parent' }, '-' + deleted));
          if (modified) deltaWrap.appendChild(el('span', { className: 'qym-tag qym-tag--count qym-tag--warning', title: 'Questions modified relative to parent' }, '~' + modified));
          if (deltaWrap.childNodes.length) row.appendChild(deltaWrap);
          const publisherPill = userLabelPill('Published By', publishedByUser(v));
          if (publisherPill) row.appendChild(publisherPill);
          const creatorPill = userLabelPill('Drafted By', v.created_by);
          if (creatorPill) row.appendChild(creatorPill);
          const actions = el('span', { className: 'actions' });
          const parent = v.parent_version_id && byId[v.parent_version_id];
          if (parent) {
            actions.appendChild(el('button', {
              className: 'mini-action',
              onclick: e => {
                e.stopPropagation();
                navigate({ mode: 'compare', base: parent.version, head: v.version, item: null });
              }
            }, 'Compare'));
          }
          const times = el('span', { className: 'dsx-lineage-times' });
          if (v.created_at) times.appendChild(el('span', null, 'created ' + fullDate(v.created_at)));
          if (v.created_at && v.updated_at) times.appendChild(el('span', { className: 'sep' }, '·'));
          if (v.updated_at) times.appendChild(el('span', null, 'updated ' + relTime(v.updated_at)));
          actions.appendChild(times);
          row.appendChild(actions);
          row.addEventListener('click', () => navigate({ tab: 'lineage', v: v.version, item: null }));
          node.appendChild(row);

          if (children.length) {
            const childWrap = el('div', { className: 'dsx-lineage-children' });
            children.forEach(child => {
              const childNode = renderNode(child);
              if (childNode) childWrap.appendChild(childNode);
            });
            if (childWrap.childNodes.length) node.appendChild(childWrap);
          }
          return node;
        }
        const roots = versions.filter(v => !v.parent_version_id || !byId[v.parent_version_id]);
        roots.forEach(r => {
          const node = renderNode(r);
          if (node) lineage.appendChild(node);
        });
        // Render any versions not reached via the tree (orphans / cycles) flat.
        versions.forEach(v => {
          if (!seen.has(v.id)) {
            const node = renderNode(v);
            if (node) lineage.appendChild(node);
          }
        });
        wrap.appendChild(lineage);
      } catch(e) { if (wrap.contains(skel)) wrap.removeChild(skel); wrap.appendChild(el('div', { className: 'dsx-empty' }, [el('p', null, e.message || 'Failed to load lineage')])); }
    }

    async function createDraftFromVersionFlow(fromVersion, options){
      const fromOpts = [
        { value: '', label: '(blank)' },
        ...state.versions.map(v => ({ value: v.version, label: v.version + (v.name ? ' — ' + v.name : '') + (v.status === 'draft' ? ' (draft)' : '') + ((v.aliases || []).length ? ' [' + v.aliases.join(', ') + ']' : '') })),
      ];
      const res = await Shell.openFormDialog({
        title: 'Create draft ' + suggestNextVersion(),
        description: 'Version numbers are assigned automatically. Drafts are mutable; publishing snapshots the contents and assigns aliases.',
        confirmLabel: 'Create draft',
        fields: [
          { type: 'text', name: 'name', label: 'Name', placeholder: 'Optional — e.g. hard negatives', value: '' },
          { type: 'select', name: 'from', label: 'Copy items from', options: fromOpts, value: fromVersion || (state.activeVersion && state.activeVersion.version) || '' },
        ],
      });
      if (!res.confirmed) return;
      try {
        const body = {};
        if (res.values.name) body.name = res.values.name;
        if (res.values.from) body.from_version = res.values.from;
        const created = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions?project_slug=' + encodeURIComponent(state.slug), { method: 'POST', body });
        Shell.toast('Draft "' + created.version.version + '" created', 'success');
        if (options && options.itemId) navigate({ v: created.version.version, tab: 'details', item: options.itemId }, { forceReload: true });
        else navigate({ v: created.version.version, tab: 'items', item: null }, { forceReload: true });
      } catch(e) { Shell.toast(e.message || 'Create failed', 'error'); }
    }
    function suggestNextVersion(){
      const nums = state.versions.map(v => { const m = (v.version || '').match(/^v(\d+)$/); return m ? parseInt(m[1], 10) : 0; });
      const next = (nums.length ? Math.max.apply(null, nums) : 0) + 1;
      return 'v' + next;
    }
    async function publishCurrentVersion(){
      if (!state.activeVersion) return;
      publishVersion(state.activeVersion.version);
    }
    async function publishVersion(version){
      const res = await Shell.openFormDialog({
        title: 'Publish draft ' + version + '?',
        description: 'Review what will change before this draft becomes a published dataset version.',
        details: [
          { title: 'Snapshot draft ' + version, body: 'The current items are locked as a read-only version.' },
          { title: 'Future edits use a new draft', body: 'Published versions stay stable for comparisons and prior runs.' },
        ],
        confirmLabel: 'Publish draft',
        fields: [
          { type: 'checkbox', name: 'set_prod', label: 'Set as production', help: 'Move the production alias to ' + version + ' after publishing.', value: true },
        ],
      });
      if (!res.confirmed) return;
      try {
        const body = res.values.set_prod ? { set_alias: 'production' } : {};
        await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(version) + ':publish?project_slug=' + encodeURIComponent(state.slug), { method: 'POST', body });
        Shell.toast('Published ' + version, 'success');
        refreshDetailView({ force: true });
      } catch(e) { Shell.toast(e.message || 'Publish failed', 'error'); }

    async function setAsProductionFlow(){
      if (!state.activeVersion) return;
      setProduction(state.activeVersion.version);
    }
    async function setProduction(version){
      try { await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/aliases/production?project_slug=' + encodeURIComponent(state.slug), { method: 'POST', body: { version: version } }); Shell.toast('"production" → ' + version, 'success'); refreshDetailView({ force: true }); }
      catch(e) { Shell.toast(e.message || 'Failed', 'error'); }

    function openCompareFlow(){
      if (!state.activeVersion) return;
      const others = state.versions.filter(v => v.id !== state.activeVersion.id);
      if (others.length === 0) { Shell.toast('Need at least one other version to compare', 'info'); return; }
      // Default base = previous version by created_at
      const sorted = others.slice().sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      const base = sorted[0].version;
      navigate({ mode: 'compare', base: base, head: state.activeVersion.version });
    }
    async function openNewItemFlow(){
      const v = state.activeVersion; if (!v) return;
      const res = await Shell.openFormDialog({
        title: 'Add item',
        description: 'Item ID auto-generates if blank. Input and Expected accept plain text or JSON.',
        confirmLabel: 'Add',
        submittingLabel: 'Adding…',
        fields: [
          { type: 'text', name: 'item_id', label: 'Item ID', placeholder: '(auto)' },
          { type: 'textarea', name: 'input', label: 'Input', required: true },
          { type: 'textarea', name: 'expected_output', label: 'Expected output' },
          { type: 'textarea', name: 'metadata', label: 'Metadata (JSON)', placeholder: '{}',
            validate: m => { if (m && String(m).trim()) { try { JSON.parse(m); } catch(_) { return 'Metadata must be valid JSON.'; } } } },
        ],
        // Run validation and the API call while the dialog stays open, so a server-side
        // error keeps the user's input intact instead of closing and showing a toast.
        onSubmit: async (values) => {
          const body = {};
          if (values.item_id) body.item_id = values.item_id;
          body.input = tryParseJSON(values.input);
          if (values.expected_output) body.expected_output = tryParseJSON(values.expected_output);
          if (values.metadata) {
            try { body.metadata = JSON.parse(values.metadata); }
            catch(_) { throw new Error('Metadata must be valid JSON.'); }
          }
          await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items?project_slug=' + encodeURIComponent(state.slug), { method: 'POST', body });
        },
      });
      if (!res.confirmed) return;
      Shell.toast('Item added', 'success');
      refreshDetailView({ force: true });
    }
    function tryParseJSON(s){
      if (s == null) return null;
      const t = String(s).trim();
      if (!t) return null;
      if (t[0] === '{' || t[0] === '[' || t[0] === '"' || t === 'true' || t === 'false' || t === 'null' || !isNaN(parseFloat(t))) {
        try { return JSON.parse(t); } catch(_) { return s; }
      }
      return s;
    }

    function openContextMenu(anchor, items){
      // Close any open menu
      document.querySelectorAll('.dsx-context-menu').forEach(m => m.remove());
      // Reuse the platform's canonical row-action menu (.actions-menu / .actions-item) so dataset
      // overflow menus look identical to the ones on the runs/reviews tables. It is body-appended
      // and fixed-positioned (rather than the usual .actions-dropdown.open) so it escapes table clipping.
      const menu = el('div', { className: 'actions-menu dsx-context-menu' });
      menu.style.position = 'fixed';
      menu.style.display = 'block';
      menu.style.right = 'auto';
      menu.style.marginTop = '0';
      menu.style.zIndex = '9999';
      items.forEach(it => {
        if (it.sep) { menu.appendChild(el('hr')); return; }
        const b = el('a', { href: '#', className: 'actions-item' + (it.danger ? ' danger' : ''), onclick: e => { e.preventDefault(); e.stopPropagation(); menu.remove(); document.removeEventListener('click', off, true); it.onClick(); } });
        b.appendChild(el('span', null, it.label));
        menu.appendChild(b);
      });
      document.body.appendChild(menu);
      const r = anchor.getBoundingClientRect();
      const w = menu.offsetWidth || 200;
      menu.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.right - w)) + 'px';
      menu.style.top = (r.bottom + 4) + 'px';
      function off(e){ if (!menu.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) { menu.remove(); document.removeEventListener('click', off, true); } }
      setTimeout(() => document.addEventListener('click', off, true), 0);
    }

    // ============================================================
    // COMPARE VIEW
    // ============================================================
    function compareView(){
      const root = el('div', { className: 'dsx-page' });
      const hero = el('div', { className: 'dsx-compare-hero' });
      hero.appendChild(el('h1', { style: { margin: 0, fontSize: 'var(--font-title)', fontWeight: 650 } }, 'Compare versions'));
      hero.appendChild(el('p', { style: { color: 'var(--text-muted)', fontSize: 'var(--font-md)', margin: '4px 0 0 0' } }, state.dataset.name));
      const sels = el('div', { className: 'dsx-compare-selectors' });
      sels.appendChild(el('div', null, [el('label', { className: 'shell-form-label' }, 'Base'), versionPickerInline('base')]));
      const swap = el('button', { className: 'dsx-compare-swap', title: 'Swap', onclick: () => navigate({ base: state.headVersion, head: state.baseVersion }) }, '⇄');
      sels.appendChild(swap);
      sels.appendChild(el('div', null, [el('label', { className: 'shell-form-label' }, 'Head'), versionPickerInline('head')]));
      hero.appendChild(sels);

      const actions = el('div', { className: 'dsx-compare-actions' });
      const openBaseBtn = el('button', { className: 'shell-btn shell-btn-secondary', onclick: () => state.baseVersion && navigate({ mode: 'detail', tab: 'items', v: state.baseVersion, base: null, head: null }) }, 'Open base');
      const openHeadBtn = el('button', { className: 'shell-btn shell-btn-secondary', onclick: () => state.headVersion && navigate({ mode: 'detail', tab: 'items', v: state.headVersion, base: null, head: null }) }, 'Open head');
      const downloadBtn = el('button', { className: 'shell-btn shell-btn-secondary', onclick: () => downloadDiff() }, 'Download diff');
      if (!state.baseVersion) openBaseBtn.disabled = true;
      if (!state.headVersion) openHeadBtn.disabled = true;
      actions.appendChild(openBaseBtn);
      actions.appendChild(openHeadBtn);
      actions.appendChild(downloadBtn);
      hero.appendChild(actions);
      root.appendChild(hero);

      let lastCompareResp = null;
      async function downloadDiff(){
        if (!lastCompareResp) { Shell.toast('Nothing to download yet', 'info'); return; }
        const blob = new Blob([JSON.stringify(lastCompareResp, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (state.dataset.slug || state.datasetRef) + '_' + state.baseVersion + '_vs_' + state.headVersion + '.diff.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      const summary = el('div', { className: 'dsx-compare-summary qym-stat-strip', id: 'dsx-cmp-summary' });
      summary.innerHTML = '<div class="qym-stat-strip__item"><div class="dsx-skeleton" style="width:200px;height:18px"></div></div>';
      root.appendChild(summary);

      const tabsEl = el('div', {
        className: 'dsx-compare-tabs qym-tabs',
        id: 'dsx-cmp-tabs',
        role: 'tablist',
        'aria-label': 'Dataset comparison results',
      });
      root.appendChild(tabsEl);
      const listEl = el('div', {
        className: 'dsx-compare-list',
        id: 'dsx-cmp-list',
        role: 'tabpanel',
      });
      root.appendChild(listEl);

      loadCompare();
      return root;

      async function loadCompare(){
        if (!state.baseVersion || !state.headVersion) { listEl.innerHTML = '<div class="dsx-empty"><h3>Pick base and head versions to compare.</h3></div>'; return; }
        listEl.innerHTML = '<div class="dsx-skel-row"><div class="dsx-skeleton" style="width:60%"></div></div>';
        try {
          const url = '/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(state.headVersion) + ':compare?base=' + encodeURIComponent(state.baseVersion) + '&include_diffs=1&project_slug=' + encodeURIComponent(state.slug);
          const resp = await apiFetch(url);
          lastCompareResp = resp;
          renderCompareResult(resp);
        } catch(e) { listEl.innerHTML = '<div class="dsx-empty"><p>'+escapeHtml(e.message || 'Failed to compare')+'</p></div>'; }
      }

      function renderCompareResult(resp){
        const s = resp.summary || {};
        summary.innerHTML = '';
        [{ key: 'added', label: 'Added', cls: 'add' }, { key: 'removed', label: 'Removed', cls: 'rem' }, { key: 'changed', label: 'Changed', cls: 'chg' }, { key: 'unchanged', label: 'Unchanged', cls: '' }].forEach(stat => {
          const div = el('div', { className: 'stat qym-stat-strip__item ' + stat.cls });
          div.appendChild(el('span', { className: 'qym-stat-strip__label' }, stat.label));
          div.appendChild(el('strong', { className: 'qym-stat-strip__value' }, String(s[stat.key] || 0)));
          summary.appendChild(div);
        });

        // Tabs
        const tabKey = state._cmpTab || 'changed';
        listEl.setAttribute('aria-labelledby', 'dsx-cmp-tab-' + tabKey);
        tabsEl.innerHTML = '';
        const tabSpec = [['changed', 'Changed', s.changed || 0], ['added', 'Added', s.added || 0], ['removed', 'Removed', s.removed || 0], ['unchanged', 'Unchanged', s.unchanged || 0]];
        tabSpec.forEach(([k, lbl, n]) => {
        const b = el('button', {
          className: 'dsx-tab qym-tabs__tab' + (tabKey === k ? ' active' : ''),
          type: 'button',
          role: 'tab',
          id: 'dsx-cmp-tab-' + k,
          'aria-controls': 'dsx-cmp-list',
          'aria-selected': tabKey === k ? 'true' : 'false',
        });
          b.appendChild(document.createTextNode(lbl));
          b.appendChild(el('span', { className: 'count' }, '· ' + n));
          b.addEventListener('click', () => {
            state._cmpTab = k;
            renderCompareResult(resp);
            document.getElementById('dsx-cmp-tab-' + k)?.focus({ preventScroll: true });
          });
          tabsEl.appendChild(b);
        });

        listEl.innerHTML = '';
        if (tabKey === 'added') {
          (resp.added_items || []).forEach(it => listEl.appendChild(plainItemRow(it, 'add')));
          if (!resp.added_items || resp.added_items.length === 0) listEl.appendChild(el('div', { className: 'dsx-empty' }, [el('p', null, 'No items added.')]));
        } else if (tabKey === 'removed') {
          (resp.removed_items || []).forEach(it => listEl.appendChild(plainItemRow(it, 'remove')));
          if (!resp.removed_items || resp.removed_items.length === 0) listEl.appendChild(el('div', { className: 'dsx-empty' }, [el('p', null, 'No items removed.')]));
        } else if (tabKey === 'changed') {
          const diffs = resp.field_diffs || [];
          if (diffs.length === 0) listEl.appendChild(el('div', { className: 'dsx-empty' }, [el('p', null, 'No item-level changes.')]));
          diffs.forEach((d, idx) => listEl.appendChild(diffRow(d, idx)));
        } else {
          // unchanged: just count summary; rendering N items is heavy. Show a small note.
          listEl.appendChild(el('div', { className: 'dsx-empty' }, [el('p', null, pluralize(s.unchanged || 0, 'item') + ' unchanged between these versions.')]));
        }
      }

      function plainItemRow(it, kind){
        const row = el('div', { className: 'dsx-diff-row' });
        const head = el('div', { className: 'dsx-diff-head' });
        const ident = compareItemIdentity(it);
        head.appendChild(el('span', null, [
          el('span', { className: 'dsx-pill qym-badge ' + kind }, kind === 'add' ? '+ added' : '− removed'),
          document.createTextNode(' '),
          el('span', { className: 'dsx-diff-idlabel' }, ident.label),
          document.createTextNode(' '),
          el('span', { className: 'id', title: ident.title }, ident.value),
        ]));
        row.appendChild(head);
        row.addEventListener('click', () => row.classList.toggle('expanded'));
        const body = el('div', { className: 'dsx-diff-body' });
        if (it.input != null) body.appendChild(diffField('input', kind === 'add' ? null : it.input, kind === 'add' ? it.input : null));
        if (it.expected_output != null) body.appendChild(diffField('expected_output', kind === 'add' ? null : it.expected_output, kind === 'add' ? it.expected_output : null));
        row.appendChild(body);
        return row;
      }

      function diffRow(d, rowIndex){
        const row = el('div', { className: 'dsx-diff-row' });
        const head = el('div', { className: 'dsx-diff-head', onclick: () => row.classList.toggle('expanded') });
        const left = el('div', { className: 'dsx-diff-title' });
        const ident = compareItemIdentity(d, rowIndex);
        left.appendChild(el('div', { className: 'dsx-diff-idline' }, [
          el('span', { className: 'dsx-diff-idlabel' }, ident.label),
          el('span', { className: 'id', title: ident.title }, ident.value),
          el('button', { className: 'copy qym-icon-action', type: 'button', title: 'Copy full identifier', 'aria-label': 'Copy full identifier', onclick: e => { e.stopPropagation(); copyToClipboard(ident.copyValue); }, html: ICON_COPY }),
        ]));
        const fallbackEditor = (lastCompareResp && lastCompareResp.target)
          ? (lastCompareResp.target.created_by || lastCompareResp.target.published_by)
          : null;
        const editor = userLabelPill('Edited By', d.edited_by || fallbackEditor);
        if (editor) left.appendChild(el('div', { className: 'dsx-diff-meta' }, editor));
        head.appendChild(left);
        head.appendChild(el('span', { className: 'fields' }, 'fields changed: ' + (d.fields || []).join(', ')));
        row.appendChild(head);
        const body = el('div', { className: 'dsx-diff-body' });
        (d.fields || []).forEach(f => body.appendChild(diffField(f, (d.before || {})[f], (d.after || {})[f])));
        row.appendChild(body);
        return row;
      }

      function diffField(name, before, after){
        const f = el('div', { className: 'dsx-diff-field' });
        f.appendChild(el('div', { className: 'name' }, name));
        const beforeStr = before == null ? '' : (typeof before === 'string' ? before : prettyJSON(before));
        const afterStr = after == null ? '' : (typeof after === 'string' ? after : prettyJSON(after));
        f.appendChild(el('div', { className: 'dsx-diff-pane before', html: highlightDiff(beforeStr, afterStr, 'before') }));
        f.appendChild(el('div', { className: 'dsx-diff-pane after', html: highlightDiff(beforeStr, afterStr, 'after') }));
        return f;
      }

      function versionPickerInline(which){
        const sel = el('select', { className: 'filter-select', style: { minWidth: '180px', maxWidth: '220px', marginTop: '4px' } });
        sel.appendChild(el('option', { value: '' }, '— select —'));
        state.versions.slice().sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0)).forEach(v => {
          const o = el('option', { value: v.version }, v.version + ' (' + v.status + ')'); sel.appendChild(o);
        });
        sel.value = (which === 'base' ? state.baseVersion : state.headVersion) || '';
        sel.addEventListener('change', () => { const obj = {}; obj[which] = sel.value; navigate(obj); });
        return sel;
      }
    }

    // Tiny LCS-based word diff for highlighting
    function highlightDiff(a, b, side){
      const aw = (a || '').split(/(\s+)/); const bw = (b || '').split(/(\s+)/);
      const lcs = computeLCS(aw, bw);
      const out = [];
      let i = 0, j = 0, k = 0;
      while (i < aw.length || j < bw.length) {
        if (k < lcs.length && aw[i] === lcs[k] && bw[j] === lcs[k]) { out.push({ kind: 'same', txt: aw[i] }); i++; j++; k++; }
        else if (j < bw.length && (k >= lcs.length || bw[j] !== lcs[k])) { out.push({ kind: 'add', txt: bw[j] }); j++; }
        else if (i < aw.length && (k >= lcs.length || aw[i] !== lcs[k])) { out.push({ kind: 'del', txt: aw[i] }); i++; }
        else break;
      }
      return out.filter(t => side === 'before' ? t.kind !== 'add' : t.kind !== 'del').map(t => {
        if (t.kind === 'same') return escapeHtml(t.txt);
        if (t.kind === 'add') return '<span class="dsx-diff-added-tok">' + escapeHtml(t.txt) + '</span>';
        return '<span class="dsx-diff-removed-tok">' + escapeHtml(t.txt) + '</span>';
      }).join('');
    }
    function computeLCS(a, b){
      const n = a.length, m = b.length;
      if (n * m > 200000) { return []; } // bail on huge inputs
      const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
      for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) dp[i+1][j+1] = (a[i] === b[j]) ? dp[i][j] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
      const out = []; let i = n, j = m;
      while (i > 0 && j > 0) { if (a[i-1] === b[j-1]) { out.push(a[i-1]); i--; j--; } else if (dp[i-1][j] >= dp[i][j-1]) i--; else j--; }
      return out.reverse();
    }

    // Keep the legacy drawer opener available only for local debugging.
    const openItemDrawer = openItemDrawerImpl;

    // Expose for debugging / other scripts
    window.__dsx = { state, apiFetch, navigate, buildUrl, parsePath, appRootPath, appPath, routePathname, route, switchDetailTabFromRoute, el, escapeHtml, relTime, prettyJSON, parseJSONStrict, tokenize, fullPreview, debounce, copyToClipboard, resolveActiveVersion, openItemPage: (id) => navigate({ item: id, tab: 'details' }), openItemDrawer: (id) => openItemDrawer(id) };

    // ============================================================
    // BOOT
    // ============================================================
    if (window.QymAuth && typeof window.QymAuth.requireAuth === 'function') {
      window.QymAuth.requireAuth().then(() => route()).catch(() => {});
    } else {
      document.addEventListener('DOMContentLoaded', route);
      if (document.readyState !== 'loading') route();
    }
  })();
  </script>
