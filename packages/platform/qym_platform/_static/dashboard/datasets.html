    // ============================================================
    // UPLOAD WIZARD (3 steps)
    // ============================================================
    function openUploadWizard(opts){
      opts = opts || {};
      const mode = opts.mode || 'new'; // 'new' | 'add-to-draft'
      const targetVersionLabel = opts.versionLabel || null;

      const wstate = {
        step: 1,
        file: null,
        format: null,           // 'csv' | 'jsonl'
        csvDelimiter: ',',
        csvHeaders: [],
        csvRows: [],            // first 100 rows for preview
        jsonlRows: [],
        name: '',
        slug: '',
        description: '',
        versionName: '',
        publish: true,
        setAlias: true,
        mapping: { input: [], expected: [], id: '', metadata: [] },
        // for add-to-draft
        draftRef: opts.ref || state.datasetRef,
        draftVersion: targetVersionLabel,
      };

      // Modal scaffold via shell modal markup (rolled inline)
      const backdrop = el('div', { className: 'shell-modal-backdrop' });
      const modal = el('div', { className: 'shell-modal', style: { maxWidth: '780px', width: '100%' } });
      const header = el('div', { className: 'shell-modal-header' });
      const titleWrap = el('div');
      titleWrap.appendChild(el('div', { className: 'shell-modal-title', id: 'dsx-wiz-title' }, mode === 'new' ? 'Upload dataset' : 'Add items to draft'));
      titleWrap.appendChild(el('div', { className: 'shell-modal-subtitle', id: 'dsx-wiz-subtitle' }, 'Upload a CSV, TSV, or JSONL file.'));
      header.appendChild(titleWrap);
      const closeBtn = el('button', { className: 'shell-modal-close', onclick: close }, '×');
      header.appendChild(closeBtn);
      modal.appendChild(header);

      const steps = el('div', { className: 'dsx-wizard-steps' });
      const stepEls = ['Source', 'Map columns', 'Review'].map((label, i) => {
        const s = el('div', { className: 'dsx-wizard-step' + (i === 0 ? ' active' : '') });
        s.innerHTML = '<span class="num">' + (i + 1) + '</span>' + label;
        steps.appendChild(s);
        return s;
      });
      modal.appendChild(steps);

      const body = el('div', { className: 'shell-modal-body', id: 'dsx-wiz-body', style: { minHeight: '320px' } });
      modal.appendChild(body);

      const footer = el('div', { className: 'shell-modal-footer' });
      const backBtn = el('button', { className: 'shell-btn shell-btn-secondary', onclick: stepBack }, '← Back');
      const nextBtn = el('button', { className: 'shell-btn shell-btn-primary', onclick: stepNext }, 'Continue →');
      footer.appendChild(el('button', { className: 'shell-btn shell-btn-secondary', onclick: close }, 'Cancel'));
      const spacer = el('div', { style: { flex: 1 } });
      footer.appendChild(spacer);
      footer.appendChild(backBtn);
      footer.appendChild(nextBtn);
      modal.appendChild(footer);

      backdrop.appendChild(modal);
      document.body.appendChild(backdrop);
      requestAnimationFrame(() => backdrop.classList.add('shell-modal-open'));

      function close(){ backdrop.classList.remove('shell-modal-open'); setTimeout(() => backdrop.remove(), 200); }
      function updateSteps(){ stepEls.forEach((s, i) => { s.classList.toggle('active', wstate.step === i + 1); s.classList.toggle('done', wstate.step > i + 1); }); backBtn.style.visibility = wstate.step === 1 ? 'hidden' : 'visible'; nextBtn.textContent = wstate.step === 3 ? (mode === 'new' ? 'Create dataset' : 'Add items') : 'Continue →'; }
      function stepBack(){ if (wstate.step > 1) { wstate.step--; render(); } }
      function stepNext(){
        if (wstate.step === 1) {
          if (mode === 'new' && !wstate.name.trim()) { Shell.toast('Name is required', 'error'); return; }
          if (!wstate.file) { Shell.toast('Please choose a file', 'error'); return; }
          if (wstate.format === 'jsonl') { wstate.step = 3; render(); return; }
          wstate.step = 2; render(); return;
        }
        if (wstate.step === 2) {
          if (!wstate.mapping.input || !wstate.mapping.input.length) { Shell.toast('Assign at least one Input column', 'error'); return; }
          wstate.step = 3; render(); return;
        }
        if (wstate.step === 3) { submit(); return; }
      }

      function render(){
        updateSteps();
        body.innerHTML = '';
        if (wstate.step === 1) body.appendChild(renderStep1());
        else if (wstate.step === 2) body.appendChild(renderStep2());
        else body.appendChild(renderStep3());
      }

      function renderStep1(){
        const wrap = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '14px' } });
        if (mode === 'new') {
          const nameField = el('div', { className: 'shell-form-field' });
          nameField.appendChild(el('label', { className: 'shell-form-label' }, 'Name *'));
          const nameInput = el('input', { className: 'shell-form-input', placeholder: 'e.g. Customer Support QA', value: wstate.name });
          nameInput.addEventListener('input', e => { wstate.name = e.target.value; });
          nameField.appendChild(nameInput);
          wrap.appendChild(nameField);

          const descField = el('div', { className: 'shell-form-field' });
          descField.appendChild(el('label', { className: 'shell-form-label' }, 'Description'));
          const descInput = el('textarea', { className: 'shell-form-input', rows: 2, placeholder: 'Optional', style: { resize: 'vertical' } });
          descInput.value = wstate.description;
          descInput.addEventListener('input', e => { wstate.description = e.target.value; });
          descField.appendChild(descInput);
          wrap.appendChild(descField);
        } else {
          wrap.appendChild(el('div', { className: 'shell-form-help' }, 'Items will be added to version "' + (wstate.draftVersion || state.versionLabel || 'current draft') + '" of "' + (state.dataset && state.dataset.name) + '".'));
        }

        const fileField = el('div', { className: 'shell-form-field' });
        fileField.appendChild(el('label', { className: 'shell-form-label' }, 'File (CSV, TSV, or JSONL) *'));
        const drop = el('div', { className: 'dsx-file-drop' });
        const fileInput = el('input', { type: 'file', accept: '.csv,.tsv,.txt,.jsonl,.json,text/csv,text/tab-separated-values,text/plain,application/json' });
        const dropMsg = el('div', { html: '<strong>Drag & drop</strong> or <span style="color:var(--accent-primary)">click to browse</span>' });
        drop.appendChild(fileInput);
        drop.appendChild(dropMsg);
        const fileNameEl = el('div', { className: 'filename' }, wstate.file ? wstate.file.name : '');
        drop.appendChild(fileNameEl);
        drop.addEventListener('click', () => fileInput.click());
        ['dragover','dragenter'].forEach(evt => drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.add('dragover'); }));
        ['dragleave','dragend','drop'].forEach(evt => drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.remove('dragover'); }));
        drop.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
        fileField.appendChild(drop);

        const fmtNote = el('div', { className: 'shell-form-help', id: 'dsx-wiz-fmt', style: { marginTop: '8px', padding: '2px 0' } });
        fmtNote.innerHTML = 'Detected format: <strong>' + (wstate.format ? wstate.format.toUpperCase() : '—') + '</strong>';
        fileField.appendChild(fmtNote);
        wrap.appendChild(fileField);
        return wrap;

        function handleFile(file){
          wstate.file = file;
          fileNameEl.textContent = file.name;
          const lower = file.name.toLowerCase();
          if (lower.endsWith('.jsonl') || lower.endsWith('.json')) { wstate.format = 'jsonl'; parseJSONL(file); }
          else { wstate.format = 'csv'; parseCSV(file); }
          fmtNote.innerHTML = 'Detected format: <strong>' + wstate.format.toUpperCase() + '</strong>';
          if (mode === 'new' && !wstate.name) {
            wstate.name = file.name.replace(/\.(csv|tsv|txt|jsonl|json)$/i, '');
            const nameInp = wrap.querySelector('input.shell-form-input');
            if (nameInp) nameInp.value = wstate.name;
          }
        }
      }

      function parseCSV(file){
        const reader = new FileReader();
        reader.onload = () => {
          const text = decodeCSVBuffer(reader.result);
          wstate.csvDelimiter = detectCSVDelimiter(text);
          const rows = csvParseLite(text, wstate.csvDelimiter);
          wstate.csvHeaders = rows.length
            ? rows[0].map((header, index) => index === 0 ? header.replace(/^\uFEFF/, '').trim() : header.trim())
            : [];
          wstate.csvRows = rows.slice(1, 101);
          // auto-map
          autoMap();
        };
        reader.readAsArrayBuffer(file);
      }
      function parseJSONL(file){
        const reader = new FileReader();
        reader.onload = () => {
          const text = String(reader.result || '');
          const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0).slice(0, 100);
          wstate.jsonlRows = lines.map(l => { try { return JSON.parse(l); } catch(_) { return null; } }).filter(Boolean);
        };
        reader.readAsText(file);
      }
      function decodeCSVBuffer(buffer){
        const bytes = new Uint8Array(buffer || new ArrayBuffer(0));
        if (bytes[0] === 0xff && bytes[1] === 0xfe) {
          return new TextDecoder('utf-16le').decode(bytes);
        }
        if (bytes[0] === 0xfe && bytes[1] === 0xff) {
          return new TextDecoder('utf-16be').decode(bytes);
        }
        try {
          return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        } catch (_) {
          return new TextDecoder('windows-1252').decode(bytes);
        }
      }
      function detectCSVDelimiter(text){
        const candidates = [',', ';', '\t', '|'];
        let best = { delimiter: ',', score: -1 };
        candidates.forEach(delimiter => {
          const rows = csvParseLite(text.slice(0, 65536), delimiter)
            .filter(row => row.some(cell => String(cell || '').trim()))
            .slice(0, 20);
          if (!rows.length || rows[0].length < 2) return;
          const width = rows[0].length;
          const matching = rows.filter(row => row.length === width).length;
          const score = matching * 100 - (rows.length - matching) * 100 + width;
          if (score > best.score) best = { delimiter, score };
        });
        return best.delimiter;
      }
      function csvParseLite(text, delimiter){
        // Minimal RFC-4180-ish CSV parser
        delimiter = delimiter || ',';
        const rows = []; let row = []; let cell = ''; let inQ = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (inQ) {
            if (ch === '"' && text[i+1] === '"') { cell += '"'; i++; }
            else if (ch === '"') { inQ = false; }
            else { cell += ch; }
          } else {
            if (ch === '"') { inQ = true; }
            else if (ch === delimiter) { row.push(cell); cell = ''; }
            else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
            else if (ch === '\r') { /* skip */ }
            else { cell += ch; }
          }
        }
        if (cell.length || row.length) { row.push(cell); rows.push(row); }
        return rows;
      }
      function autoMap(){
        // Best-effort detection of the core fields by column name. Anything we don't
        // recognise stays unassigned in the "Available columns" bank — we never silently
        // dump every leftover column into Metadata.
        const h = wstate.csvHeaders.map(s => s.toLowerCase());
        const find = (...names) => { for (const n of names) { const i = h.indexOf(n); if (i !== -1) return wstate.csvHeaders[i]; } return ''; };
        const inputCol = find('input', 'question', 'prompt', 'text');
        const expectedCol = find('expected_output', 'expected', 'answer', 'output', 'target', 'label');
        wstate.mapping.input = inputCol ? [inputCol] : [];
        wstate.mapping.expected = expectedCol ? [expectedCol] : [];
        wstate.mapping.id = find('id', 'item_id', 'example_id');
        wstate.mapping.metadata = [];
      }

      function rerenderStep2(){ body.innerHTML = ''; body.appendChild(renderStep2()); }
      // Move a column out of every field assignment (back to the unassigned bank).
      function unassignColumn(col){
        if (wstate.mapping.id === col) wstate.mapping.id = '';
        ['input', 'expected', 'metadata'].forEach(k => { wstate.mapping[k] = (wstate.mapping[k] || []).filter(c => c !== col); });
      }

      function renderStep2(){
        const wrap = el('div', { className: 'dsx-mapping' });

        const bank = el('div', { className: 'dsx-mapping-bank' });
        bank.appendChild(el('div', { className: 'dsx-mapping-field-label' }, 'Available columns'));
        const usedSet = new Set([wstate.mapping.id, ...(wstate.mapping.input || []), ...(wstate.mapping.expected || []), ...(wstate.mapping.metadata || [])].filter(Boolean));
        const unassigned = wstate.csvHeaders.filter(col => !usedSet.has(col));
        const bankChips = el('div', { className: 'dsx-mapping-field-value' });
        if (!unassigned.length) {
          bankChips.appendChild(el('span', { className: 'dsx-mapping-field-empty' }, 'All columns assigned — drag one here to unassign.'));
        } else {
          unassigned.forEach(col => bankChips.appendChild(draggableColumn(col)));
        }
        bank.appendChild(bankChips);
        // The bank itself is a drop target: drop a chip here to unassign it.
        bank.addEventListener('dragover', e => { e.preventDefault(); bank.classList.add('over'); });
        bank.addEventListener('dragleave', () => bank.classList.remove('over'));
        bank.addEventListener('drop', e => {
          e.preventDefault(); bank.classList.remove('over');
          const col = e.dataTransfer.getData('text/plain'); if (!col) return;
          unassignColumn(col); rerenderStep2();
        });

        const fields = el('div', { className: 'dsx-mapping-fields' });
        fields.appendChild(mappingTarget('id', 'Item ID', 'single'));
        fields.appendChild(mappingTarget('input', 'Input *', 'multi'));
        fields.appendChild(mappingTarget('expected', 'Expected output', 'multi'));
        fields.appendChild(mappingTarget('metadata', 'Metadata', 'multi'));

        const remap = el('button', { className: 'shell-btn shell-btn-secondary', title: 'Guess Input / Expected / Item ID from the column names', onclick: () => { autoMap(); rerenderStep2(); }, style: { alignSelf: 'flex-start', marginTop: '8px' } }, '✨ Auto-detect columns');

        wrap.appendChild(bank);
        wrap.appendChild(fields);
        const outer = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px' } });
        outer.appendChild(el('div', { className: 'shell-form-help' }, 'Drag columns into a field, between fields, or back to the left to unassign. Unassigned columns are not imported.'));
        outer.appendChild(wrap);
        outer.appendChild(remap);
        return outer;

        // A draggable chip representing a single column. Used both in the bank and inside fields.
        function draggableColumn(col, onRemove){
          const chip = el('span', { className: 'dsx-chip-item dsx-mapping-chip', draggable: true });
          chip.appendChild(document.createTextNode(col));
          if (onRemove) chip.appendChild(el('button', { title: 'Unassign', onclick: e => { e.stopPropagation(); onRemove(); } }, '×'));
          chip.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', col); e.dataTransfer.effectAllowed = 'move'; chip.classList.add('dragging'); });
          chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
          return chip;
        }

        function mappingTarget(key, label, kind){
          const t = el('div', { className: 'dsx-mapping-field' });
          const lbl = el('div', { className: 'dsx-mapping-field-label' });
          lbl.appendChild(el('span', null, label));
          const value = el('div', { className: 'dsx-mapping-field-value' });
          renderValue();
          t.appendChild(lbl);
          t.appendChild(value);
          t.addEventListener('dragover', e => { e.preventDefault(); t.classList.add('over'); });
          t.addEventListener('dragleave', () => t.classList.remove('over'));
          t.addEventListener('drop', e => {
            e.preventDefault(); t.classList.remove('over');
            const col = e.dataTransfer.getData('text/plain'); if (!col) return;
            unassignColumn(col);
            if (kind === 'single') wstate.mapping[key] = col;
            else { wstate.mapping[key] = (wstate.mapping[key] || []); if (!wstate.mapping[key].includes(col)) wstate.mapping[key].push(col); }
            rerenderStep2();
          });
          return t;

          function renderValue(){
            value.innerHTML = '';
            if (kind === 'single') {
              const v = wstate.mapping[key];
              if (!v) value.appendChild(el('span', { className: 'dsx-mapping-field-empty' }, 'Drop a column here'));
              else value.appendChild(draggableColumn(v, () => { wstate.mapping[key] = ''; rerenderStep2(); }));
            } else {
              const list = wstate.mapping[key] || [];
              if (!list.length) value.appendChild(el('span', { className: 'dsx-mapping-field-empty' }, 'Drop columns here'));
              else list.forEach(col => value.appendChild(draggableColumn(col, () => { wstate.mapping[key] = list.filter(x => x !== col); rerenderStep2(); })));
              // input/expected combine multiple columns into a JSON object keyed by column name.
              if ((key === 'input' || key === 'expected') && list.length > 1) {
                value.appendChild(el('span', { className: 'dsx-mapping-field-empty', style: { flexBasis: '100%', fontStyle: 'normal', color: 'var(--text-muted)' } }, '→ combined into a JSON object: { ' + list.join(', ') + ' }'));
              }
            }
          }
        }
      }

      function renderStep3(){
        const wrap = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '14px' } });
        if (mode === 'new') {
          const verField = el('div', { className: 'shell-form-field' });
          verField.appendChild(el('label', { className: 'shell-form-label' }, 'Version name'));
          const verIn = el('input', { className: 'shell-form-input', value: wstate.versionName, placeholder: 'Optional — e.g. initial import' });
          verIn.addEventListener('input', e => { wstate.versionName = e.target.value; });
          verField.appendChild(verIn);
          verField.appendChild(el('div', { className: 'shell-form-help' }, 'Uploaded as version v1 — version numbers are assigned automatically.'));
          wrap.appendChild(verField);

          const opts = el('div', { style: { display: 'flex', gap: '14px', flexWrap: 'wrap' } });
          opts.appendChild(checkbox('Publish immediately', wstate.publish, v => { wstate.publish = v; }));
          opts.appendChild(checkbox('Set as production alias', wstate.setAlias, v => { wstate.setAlias = v; }));
          wrap.appendChild(opts);
        }

        const summary = el('div', { className: 'shell-form-help' });
        let rowCount = wstate.format === 'csv' ? wstate.csvRows.length : wstate.jsonlRows.length;
        summary.innerHTML = '<strong>' + (wstate.file ? wstate.file.name : '—') + '</strong> · '
          + (wstate.format ? wstate.format.toUpperCase() : '—') + ' · '
          + 'preview shows first ' + rowCount + ' row' + (rowCount === 1 ? '' : 's');
        wrap.appendChild(summary);

        // Preview
        const previewWrap = el('div', { className: 'dsx-preview-table' });
        const tbl = el('table');
        const thead = el('thead'); const trh = el('tr');
        let headers = [];
        if (wstate.format === 'csv') headers = wstate.csvHeaders;
        else if (wstate.jsonlRows.length) {
          const seen = new Set(); wstate.jsonlRows.slice(0, 10).forEach(r => Object.keys(r || {}).forEach(k => seen.add(k)));
          headers = Array.from(seen);
        }
        headers.slice(0, 6).forEach(h => trh.appendChild(el('th', null, h)));
        thead.appendChild(trh); tbl.appendChild(thead);
        const tbody = el('tbody');
        const previewRows = wstate.format === 'csv' ? wstate.csvRows.slice(0, 10) : wstate.jsonlRows.slice(0, 10);
        previewRows.forEach(r => {
          const tr = el('tr');
          headers.slice(0, 6).forEach(h => {
            let v;
            if (wstate.format === 'csv') { const idx = wstate.csvHeaders.indexOf(h); v = idx >= 0 ? r[idx] : ''; }
            else { v = r[h]; if (v != null && typeof v === 'object') v = JSON.stringify(v); }
            tr.appendChild(el('td', null, v == null ? '' : String(v).slice(0, 120)));
          });
          tbody.appendChild(tr);
        });
        tbl.appendChild(tbody);
        previewWrap.appendChild(tbl);
        wrap.appendChild(previewWrap);
        return wrap;
      }

      function checkbox(label, checked, onChange){
        const wrap = el('label', { style: { display: 'inline-flex', alignItems: 'center', gap: '6px', cursor: 'pointer', fontSize: 'var(--font-md)', color: 'var(--text-secondary)' } });
        const cb = el('input', { type: 'checkbox' });
        cb.checked = !!checked;
        cb.addEventListener('change', () => onChange(cb.checked));
        wrap.appendChild(cb);
        wrap.appendChild(document.createTextNode(label));
        return wrap;
      }

      async function submit(){
        nextBtn.disabled = true; nextBtn.innerHTML = '<span class="dsx-spinner"></span> Working...';
        try {
          if (mode === 'new') {
            const fd = new FormData();
            fd.append('project_slug', state.slug);
            fd.append('name', wstate.name);
            if (wstate.description) fd.append('description', wstate.description);
            if (wstate.versionName) fd.append('version_name', wstate.versionName);
            if (wstate.publish) fd.append('publish', 'true');
            if (wstate.publish && wstate.setAlias) fd.append('set_alias', 'production');
            if (wstate.format === 'csv') {
              if (wstate.mapping.input && wstate.mapping.input.length) fd.append('input_cols', wstate.mapping.input.join(','));
              if (wstate.mapping.expected && wstate.mapping.expected.length) fd.append('expected_cols', wstate.mapping.expected.join(','));
              if (wstate.mapping.id) fd.append('id_col', wstate.mapping.id);
              if (wstate.mapping.metadata && wstate.mapping.metadata.length) fd.append('metadata_cols', wstate.mapping.metadata.join(','));
            }
            fd.append('file', wstate.file);
            const created = await apiFetch('/v1/datasets:upload', { method: 'POST', body: fd });
            const totalItems = (created.version && created.version.item_count) || '?';
            Shell.toast('Dataset "' + (created.dataset.name) + '" created · ' + pluralize(totalItems, 'item'), 'success');
            close();
            navigate({ mode: 'detail', ref: created.dataset.slug, tab: 'items', v: null, item: null });
          } else {
            // Add items to existing draft: build bulk upserts
            const upserts = [];
            if (wstate.format === 'csv') {
              wstate.csvRows.forEach(r => {
                const get = (col) => { const i = wstate.csvHeaders.indexOf(col); return i >= 0 ? r[i] : null; };
                // One column → raw value; multiple columns → JSON object keyed by column name.
                const combine = (cols) => {
                  if (!cols || !cols.length) return undefined;
                  if (cols.length === 1) return get(cols[0]);
                  const o = {}; cols.forEach(c => { o[c] = get(c); }); return o;
                };
                const entry = {};
                if (wstate.mapping.id && get(wstate.mapping.id)) entry.item_id = get(wstate.mapping.id);
                entry.input = combine(wstate.mapping.input) ?? null;
                if (wstate.mapping.expected && wstate.mapping.expected.length) entry.expected_output = combine(wstate.mapping.expected);
                if (wstate.mapping.metadata && wstate.mapping.metadata.length) {
                  const meta = {}; wstate.mapping.metadata.forEach(c => { meta[c] = get(c); });
                  entry.metadata = meta;
                }
                upserts.push(entry);
              });
            } else {
              wstate.jsonlRows.forEach(r => {
                const entry = {};
                if (r.item_id) entry.item_id = r.item_id;
                entry.input = r.input;
                if (r.expected_output !== undefined) entry.expected_output = r.expected_output;
                if (r.metadata) entry.metadata = r.metadata;
                if (r.labels) entry.labels = r.labels;
                upserts.push(entry);
              });
            }
            const ref = wstate.draftRef;
            const ver = wstate.draftVersion || state.versionLabel;
            const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(ref) + '/versions/' + encodeURIComponent(ver) + '/items:bulk?project_slug=' + encodeURIComponent(state.slug), { method: 'POST', body: { upserts: upserts } });
            Shell.toast(pluralize(resp.summary.created + resp.summary.updated, 'item') + ' added', 'success');
            close();
            refreshDetailView({ force: true });
          }
        } catch(e) {
          Shell.toast(e.message || 'Upload failed', 'error');
          nextBtn.disabled = false; nextBtn.textContent = wstate.step === 3 ? (mode === 'new' ? 'Create dataset' : 'Add items') : 'Continue →';
        }
      }

      render();
      backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });
      document.addEventListener('keydown', function escClose(e){ if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escClose); } });
    }

    // ============================================================
    // DETAIL VIEW
    // ============================================================
    function detailView(){
      const root = el('div', { className: 'dsx-page' });
      root.appendChild(buildHero());
      root.appendChild(buildTabs());
      const tabContent = el('div', {
        id: 'dsx-tab-content',
        className: 'dsx-content tight',
        role: 'tabpanel',
        'aria-labelledby': 'dsx-detail-tab-' + state.tab,
        style: { padding: 0 },
      });
      root.appendChild(tabContent);
      // dispatch to tab
      renderTabContent(tabContent);
      return root;
    }

    function fillHeroMeta(meta){
      meta.innerHTML = '';
      meta.appendChild(el('span', null, pluralize((state.versions || []).length, 'version')));
      meta.appendChild(el('span', { className: 'dot' }));
      meta.appendChild(el('span', null, pluralize(state.dataset.run_count || 0, 'run')));

      // Lineage, in context: where the active version came from. The full tree lives on the Lineage tab.
      const av = state.activeVersion;
      if (av) {
        meta.appendChild(el('span', { className: 'dot' }));
        meta.appendChild(el('span', null, pluralize(av.item_count || 0, 'item')));
        const parent = av.parent_version_id && (state.versions || []).find(x => x.id === av.parent_version_id);
        if (parent) {
          meta.appendChild(el('span', { className: 'dot' }));
          const link = el('span', { style: { cursor: 'pointer', color: 'var(--accent-secondary)' }, title: 'View lineage', onclick: () => navigate({ tab: 'lineage' }) }, 'forked from ' + parent.version);
          meta.appendChild(link);
        }
        if (av.source_type) {
          meta.appendChild(el('span', { className: 'dot' }));
          meta.appendChild(el('span', null, 'source: ' + av.source_type));
        }
        const publisherPill = userLabelPill('Published By', publishedByUser(av));
        if (publisherPill) {
          meta.appendChild(el('span', { className: 'dot' }));
          meta.appendChild(publisherPill);
        }
        const creatorPill = userLabelPill('Drafted By', av.created_by);
        if (creatorPill) {
          meta.appendChild(el('span', { className: 'dot' }));
          meta.appendChild(creatorPill);
        }
      }
      if (state.dataset.updated_at) {
        meta.appendChild(el('span', { className: 'dot' }));
        meta.appendChild(el('span', null, 'updated ' + relTime(state.dataset.updated_at)));
      }
    }

    function versionIsDraft(v){ return v && v.status === 'draft'; }
    function getProductionVersion(){
      const versions = state.versions || [];
      const byAlias = versions.find(v => (v.aliases || []).includes('production'));
      if (byAlias) return byAlias;
      const prod = state.dataset && state.dataset.production_version;
      if (!prod) return null;
      return versions.find(v => v.id === prod.id || v.version === prod.version) || prod;
    }
    function versionIsProduction(v){
      if (!v) return false;
      if ((v.aliases || []).includes('production')) return true;
      const prod = getProductionVersion();
      return !!prod && (v.id === prod.id || v.version === prod.version);
    }
    function versionStateLabel(v){
      if (!v) return 'No versions';
      if (versionIsDraft(v)) return 'Draft';
      return versionIsProduction(v) ? 'Production' : 'Published';
    }
    function versionStatePillClass(v){
      if (versionIsDraft(v)) return 'warning';
      if (versionIsProduction(v)) return 'success';
      return 'published';
    }
    function sortedVersionsDesc(versions){
      return (versions || []).slice().sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
    }

    function fillHeroActions(right){
      right.innerHTML = '';
      right.appendChild(versionSelectorPill());
      const v = state.activeVersion;
      if (!v) {
        // No versions yet: the only meaningful action is creating the first draft.
        right.appendChild(el('button', { className: 'shell-btn shell-btn-primary', onclick: () => createDraftFromVersionFlow() }, '+ Create first draft'));
        return;
      }
      const isDraft = versionIsDraft(v);
      const isProd = versionIsProduction(v);

      if (isDraft) {
        right.appendChild(el('button', { className: 'shell-btn shell-btn-secondary', onclick: () => openNewItemFlow() }, '+ Add item'));
        right.appendChild(el('button', { className: 'shell-btn shell-btn-secondary', onclick: () => openUploadWizard({ mode: 'add-to-draft', ref: state.datasetRef, versionLabel: v.version }) }, 'Import'));
        right.appendChild(el('button', { className: 'shell-btn shell-btn-primary', onclick: publishCurrentVersion }, 'Publish'));
      } else if (v.status === 'published' && !isProd) {
        right.appendChild(el('button', { className: 'shell-btn shell-btn-primary', onclick: setAsProductionFlow }, 'Set as production'));
        right.appendChild(el('button', { className: 'shell-btn shell-btn-secondary', onclick: () => createDraftFromVersionFlow(v.version) }, '+ Create draft'));
      } else {
        right.appendChild(el('button', { className: 'shell-btn shell-btn-primary', onclick: () => createDraftFromVersionFlow(v.version) }, '+ Create draft'));
      }
      right.appendChild(overflowMenuButton());
    }

    function overflowMenuButton(){
      const btn = el('button', { className: 'actions-trigger', type: 'button', title: 'More actions', 'aria-label': 'More actions', html: ICON_DOTS });
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const v = state.activeVersion;
        const menu = [];
        if (v) {
          menu.push({ label: 'Name version…', onClick: nameVersionFlow });
          menu.push({ label: 'Compare…', onClick: openCompareFlow });
          menu.push({ label: '↓ Download JSONL', onClick: () => window.open(apiUrl('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + ':download?project_slug=' + encodeURIComponent(state.slug)), '_blank', 'noopener') });
        }
        openContextMenu(btn, menu);
      });
      return btn;
    }

    function refreshDetailChrome(opts){
      opts = opts || {};
      if (!opts.tabOnly) {
        const meta = document.getElementById('dsx-hero-meta');
        if (meta && state.dataset) fillHeroMeta(meta);
        const actions = document.getElementById('dsx-hero-actions');
        if (actions) fillHeroActions(actions);
        const tabs = document.getElementById('dsx-detail-tabs');
        if (tabs) {
          const nextTabs = buildTabs();
          tabs.replaceWith(nextTabs);
        }
      }
      updateActiveTabs();
    }

    function updateActiveTabs(){
      let activeTab = null;
      document.querySelectorAll('#dsx-detail-tabs .dsx-tab').forEach(btn => {
        const isActive = btn.dataset.tabKey === state.tab;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        if (isActive) activeTab = btn;
      });
      if (activeTab) {
        requestAnimationFrame(() => activeTab.scrollIntoView({ block: 'nearest', inline: 'nearest' }));
      }
      const panel = document.getElementById('dsx-tab-content');
      if (panel) panel.setAttribute('aria-labelledby', 'dsx-detail-tab-' + state.tab);
    }

    function buildHero(){
      const hero = el('div', { className: 'dsx-hero' });
      const top = el('div', { className: 'dsx-hero-top' });
      const idCol = el('div', { className: 'dsx-hero-id' });
      const titleRow = el('div', { className: 'dsx-hero-title-row' });

      titleRow.appendChild(Shell.identicon(state.dataset.slug || state.datasetRef, { cell: 4, gap: 2 }));
      const nameEl = el('h1', { className: 'dsx-hero-name' });
      nameEl.appendChild(document.createTextNode(state.dataset.name));
      nameEl.appendChild(el('span', { className: 'dsx-name-edit', title: 'Rename', onclick: renameDatasetFlow }, '✎'));
      titleRow.appendChild(nameEl);
      idCol.appendChild(titleRow);

      if (state.dataset.description) {
        const descEl = el('p', { className: 'dsx-hero-desc', title: 'Click to edit description', style: { cursor: 'pointer' } });
        descEl.textContent = state.dataset.description;
        descEl.addEventListener('click', editDescriptionFlow);
        idCol.appendChild(descEl);
      } else {
        // No description: a compact, obviously-clickable affordance instead of a big italic placeholder.
        const addDesc = el('button', { className: 'dsx-hero-add-desc', type: 'button', title: 'Add a description', onclick: editDescriptionFlow }, '+ Add a description');
        idCol.appendChild(addDesc);
      }

      const meta = el('div', { className: 'dsx-hero-meta' });
      meta.id = 'dsx-hero-meta';
      fillHeroMeta(meta);
      idCol.appendChild(meta);

      top.appendChild(idCol);

      // Right: version selector plus state-driven actions. Drafts expose editing and
      // publishing; published versions expose promotion or draft creation.
      const right = el('div', { className: 'dsx-hero-actions' });
      right.id = 'dsx-hero-actions';
      fillHeroActions(right);
      top.appendChild(right);

      hero.appendChild(top);
      return hero;
    }

    function versionSelectorPill(){
      const wrap = el('div', { className: 'dsx-version-wrap' });
      const pill = el('button', { className: 'dsx-version-pill', type: 'button', title: 'Switch version', 'aria-haspopup': 'true' });
      const v = state.activeVersion;
      if (!v) {
        pill.appendChild(el('span', { className: 'label', style: { color: 'var(--text-muted)' } }, 'no versions'));
      } else {
        // Version leads as the muted mono identifier; the name (when present) is the
        // bold content — mirroring the gutter layout of the popover rows.
        pill.appendChild(el('span', { className: v.name ? 'vver' : 'label' }, v.version));
        if (v.name) pill.appendChild(el('span', { className: 'vname', title: v.name + ' (' + v.version + ')' }, v.name));
        pill.appendChild(el('span', { className: 'dsx-pill qym-badge ' + versionStatePillClass(v) }, versionStateLabel(v)));
      }
      pill.addEventListener('click', e => { e.stopPropagation(); toggleVersionPopover(wrap, pill); });
      wrap.appendChild(pill);
      return wrap;
    }

    function toggleVersionPopover(wrap, pillEl){
      const existing = wrap.querySelector('.dsx-version-popover');
      if (existing) {
        const existingClose = existing._closeOnOutside;
        existing.remove();
        pillEl.classList.remove('open');
        if (existingClose) document.removeEventListener('click', existingClose, true);
        return;
      }
      pillEl.classList.add('open');
      const pop = el('div', { className: 'dsx-version-popover' });
      const searchWrap = el('div', { className: 'dsx-version-search' });
      const searchInput = el('input', { type: 'search', placeholder: 'Search versions...', 'aria-label': 'Search versions' });
      searchWrap.appendChild(dsxSearchControl(searchInput));
      pop.appendChild(searchWrap);
      const list = el('div', { className: 'dsx-version-list' });
      const sortedVersions = sortedVersionsDesc(state.versions);

      function closePopover(){
        pop.remove();
        pillEl.classList.remove('open');
        document.removeEventListener('click', closeOnOutside, true);
      }
      function versionSearchText(v){
        return [v.version, v.name || '', versionStateLabel(v), v.status, (v.aliases || []).join(' ')].join(' ').toLowerCase();
      }
      function renderVersionList(query){
        const q = (query || '').trim().toLowerCase();
        list.innerHTML = '';
        const versions = q ? sortedVersions.filter(v => versionSearchText(v).includes(q)) : sortedVersions;
        if (!versions.length) {
          list.appendChild(el('div', { className: 'dsx-version-empty' }, 'No matching versions'));
          return;
        }
        versions.forEach(v => list.appendChild(versionPopoverRow(v, closePopover)));
      }
      renderVersionList('');
      pop.appendChild(list);
      wrap.appendChild(pop);
      searchInput.addEventListener('click', e => e.stopPropagation());
      searchInput.addEventListener('input', () => renderVersionList(searchInput.value));
      setTimeout(() => searchInput.focus(), 0);
      function closeOnOutside(e){ if (!pop.contains(e.target) && !pillEl.contains(e.target)) closePopover(); }
      pop._closeOnOutside = closeOnOutside;
      setTimeout(() => document.addEventListener('click', closeOnOutside, true), 0);
    }

    function versionPopoverRow(v, onSelect){
      const isActive = state.activeVersion && state.activeVersion.id === v.id;
      const row = el('div', { className: 'dsx-version-row' + (isActive ? ' active' : ''), 'aria-current': isActive ? 'true' : null });
      row.addEventListener('click', () => { if (onSelect) onSelect(); navigate({ tab: state.tab, v: v.version, item: null }); });
      row.appendChild(el('span', { className: 'vver' }, v.version));
      row.appendChild(el('span', {
        className: 'vname' + (v.name ? '' : ' unnamed'),
        title: v.name ? v.name + ' (' + v.version + ')' : v.version,
      }, v.name || '—'));
      row.appendChild(el('span', { className: 'dsx-pill qym-badge ' + versionStatePillClass(v) }, versionStateLabel(v)));
      const when = relTime(v.published_at || v.created_at);
      row.appendChild(el('div', { className: 'vmeta' }, pluralize(v.item_count || 0, 'item') + ' · ' + pluralize(v.run_count || 0, 'run') + ' · ' + when));
      return row;
    }

    function buildTabs(){
      const tabs = el('div', { className: 'dsx-tabs qym-tabs', role: 'tablist', 'aria-label': 'Dataset sections' });
      tabs.id = 'dsx-detail-tabs';
      // Counts intentionally omitted — the hero meta row already shows items / versions / runs.
      const tabSpec = [
        { key: 'items', label: 'Items' },
        { key: 'runs', label: 'Runs' },
        { key: 'lineage', label: 'Lineage' },
        { key: 'settings', label: 'Settings' },
      ];
      tabSpec.forEach(t => {
        const btn = el('button', {
          className: 'dsx-tab qym-tabs__tab' + (state.tab === t.key ? ' active' : ''),
          type: 'button',
          role: 'tab',
          id: 'dsx-detail-tab-' + t.key,
          'aria-controls': 'dsx-tab-content',
          'aria-selected': state.tab === t.key ? 'true' : 'false',
          dataset: { tabKey: t.key },
        });
        btn.appendChild(document.createTextNode(t.label));
        btn.addEventListener('click', () => navigate({ tab: t.key, item: null }));
        tabs.appendChild(btn);
      });
      return tabs;
    }

    function renderTabContent(host){
      host.innerHTML = '';
      // Items/runs render their own scroll regions inside a fixed flex column ("tight");
      // lineage and settings are plain documents that scroll within the content area.
      const tight = state.tab === 'items' || state.tab === 'runs';
      host.classList.toggle('tight', tight);
      host.style.padding = tight ? '0' : '';
      if (state.tab === 'items') return renderItemsTab(host);
      if (state.tab === 'runs') return renderRunsTab(host);
      if (state.tab === 'lineage') return renderLineageTab(host);
      if (state.tab === 'settings') return renderSettingsTab(host);
    }

    // -------------------------------------------------------------
    // ITEMS TAB
    // -------------------------------------------------------------
    async function renderItemsTab(host){
      const v = state.activeVersion;
      if (!v) {
        const e = el('div', { className: 'dsx-empty' });
        e.appendChild(el('h3', null, 'No versions yet'));
        e.appendChild(el('p', null, 'Create a first draft to start adding items.'));
        const acts = el('div', { className: 'dsx-empty-actions' });
        acts.appendChild(el('button', { className: 'shell-btn shell-btn-primary', onclick: () => createDraftFromVersionFlow() }, '+ Create first draft'));
        e.appendChild(acts);
        host.appendChild(e);
        return;
      }

      const isDraft = v.status === 'draft';

      const toolbar = el('div', { className: 'dsx-items-toolbar' });
      const left = el('div', { className: 'left' });
      const searchInput = el('input', { className: 'dsx-itemsearch', type: 'text', placeholder: 'Search items...', value: state.search });
      left.appendChild(dsxSearchControl(searchInput));
      if (state.label) {
        const labelChip = el('span', { className: 'qym-chip' });
        labelChip.textContent = 'label: ' + state.label;
        const x = el('button', { style: { background: 'transparent', border: 0, color: 'inherit', cursor: 'pointer', marginLeft: '4px' }, onclick: () => navigate({ label: '' }) }, '×');
        labelChip.appendChild(x);
        left.appendChild(labelChip);
      }
      toolbar.appendChild(left);
      host.appendChild(toolbar);

      const tableWrap = el('div', { className: 'dsx-table-wrap paged', id: 'dsx-table-wrap' });
      host.appendChild(tableWrap);

      const pager = el('div', { className: 'dsx-pager qym-pagination', id: 'dsx-pager', 'aria-label': 'Dataset items pagination' });
      host.appendChild(pager);

      const debouncedSearch = debounce(() => { state.search = searchInput.value; state.page = 0; navigate({ search: state.search, page: 0 }, { replace: true, silent: true }); loadItems(); }, 200);
      searchInput.addEventListener('input', debouncedSearch);

      loadItems();

      // Allow the item page/editor flows to refresh a single row in
      // place after an edit, so the table reflects changes without a reload.
      state.refreshItemRow = function(updated){
        if (!updated || updated.id == null) return false;
        const list = state.itemsList && state.itemsList.items;
        if (!list) return false;
        const idx = list.findIndex(i => i.id === updated.id);
        if (idx < 0) return false;
        list[idx] = Object.assign({}, list[idx], updated);
        const oldTr = state.itemRowMap.get(updated.id);
        if (!oldTr || !oldTr.isConnected) return false;
        const showIdColumn = list.some(item => hasUserProvidedItemId(item.item_id));
        const newTr = renderItemRow(list[idx], isDraft, showIdColumn, (state.itemsList && state.itemsList.metricNames) || []);
        state.itemRowMap.set(updated.id, newTr);
        oldTr.replaceWith(newTr);
        return true;
      };

      async function loadItems(options){
        const keepTable = !!(options && options.keepTable);
        const scrollLeft = tableWrap.scrollLeft;
        if (keepTable) {
          tableWrap.setAttribute('aria-busy', 'true');
        } else {
          tableWrap.innerHTML = '';
          for (let i = 0; i < 5; i++) {
            const r = el('div', { className: 'dsx-skel-row' });
            ['40%','15%','25%','30%','10%'].forEach(w => r.appendChild(el('div', { className: 'dsx-skeleton', style: { width: w } })));
            tableWrap.appendChild(r);
          }
        }
        try {
          const params = new URLSearchParams();
          params.set('project_slug', state.slug);
          params.set('limit', state.pageSize);
          params.set('offset', state.page * state.pageSize);
          if (state.search) params.set('search', state.search);
          if (state.sort) params.set('sort', state.sort);
          if (state.label) params.set('label', state.label);
          const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items?' + params.toString());
          const items = resp.items || [];
          const metricNames = (resp.metric_names && resp.metric_names.length)
            ? resp.metric_names
            : Array.from(new Set(items.flatMap(item => Object.keys(((item.result_summary || {}).metrics) || {})))).sort();
          state.itemsList = { items, total: resp.total || 0, metricNames };
          renderItemsTable({ scrollLeft: keepTable ? scrollLeft : null });
          renderPager();
        } catch(e) {
          Shell.toast(e.message || 'Failed to load items', 'error');
          if (!keepTable) tableWrap.innerHTML = '';
        } finally {
          tableWrap.removeAttribute('aria-busy');
        }
      }

      function renderItemsTable(options){
        hidePreviewPopover();
        tableWrap.innerHTML = '';
        const items = state.itemsList.items;
        if (items.length === 0) {
          const e = el('div', { className: 'dsx-empty' });
          e.appendChild(el('h3', null, isDraft ? 'This draft is empty' : 'This version has no items'));
          if (isDraft) {
            e.appendChild(el('p', null, 'Add items one at a time, or import a file.'));
            const acts = el('div', { className: 'dsx-empty-actions' });
            acts.appendChild(el('button', { className: 'shell-btn shell-btn-primary', onclick: () => openNewItemFlow() }, '+ Add item'));
            acts.appendChild(el('button', { className: 'shell-btn shell-btn-secondary', onclick: () => openUploadWizard({ mode: 'add-to-draft', ref: state.datasetRef, versionLabel: v.version }) }, '↑ Import file'));
            e.appendChild(acts);
          }
          tableWrap.appendChild(e);
          return;
        }
        const showIdColumn = items.some(item => hasUserProvidedItemId(item.item_id));
        const metricNames = state.itemsList.metricNames || [];
        const columnDefs = [
          { id: 'index', label: '#', className: 'col-idx', sortKey: 'index', width: 48, minWidth: 40, resizable: true },
        ];
        if (showIdColumn) columnDefs.push({ id: 'item_id', label: 'ID', className: 'col-id', sortKey: 'item_id', width: 150, minWidth: 96, resizable: true });
        columnDefs.push(
          { id: 'input', label: 'Input', className: 'col-input', sortKey: 'input', width: 380, minWidth: 180, flex: 3, resizable: true },
          { id: 'expected', label: 'Expected', className: 'col-expected', sortKey: 'expected', width: 320, minWidth: 160, flex: 2, resizable: true },
          { id: 'metadata', label: 'Metadata', className: 'col-metadata', sortKey: 'metadata', width: 180, minWidth: 120, resizable: true },
          { id: 'runs', label: 'Runs', className: 'col-runs', sortKey: 'runs', width: 72, minWidth: 68, resizable: true },
        );
        metricNames.forEach(metric => columnDefs.push({ id: 'metric:' + metric, label: metric, className: 'col-metric', sortKey: 'metric:' + metric, width: metricColumnWidth(metric), minWidth: 72, resizable: true }));
        columnDefs.push(
          { id: 'latency', label: 'Latency', className: 'col-latency', sortKey: 'latency', width: 94, minWidth: 92, resizable: true },
          { id: 'edits', label: 'Edits', className: 'col-edits', sortKey: 'edits', width: 78, minWidth: 74, resizable: true },
          { id: 'actions', label: '', className: 'col-actions', width: 44, minWidth: 44, resizable: false },
        );
        function sortStateFor(key){
          if (String(state.sort || '') === key + '_asc') return 'ascending';
          if (String(state.sort || '') === key + '_desc') return 'descending';
          if (key.startsWith('metric:')) {
            if (String(state.sort || '') === key + ':asc') return 'ascending';
            if (String(state.sort || '') === key + ':desc') return 'descending';
          }
          if (key === 'index' && (!state.sort || state.sort === 'index_asc')) return 'ascending';
          if (key === 'item_id' && state.sort === 'item_id') return 'ascending';
          return 'none';
        }
        function sortValueFor(key, nextDir){
          if (key.startsWith('metric:')) return key + ':' + nextDir;
          return key + '_' + nextDir;
        }
        state.itemRowMap = new Map();
        window.QymDataTable.render({
          host: tableWrap,
          tableClass: 'dsx-table',
          storageKey: 'datasets.items.v2',
          minWidth: 1200,
          scrollLeft: options && options.scrollLeft != null ? options.scrollLeft : null,
          columns: columnDefs,
          rows: items,
          sortState: sortStateFor,
          onSort: (_column, nextDir, sortKey) => {
            state.sort = sortValueFor(sortKey, nextDir);
            state.page = 0;
            navigate({ sort: state.sort, page: 0 }, { replace: true, silent: true });
            loadItems({ keepTable: true });
          },
          renderRow: item => {
            const tr = renderItemRow(item, isDraft, showIdColumn, metricNames);
            state.itemRowMap.set(item.id, tr);
            return tr;
          },
        });

        if (isDraft) {
          const addBtn = el('button', { className: 'dsx-addrow', onclick: () => openNewItemFlow() }, '+ Add new item');
          const ftr = el('div', { style: { padding: '10px var(--space-xl)' } });
          ftr.appendChild(addBtn);
          tableWrap.appendChild(ftr);
        }
      }

      function renderItemRow(item, isDraft, showIdColumn, metricNames){
        const tr = el('tr', { dataset: { itemPk: item.id, itemId: item.item_id } });
        tr.appendChild(el('td', { className: 'col-idx' }, String(item.index)));
        if (showIdColumn) {
          const idTd = el('td', { className: 'col-id' });
          if (hasUserProvidedItemId(item.item_id)) {
            const idSpan = el('span', null, item.item_id);
            idTd.appendChild(idSpan);
            const copyBtn = el('button', { className: 'copy qym-icon-action', type: 'button', title: 'Copy item ID', 'aria-label': 'Copy item ID', onclick: e => { e.stopPropagation(); copyToClipboard(item.item_id); }, html: ICON_COPY });
            idTd.appendChild(copyBtn);
          }
          tr.appendChild(idTd);
        }

        tr.appendChild(makePreviewCell(item, 'input', isDraft));
        tr.appendChild(makePreviewCell(item, 'expected_output', isDraft));
        tr.appendChild(makePreviewCell(item, 'metadata', isDraft));
        const summary = item.result_summary || {};
        tr.appendChild(el('td', { className: 'col-runs' }, String(summary.run_count || item.run_count || 0)));
        const metrics = summary.metrics || {};
        (metricNames || []).forEach(metric => {
          const value = (metrics[metric] || {}).avg;
          const peers = ((state.itemsList && state.itemsList.items) || []).map(i => (((i.result_summary || {}).metrics || {})[metric] || {}).avg);
          tr.appendChild(el('td', { className: 'col-metric' }, metricScoreNode(value, peers)));
        });
        tr.appendChild(el('td', { className: 'col-latency' }, fmtSeconds(summary.avg_latency_ms)));
        tr.appendChild(el('td', { className: 'col-edits' }, String(item.edit_count || 0)));

        const actTd = el('td', { className: 'col-actions' });
        const menuBtn = el('button', { className: 'actions-trigger', type: 'button', title: 'Actions', 'aria-label': 'Row actions', html: ICON_DOTS });
        menuBtn.addEventListener('click', e => { e.stopPropagation(); openContextMenu(menuBtn, rowMenuItems(item, isDraft)); });
        actTd.appendChild(menuBtn);
        tr.appendChild(actTd);

        tr.addEventListener('click', e => {
          if (e.target.closest('input,button,textarea,.dsx-cell-edit')) return;
          navigate({ item: item.item_id, tab: 'details' });
        });
        return tr;
      }

      function makePreviewCell(item, field, isDraft){
        const td = el('td', { className: field === 'input' ? 'col-input' : (field === 'metadata' ? 'col-metadata' : 'col-expected') });
        const val = item[field];
        const preview = el('div', { className: 'dsx-preview' + ((val == null || val === '') ? ' muted' : '') });
        if (val == null || val === '') preview.textContent = '—';
        else preview.textContent = (field === 'input' || field === 'metadata') ? rawItemPreview(val) : compactItemPreview(val);
        const fullText = fullPreview(val);
        if (fullText) {
          preview.setAttribute('tabindex', '0');
          preview.setAttribute('aria-label', 'Full value preview');
          preview.addEventListener('mouseenter', () => schedulePreviewPopover(preview, fullText));
          preview.addEventListener('mouseleave', hidePreviewPopover);
          preview.addEventListener('focus', () => showPreviewPopover(preview, fullText));
          preview.addEventListener('blur', hidePreviewPopover);
        }
        td.appendChild(preview);
        if (isDraft) {
          // Row is clickable (opens the item page), so keep the pointer cursor it inherits from <tr>.
          // Double-click still enters inline edit — it just isn't advertised with a text caret.
          td.title = 'Click to open · double-click to edit';
          td.addEventListener('dblclick', e => { e.stopPropagation(); enterEditMode(td, item, field); });
        }
        return td;
      }

      function enterEditMode(td, item, field){
        const initial = fullPreview(item[field]);
        td.innerHTML = '';
        const ed = el('textarea', { className: 'dsx-cell-edit' });
        ed.value = initial;
        td.appendChild(ed);
        const status = el('span', { style: { display: 'inline-flex', alignItems: 'center', gap: '6px', marginLeft: '6px' } });
        const dot = el('span', { className: 'dsx-json-dot' });
        const dotLabel = el('span', { style: { fontSize: 'var(--font-sm)', color: 'var(--text-muted)' } });
        const toggle = el('button', { className: 'dsx-json-dot-toggle', type: 'button', style: { display: 'none', fontSize: 'var(--font-sm)', background: 'transparent', border: '1px solid var(--border-default)', borderRadius: '4px', color: 'var(--text-muted)', cursor: 'pointer', padding: '1px 5px' } });
        status.appendChild(dot); status.appendChild(dotLabel); status.appendChild(toggle);
        td.appendChild(status);
        const tr = td.closest('tr');
        tr.classList.add('editing');
        ed.focus();
        ed.setSelectionRange(initial.length, initial.length);
        let valid = true;
        let forceString = false;
        function refresh(){
          const res = coerceCellValue(ed.value, field, forceString);
          if (!res.ok) {
            valid = false; ed.classList.add('invalid'); dot.classList.add('invalid');
            dotLabel.textContent = res.error || 'invalid';
            toggle.style.display = 'none';
            return;
          }
          valid = true; ed.classList.remove('invalid'); dot.classList.remove('invalid');
          dotLabel.textContent = typeof res.value === 'string' ? 'string' : (res.value === null ? 'empty' : 'JSON');
          // Ambiguous bare scalar (number/bool/null) — let the user force a literal string.
          if (res.ambiguous || (forceString && BARE_NUMBER_RE.test(ed.value.trim()))) {
            toggle.style.display = '';
            toggle.textContent = forceString ? 'treat as JSON' : 'treat as string';
          } else {
            toggle.style.display = 'none';
          }
        }
        toggle.addEventListener('mousedown', e => { e.preventDefault(); }); // keep textarea focus
        toggle.addEventListener('click', e => { e.preventDefault(); forceString = !forceString; refresh(); ed.focus(); });
        ed.addEventListener('input', refresh);
        refresh();
        ed.addEventListener('keydown', async e => {
          if (e.key === 'Escape') { e.preventDefault(); restore(); }
          else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(); }
        });
        ed.addEventListener('blur', commit);
        let committed = false;
        async function commit(){
          if (committed) return;
          const res = coerceCellValue(ed.value, field, forceString);
          if (!res.ok) { Shell.toast(res.error || 'Invalid value', 'error'); return; }
          committed = true;
          const parsed = res.value;
          const previous = item[field];
          item[field] = parsed;
          try {
            const body = {}; body[field] = parsed;
            const upd = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '?project_slug=' + encodeURIComponent(state.slug), { method: 'PATCH', body });
            Object.assign(item, upd.item);
            Shell.toast('Saved', 'success');
            replaceCell();
          } catch(e) {
            item[field] = previous;
            Shell.toast(e.message || 'Save failed', 'error');
            replaceCell();
          }
        }
        function restore(){ committed = true; replaceCell(); }
        function replaceCell(){
          tr.classList.remove('editing');
          const newCell = makePreviewCell(item, field, true);
          td.parentNode.replaceChild(newCell, td);
        }
      }

      function rowMenuItems(item, isDraft){
        // Opening the item page (click the row) and copying the ID (hover ⧉) are already one
        // click away, so the menu only carries actions that aren't directly on the row.
        const items = [
          { label: 'Copy as JSON', onClick: () => copyToClipboard(JSON.stringify({ item_id: item.item_id, input: item.input, expected_output: item.expected_output, metadata: item.metadata, labels: item.labels }, null, 2)) },
        ];
        if (isDraft) {
          items.push({ sep: true });
          items.push({ label: 'Delete', danger: true, onClick: async () => {
            const ok = await Shell.openConfirmDialog({ title: 'Delete item?', description: 'This will remove "' + item.item_id + '" from this draft.', confirmLabel: 'Delete', danger: true });
            if (!ok || !ok.confirmed) return;
            try { await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '?project_slug=' + encodeURIComponent(state.slug), { method: 'DELETE' }); Shell.toast('Item deleted', 'success'); refreshDetailView({ force: true }); }
            catch(e) { Shell.toast(e.message || 'Delete failed', 'error'); }
          } });
        }
        return items;
      }

      function renderPager(){
        const total = state.itemsList.total;
        const start = total === 0 ? 0 : (state.page * state.pageSize + 1);
        const end = Math.min(total, (state.page + 1) * state.pageSize);
        const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
        window.QymUIComponents?.renderPagination(pager, {
          page: state.page + 1,
          pageCount: totalPages,
          pageSize: state.pageSize,
          pageSizeOptions: [25, 50, 100, 250],
          total,
          start,
          end,
          noun: 'items',
          onPageChange: page => {
            state.page = page - 1;
            navigate({ page: state.page }, { replace: true, silent: true });
            loadItems();
          },
          onPageSizeChange: pageSize => {
            state.pageSize = pageSize;
            state.page = 0;
            navigate({ page: 0 }, { replace: true, silent: true });
            loadItems();
          },
        });
      }
    }

    // Build a stacked before->after diff for item history fields.
    const HISTORY_DIFF_FIELDS = [['input', 'input'], ['expected_output', 'expected'], ['metadata', 'metadata'], ['labels', 'labels']];
    function historyDiffBody(before, after){
      before = before || {}; after = after || {};
      const wrap = el('div', { className: 'dsx-hist-diff' });
      let changed = 0;
      HISTORY_DIFF_FIELDS.forEach(([key, label]) => {
        const b = before[key], a = after[key];
        const beforeStr = b == null ? '' : (typeof b === 'string' ? b : prettyJSON(b));
        const afterStr = a == null ? '' : (typeof a === 'string' ? a : prettyJSON(a));
        if (beforeStr === afterStr) return;
        changed++;
        const field = el('div', { className: 'dsx-hist-diff-field' });
        field.appendChild(el('div', { className: 'name' }, label));
        if (beforeStr !== '') field.appendChild(el('div', { className: 'dsx-hist-diff-pane before', html: '<span class="label">before</span>' + highlightDiff(beforeStr, afterStr, 'before') }));
        if (afterStr !== '') field.appendChild(el('div', { className: 'dsx-hist-diff-pane after', html: '<span class="label">after</span>' + highlightDiff(beforeStr, afterStr, 'after') }));
        wrap.appendChild(field);
      });
      if (!changed) wrap.appendChild(el('div', { className: 'dsx-history-unchanged' }, 'No field changes recorded.'));
      return wrap;
    }

    // -------------------------------------------------------------
    // ITEM PAGE
    // -------------------------------------------------------------
    async function renderItemPage(){
      const root = document.getElementById('dsx-root');
      const restoreTabFocus = !!document.activeElement?.closest?.('.dsx-item-tabs [role="tab"]');
      const renderSeq = ++itemPageRenderSeq;
      const hadContent = !!root.children.length;
      if (!hadContent) {
        root.appendChild(el('div', { className: 'dsx-page' }, [
          el('div', { className: 'dsx-skel-row' }, [el('div', { className: 'dsx-skeleton', style: { width: '70%' } })]),
        ]));
      }
      const ok = await ensureDatasetDetailLoaded();
      if (renderSeq !== itemPageRenderSeq) return;
      if (!ok) {
        root.innerHTML = '<div class="dsx-empty"><h3>Dataset not found</h3></div>';
        return;
      }
      normalizeActiveVersionUrl();
      const v = state.activeVersion;
      if (!v || !state.itemId) {
        navigate({ item: null, tab: 'items' }, { replace: true });
        return;
      }
      if (window.QymTraceViewer) window.QymTraceViewer.init({ exportMode: false });

      let item;
      try {
        const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(state.itemId) + '?project_slug=' + encodeURIComponent(state.slug));
        if (renderSeq !== itemPageRenderSeq) return;
        item = resp.item;
      } catch(e) {
        if (renderSeq !== itemPageRenderSeq) return;
        Shell.toast(e.message || 'Failed to load item', 'error');
        root.innerHTML = '<div class="dsx-empty"><h3>Item not found</h3></div>';
        return;
      }

      const itemTab = ['details', 'runs', 'history'].includes(state.tab) ? state.tab : 'details';
      const datasetHref = appPath('/projects/' + encodeURIComponent(state.slug) + '/datasets/' + encodeURIComponent(state.datasetRef)) + '?tab=items&v=' + encodeURIComponent(v.version);
      const itemTitle = hasUserProvidedItemId(item.item_id) ? item.item_id : ('Item #' + item.index);
      setDatasetBreadcrumbs([
        { label: 'Datasets', href: appPath('/projects/' + state.slug + '/datasets') },
        { label: state.dataset.name, href: datasetHref },
        { label: itemTitle },
      ]);

      const page = el('div', { className: 'dsx-item-page' });
      const header = el('div', { className: 'dsx-item-header' });
      const main = el('div', { className: 'dsx-item-head-main' });
      const titleWrap = el('div', { className: 'dsx-item-title-wrap' });
      titleWrap.appendChild(el('div', { className: 'dsx-item-title-line' }, [
        el('h1', { className: 'dsx-item-title' }, itemTitle),
        el('button', { className: 'tv-copy-btn qym-icon-action', type: 'button', title: 'Copy item ID', 'aria-label': 'Copy item ID', onclick: () => copyToClipboard(item.item_id), html: ICON_COPY }),
      ]));
      const meta = el('div', { className: 'dsx-item-meta' }, [
        el('span', null, 'index ' + item.index),
        el('span', { className: 'dot' }),
        el('span', null, 'updated ' + relTime(item.updated_at)),
        el('span', { className: 'dot' }),
        el('span', null, 'created ' + fullDate(item.created_at)),
      ]);
      if (hasUserProvidedItemId(item.item_id)) {
        meta.appendChild(el('span', { className: 'dot' }));
        meta.appendChild(el('span', null, 'id ' + item.item_id));
      }
      titleWrap.appendChild(meta);
      main.appendChild(titleWrap);

      const actions = el('div', { className: 'dsx-item-actions' });
      if (v.status !== 'draft') {
        actions.appendChild(el('button', { className: 'shell-btn shell-btn-primary qym-inline-action', type: 'button', onclick: () => createDraftFromVersionFlow(v.version, { itemId: item.item_id }) }, 'Create draft to edit'));
      }
      if (v.status === 'draft' && itemTab === 'details') {
        actions.appendChild(el('button', { className: 'shell-btn shell-btn-danger qym-inline-action', type: 'button', onclick: () => deleteItemPageItem(item, v) }, 'Delete'));
        actions.appendChild(el('span', { className: 'dsx-item-actions-sep', 'aria-hidden': 'true' }));
      }
      actions.appendChild(el('button', { className: 'shell-btn shell-btn-secondary qym-inline-action', type: 'button', title: 'Previous item', onclick: () => navigateItemPage(item, -1) }, 'Previous'));
      actions.appendChild(el('button', { className: 'shell-btn shell-btn-secondary qym-inline-action', type: 'button', title: 'Next item', onclick: () => navigateItemPage(item, 1) }, 'Next'));
      if (v.status === 'draft' && itemTab === 'details') {
        actions.appendChild(el('button', { className: 'shell-btn shell-btn-primary qym-inline-action', type: 'button', onclick: () => saveItemPageItem(item, v) }, 'Save changes'));
      }
      main.appendChild(actions);
      header.appendChild(main);
      page.appendChild(header);

      const tabs = el('div', { className: 'dsx-item-tabs qym-tabs', role: 'tablist', 'aria-label': 'Dataset item sections' });
      [['details', 'Details'], ['runs', 'Runs'], ['history', 'History']].forEach(([key, label]) => {
        tabs.appendChild(el('button', {
          className: 'dsx-item-tab qym-tabs__tab' + (itemTab === key ? ' active' : ''),
          type: 'button',
          role: 'tab',
          id: 'dsx-item-tab-' + key,
          'aria-controls': 'dsx-item-content',
          'aria-selected': itemTab === key ? 'true' : 'false',
          onclick: () => navigate({ tab: key, item: item.item_id }),
        }, label));
      });
      page.appendChild(tabs);

      const content = el('div', {
        className: 'dsx-item-content',
        id: 'dsx-item-content',
        role: 'tabpanel',
        'aria-labelledby': 'dsx-item-tab-' + itemTab,
      });
      page.appendChild(content);
      root.replaceChildren(page);

      if (itemTab === 'runs') renderItemPageRuns(content, item, v);
      else if (itemTab === 'history') renderItemPageHistory(content, item, v);
      else renderItemPageDetails(content, item, v);
      if (restoreTabFocus) {
        requestAnimationFrame(() => {
          document.getElementById('dsx-item-tab-' + itemTab)?.focus({ preventScroll: true });
        });
      }
    }

    async function navigateItemPage(item, delta){
      const v = state.activeVersion;
      if (!v || !item) return;
      try {
        const params = new URLSearchParams();
        params.set('project_slug', state.slug);
        if (state.search) params.set('search', state.search);
        if (state.sort) params.set('sort', state.sort);
        if (state.label) params.set('label', state.label);
        const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '/neighbors?' + params.toString());
        const target = delta < 0 ? resp.previous : resp.next;
        if (!target) {
          Shell.toast(delta < 0 ? 'Already at first item' : 'Already at last item', 'info');
          return;
        }
        navigate({ item: target.item_id, tab: state.tab === 'runs' || state.tab === 'history' ? state.tab : 'details' });
      } catch(e) {
        Shell.toast(e.message || 'Could not navigate item', 'error');
      }
    }

    function renderItemPageDetails(host, item, v){
      const isDraft = v.status === 'draft';
      const grid = el('div', { className: 'dsx-item-details-grid' });
      const main = el('div', { className: 'dsx-item-field-stack' });
      const side = el('div', { className: 'dsx-item-side' });
      main.appendChild(itemPageJSONPanel('Input', 'input', item, isDraft));
      main.appendChild(itemPageJSONPanel('Expected output', 'expected_output', item, isDraft));
      side.appendChild(itemPageJSONPanel('Metadata', 'metadata', item, isDraft));
      grid.appendChild(main);
      grid.appendChild(side);
      host.appendChild(grid);
    }

    function itemPageJSONPanel(label, key, item, isDraft){
      const panel = el('div', { className: 'dsx-item-panel' });
      const title = el('div', { className: 'dsx-item-panel-title' });
      title.appendChild(el('span', null, label));
      const actions = el('span', { className: 'tv-inline-actions' });
      title.appendChild(actions);
      panel.appendChild(title);
      const body = el('div', { className: 'dsx-item-panel-body' });
      const raw = fullPreview(item[key]);
      let expanded = false;
      const expandBtn = el('button', { className: 'tv-expand-btn qym-icon-action', type: 'button', title: 'Expand', 'aria-label': 'Expand', html: ICON_EXPAND });
      const copyBtn = el('button', { className: 'tv-copy-btn qym-icon-action', type: 'button', title: 'Copy', 'aria-label': 'Copy', onclick: () => copyToClipboard(raw), html: ICON_COPY });
      actions.appendChild(expandBtn);
      actions.appendChild(copyBtn);

      if (!isDraft) {
        const view = el('pre', { className: 'dsx-json-view' + (raw === '' ? ' empty' : '') });
        if (raw === '') view.textContent = '(empty)';
        else view.innerHTML = highlightJSONHtml(raw);
        expandBtn.addEventListener('click', () => {
          expanded = !expanded;
          view.classList.toggle('expanded', expanded);
          expandBtn.setAttribute('title', expanded ? 'Collapse' : 'Expand');
          expandBtn.setAttribute('aria-label', expanded ? 'Collapse' : 'Expand');
        });
        body.appendChild(view);
      } else {
        const code = el('div', { className: 'dsx-code' });
        const hl = el('pre', { className: 'dsx-code-hl' });
        const ed = el('textarea', { className: 'dsx-code-input', spellcheck: 'false', dataset: { field: key } });
        ed.value = raw;
        code.appendChild(hl);
        code.appendChild(ed);
        const dot = el('div', { style: { textAlign: 'right', fontSize: 'var(--font-sm)', color: 'var(--text-muted)', marginTop: '4px' } });
        function sync(){ hl.innerHTML = highlightJSONHtml(ed.value) + '\n'; hl.scrollTop = ed.scrollTop; hl.scrollLeft = ed.scrollLeft; }
        function validate(){
          const res = coerceCellValue(ed.value, key === 'metadata' ? 'metadata' : key, false);
          code.classList.toggle('invalid', !res.ok);
          dot.innerHTML = '<span class="dsx-json-dot' + (res.ok ? '' : ' invalid') + '"></span> ' + (res.ok ? (typeof res.value === 'string' ? 'string' : (res.value === null ? 'empty' : 'valid JSON')) : (res.error || 'invalid'));
        }
        function autoGrow(){
          ed.style.height = 'auto';
          const cap = expanded ? Infinity : Math.round(window.innerHeight * 0.62);
          ed.style.height = Math.max(120, Math.min(ed.scrollHeight, cap)) + 'px';
        }
        expandBtn.addEventListener('click', () => {
          expanded = !expanded;
          code.classList.toggle('expanded', expanded);
          expandBtn.setAttribute('title', expanded ? 'Collapse' : 'Expand');
          expandBtn.setAttribute('aria-label', expanded ? 'Collapse' : 'Expand');
          autoGrow();
        });
        ed.addEventListener('input', () => { sync(); validate(); autoGrow(); });
        ed.addEventListener('scroll', () => { hl.scrollTop = ed.scrollTop; hl.scrollLeft = ed.scrollLeft; });
        sync(); validate(); requestAnimationFrame(autoGrow);
        body.appendChild(code);
        body.appendChild(dot);
      }
      panel.appendChild(body);
      return panel;
    }
