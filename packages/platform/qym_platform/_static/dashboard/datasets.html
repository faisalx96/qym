    function versionSelectorPill(){
      const wrap = el('div', { className: 'dsx-version-wrap' });
      const pill = el('button', { className: 'dsx-version-pill', type: 'button', title: 'Switch version', 'aria-haspopup': 'listbox', 'aria-expanded': 'false' });
      const v = state.activeVersion;
      if (!v) {
        pill.appendChild(el('span', { className: 'label', style: { color: 'var(--text-muted)' } }, 'no versions'));
      } else {
        // Version leads as the muted mono identifier; the name (when present) is the
        // bold content — mirroring the gutter layout of the popover rows.
        pill.appendChild(el('span', { className: v.name ? 'vver' : 'label' }, v.version));
        if (v.name) pill.appendChild(el('span', { className: 'vname', title: v.name + ' (' + v.version + ')' }, v.name));
        pill.appendChild(el('span', { className: 'dsx-pill qym-badge ' + versionStatePillClass(v) }, versionStateLabel(v)));
      }
      pill.setAttribute('aria-label', 'Version: ' + (v ? v.version + (v.name ? ' ' + v.name : '') + ', ' + versionStateLabel(v) : 'no versions') + '. Switch version');
      pill.addEventListener('click', e => { e.stopPropagation(); toggleVersionPopover(wrap, pill); });
      pill.addEventListener('keydown', e => {
        if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !wrap.querySelector('.dsx-version-popover')) {
          e.preventDefault();
          toggleVersionPopover(wrap, pill);
        }
      });
      wrap.appendChild(pill);
      return wrap;
    }

    // The version switcher is a search box over a listbox (WAI-ARIA combobox
    // pattern): the search keeps focus while Up/Down/Home/End move the active
    // option, Enter opens it, and Escape closes the list and returns focus to
    // the version button.
    function toggleVersionPopover(wrap, pillEl){
      const existing = wrap.querySelector('.dsx-version-popover');
      if (existing) {
        if (existing._dsxClose) existing._dsxClose(false);
        else existing.remove();
        return;
      }
      pillEl.classList.add('open');
      pillEl.setAttribute('aria-expanded', 'true');
      const pop = el('div', { className: 'dsx-version-popover' });
      const searchWrap = el('div', { className: 'dsx-version-search' });
      const listId = 'dsx-version-listbox';
      const searchInput = el('input', {
        type: 'search',
        placeholder: 'Search versions...',
        'aria-label': 'Search versions',
        role: 'combobox',
        'aria-expanded': 'true',
        'aria-controls': listId,
        'aria-autocomplete': 'list',
      });
      searchWrap.appendChild(dsxSearchControl(searchInput));
      pop.appendChild(searchWrap);
      const list = el('div', { className: 'dsx-version-list', role: 'listbox', id: listId, 'aria-label': 'Versions' });
      const sortedVersions = sortedVersionsDesc(state.versions);
      let options = [];
      let activeIndex = -1;

      function closePopover(returnFocus){
        pop.remove();
        pillEl.classList.remove('open');
        pillEl.setAttribute('aria-expanded', 'false');
        document.removeEventListener('click', closeOnOutside, true);
        if (returnFocus && pillEl.isConnected) pillEl.focus();
      }
      pop._dsxClose = closePopover;
      function versionSearchText(v){
        return [v.version, v.name || '', versionStateLabel(v), v.status, (v.aliases || []).join(' ')].join(' ').toLowerCase();
      }
      function setActive(index){
        if (!options.length) { activeIndex = -1; searchInput.removeAttribute('aria-activedescendant'); return; }
        activeIndex = (index + options.length) % options.length;
        options.forEach((row, i) => row.classList.toggle('focused', i === activeIndex));
        const row = options[activeIndex];
        searchInput.setAttribute('aria-activedescendant', row.id);
        row.scrollIntoView({ block: 'nearest' });
      }
      function renderVersionList(query){
        const q = (query || '').trim().toLowerCase();
        list.innerHTML = '';
        const versions = q ? sortedVersions.filter(v => versionSearchText(v).includes(q)) : sortedVersions;
        options = versions.map((v, i) => versionPopoverRow(v, () => closePopover(false), 'dsx-version-option-' + i));
        if (!options.length) {
          list.appendChild(el('div', { className: 'dsx-version-empty', role: 'status' }, 'No matching versions'));
          setActive(-1);
          return;
        }
        options.forEach(row => list.appendChild(row));
        const current = options.findIndex(row => row.getAttribute('aria-selected') === 'true');
        setActive(current >= 0 && !q ? current : 0);
      }
      renderVersionList('');
      pop.appendChild(list);
      wrap.appendChild(pop);
      searchInput.addEventListener('click', e => e.stopPropagation());
      searchInput.addEventListener('input', () => renderVersionList(searchInput.value));
      searchInput.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex - 1); }
        else if (e.key === 'Home' && !searchInput.value) { e.preventDefault(); setActive(0); }
        else if (e.key === 'End' && !searchInput.value) { e.preventDefault(); setActive(options.length - 1); }
        else if (e.key === 'Enter') { e.preventDefault(); if (options[activeIndex]) options[activeIndex].click(); }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closePopover(true); }
        else if (e.key === 'Tab') { closePopover(false); }
      });
      setTimeout(() => searchInput.focus(), 0);
      function closeOnOutside(e){ if (!pop.contains(e.target) && !pillEl.contains(e.target)) closePopover(false); }
      setTimeout(() => document.addEventListener('click', closeOnOutside, true), 0);
    }

    function versionPopoverRow(v, onSelect, id){
      const isActive = state.activeVersion && state.activeVersion.id === v.id;
      // A listbox option that is also a real link (C048 + C051): the
      // combobox moves through options; middle-click or Copy link work.
      const target = { tab: state.tab, v: v.version, item: null };
      const row = el('a', {
        className: 'dsx-version-row' + (isActive ? ' active' : ''),
        role: 'option',
        id: id || null,
        href: buildUrl(target),
        tabindex: '-1',
        'aria-selected': isActive ? 'true' : 'false',
      });
      row.addEventListener('click', e => {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        if (onSelect) onSelect();
        navigate(target);
      });
      row.appendChild(el('span', { className: 'vver' }, v.version));
      row.appendChild(el('span', {
        className: 'vname' + (v.name ? '' : ' unnamed'),
        title: v.name ? v.name + ' (' + v.version + ')' : v.version,
      }, v.name || '—'));
      row.appendChild(el('span', { className: 'dsx-pill qym-badge ' + versionStatePillClass(v) }, versionStateLabel(v)));
      const when = relTime(v.published_at || v.created_at);
      row.appendChild(el('div', { className: 'vmeta' }, pluralize(v.item_count || 0, 'item') + ' · ' + pluralize(v.run_count || 0, 'run') + ' · ' + when));
      return row;
    }

    function buildTabs(){
      const tabs = el('div', { className: 'dsx-tabs qym-tabs', role: 'tablist', 'aria-label': 'Dataset sections' });
      tabs.id = 'dsx-detail-tabs';
      // Counts intentionally omitted — the hero meta row already shows items / versions / runs.
      const tabSpec = [
        { key: 'items', label: 'Items' },
        { key: 'runs', label: 'Runs' },
        { key: 'lineage', label: 'Lineage' },
        { key: 'settings', label: 'Settings' },
      ];
      tabSpec.forEach(t => {
        const btn = el('button', {
          className: 'dsx-tab qym-tabs__tab' + (state.tab === t.key ? ' active' : ''),
          type: 'button',
          role: 'tab',
          id: 'dsx-detail-tab-' + t.key,
          'aria-controls': 'dsx-tab-content',
          'aria-selected': state.tab === t.key ? 'true' : 'false',
          dataset: { tabKey: t.key },
        });
        btn.appendChild(document.createTextNode(t.label));
        btn.addEventListener('click', () => navigate({ tab: t.key, item: null }));
        tabs.appendChild(btn);
      });
      return tabs;
    }

    function renderTabContent(host){
      host.innerHTML = '';
      // Items/runs render their own scroll regions inside a fixed flex column ("tight");
      // lineage and settings are plain documents that scroll within the content area.
      const tight = state.tab === 'items' || state.tab === 'runs';
      host.classList.toggle('tight', tight);
      host.style.padding = tight ? '0' : '';
      if (state.tab === 'items') return renderItemsTab(host);
      if (state.tab === 'runs') return renderRunsTab(host);
      if (state.tab === 'lineage') return renderLineageTab(host);
      if (state.tab === 'settings') return renderSettingsTab(host);
    }

    // -------------------------------------------------------------
    // ITEMS TAB
    // -------------------------------------------------------------
    async function renderItemsTab(host){
      const v = state.activeVersion;
      if (!v) {
        const e = el('div', { className: 'dsx-empty' });
        e.appendChild(el('h3', null, 'No versions yet'));
        if (!projectReadOnly()) {
          e.appendChild(el('p', null, 'Create a first draft to start adding items.'));
          const acts = el('div', { className: 'dsx-empty-actions' });
          acts.appendChild(el('button', { className: 'shell-btn shell-btn-primary', onclick: () => createDraftFromVersionFlow() }, '+ Create first draft'));
          e.appendChild(acts);
        }
        host.appendChild(e);
        return;
      }

      const isDraft = v.status === 'draft';
      const editable = canEditVersion(v);

      const toolbar = el('div', { className: 'dsx-items-toolbar' });
      const left = el('div', { className: 'left' });
      const searchInput = el('input', { className: 'dsx-itemsearch', type: 'text', placeholder: 'Search items...', value: state.search });
      left.appendChild(dsxSearchControl(searchInput));
      if (state.label) {
        const labelChip = el('span', { className: 'qym-chip' });
        labelChip.textContent = 'label: ' + state.label;
        const x = el('button', { style: { background: 'transparent', border: 0, color: 'inherit', cursor: 'pointer', marginLeft: '4px' }, onclick: () => navigate({ label: '' }) }, '×');
        labelChip.appendChild(x);
        left.appendChild(labelChip);
      }
      toolbar.appendChild(left);
      host.appendChild(toolbar);

      const tableWrap = el('div', { className: 'dsx-table-wrap paged', id: 'dsx-table-wrap' });
      host.appendChild(tableWrap);

      const pager = el('div', { className: 'dsx-pager qym-pagination', id: 'dsx-pager', 'aria-label': 'Dataset items pagination' });
      host.appendChild(pager);

      let itemsLoadSeq = 0;
      const debouncedSearch = debounce(() => {
        if (!tableWrap.isConnected) return;
        state.search = searchInput.value;
        state.page = 0;
        navigate({ search: state.search, page: 0 }, { replace: true, silent: true });
        // Keep the current rows on screen while the search runs (no skeleton flash).
        loadItems({ keepTable: tableWrap.querySelector('table') != null });
      }, 200);
      searchInput.addEventListener('input', () => {
        // Invalidate earlier requests immediately, including during the debounce.
        itemsLoadSeq += 1;
        debouncedSearch();
      });

      loadItems();

      // Allow the item page/editor flows to refresh a single row in
      // place after an edit, so the table reflects changes without a reload.
      state.refreshItemRow = function(updated){
        if (!updated || updated.id == null) return false;
        const list = state.itemsList && state.itemsList.items;
        if (!list) return false;
        const idx = list.findIndex(i => i.id === updated.id);
        if (idx < 0) return false;
        list[idx] = Object.assign({}, list[idx], updated);
        const oldTr = state.itemRowMap.get(updated.id);
        if (!oldTr || !oldTr.isConnected) return false;
        const showIdColumn = list.some(item => hasUserProvidedItemId(item.item_id));
        const newTr = renderItemRow(list[idx], editable, showIdColumn, (state.itemsList && state.itemsList.metricNames) || []);
        state.itemRowMap.set(updated.id, newTr);
        oldTr.replaceWith(newTr);
        return true;
      };

      async function loadItems(options){
        if (!tableWrap.isConnected) return;
        const requestSeq = ++itemsLoadSeq;
        const requestSearch = state.search;
        const isCurrentRequest = () => requestSeq === itemsLoadSeq
          && tableWrap.isConnected && searchInput.value === requestSearch;
        const keepTable = !!(options && options.keepTable);
        const scrollLeft = tableWrap.scrollLeft;
        if (keepTable) {
          tableWrap.setAttribute('aria-busy', 'true');
        } else {
          tableWrap.innerHTML = '';
          if (window.QymShell?.skeletonHTML) {
            // The first rows take the skeleton's place in one fade.
            tableWrap.innerHTML = window.QymShell.skeletonHTML('table', { toolbar: false, rows: 6, label: 'Loading items…' });
            tableWrap.setAttribute('data-qym-arrive', '');
            window.QymShell.watchArrivals(tableWrap.parentElement || tableWrap);
          } else {
            for (let i = 0; i < 5; i++) {
              const r = el('div', { className: 'dsx-skel-row' });
              ['40%','15%','25%','30%','10%'].forEach(w => r.appendChild(el('div', { className: 'dsx-skeleton', style: { width: w } })));
              tableWrap.appendChild(r);
            }
          }
        }
        try {
          const params = new URLSearchParams();
          params.set('project_slug', state.slug);
          params.set('limit', state.pageSize);
          params.set('offset', state.page * state.pageSize);
          if (state.search) params.set('search', state.search);
          if (state.sort) params.set('sort', state.sort);
          if (state.label) params.set('label', state.label);
          // The page already has the dataset and version; skip re-sending them.
          params.set('include_context', 'false');
          const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items?' + params.toString());
          if (!isCurrentRequest()) return;
          const items = resp.items || [];
          const metricNames = (resp.metric_names && resp.metric_names.length)
            ? resp.metric_names
            : Array.from(new Set(items.flatMap(item => Object.keys(((item.result_summary || {}).metrics) || {})))).sort();
          state.itemsList = { items, total: resp.total || 0, metricNames, metricDirections: resp.metric_directions || {} };
          renderItemsTable({ scrollLeft: keepTable ? scrollLeft : null });
          renderPager();
        } catch(e) {
          if (!isCurrentRequest()) return;
          Shell.toast(e.message || 'Failed to load items', 'error');
          if (!keepTable) tableWrap.innerHTML = '';
        } finally {
          if (isCurrentRequest()) tableWrap.removeAttribute('aria-busy');
        }
      }

      function renderItemsTable(options){
        hidePreviewPopover();
        tableWrap.innerHTML = '';
        const items = state.itemsList.items;
        if (items.length === 0) {
          const e = el('div', { className: 'dsx-empty' });
          const filtered = !!(state.search.trim() || state.label);
          e.appendChild(el('h3', null, filtered ? 'No items match these filters' : (isDraft ? 'This draft is empty' : 'This version has no items')));
          if (filtered) {
            e.appendChild(el('p', null, 'Try another search or clear the filters.'));
          } else if (editable) {
            e.appendChild(el('p', null, 'Add items one at a time, or import a file.'));
            const acts = el('div', { className: 'dsx-empty-actions' });
            acts.appendChild(el('button', { className: 'shell-btn shell-btn-primary', onclick: () => openNewItemFlow() }, '+ Add item'));
            acts.appendChild(el('button', { className: 'shell-btn shell-btn-secondary', onclick: () => openUploadWizard({ mode: 'add-to-draft', ref: state.datasetRef, versionLabel: v.version }) }, '↑ Import file'));
            e.appendChild(acts);
          }
          tableWrap.appendChild(e);
          return;
        }
        const showIdColumn = items.some(item => hasUserProvidedItemId(item.item_id));
        const metricNames = state.itemsList.metricNames || [];
        const columnDefs = [
          { id: 'index', label: '#', className: 'col-idx', sortKey: 'index', width: 48, minWidth: 40, resizable: true },
        ];
        if (showIdColumn) columnDefs.push({ id: 'item_id', label: 'ID', className: 'col-id', sortKey: 'item_id', width: 150, minWidth: 96, resizable: true });
        columnDefs.push(
          { id: 'input', label: 'Input', className: 'col-input', sortKey: 'input', width: 380, minWidth: 180, flex: 3, resizable: true },
          { id: 'expected', label: 'Expected', className: 'col-expected', sortKey: 'expected', width: 320, minWidth: 160, flex: 2, resizable: true },
          { id: 'metadata', label: 'Metadata', className: 'col-metadata', sortKey: 'metadata', width: 180, minWidth: 120, resizable: true },
          { id: 'runs', label: 'Runs', className: 'col-runs', sortKey: 'runs', width: 72, minWidth: 68, resizable: true },
        );
        metricNames.forEach(metric => columnDefs.push({ id: 'metric:' + metric, label: metric, className: 'col-metric', sortKey: 'metric:' + metric, width: metricColumnWidth(metric), minWidth: 72, resizable: true }));
        columnDefs.push(
          { id: 'latency', label: 'Latency', className: 'col-latency', sortKey: 'latency', width: 94, minWidth: 92, resizable: true },
          { id: 'edits', label: 'Edits', className: 'col-edits', sortKey: 'edits', width: 78, minWidth: 74, resizable: true },
          { id: 'actions', label: '', className: 'col-actions', width: 44, minWidth: 44, resizable: false },
        );
        function sortStateFor(key){
          if (String(state.sort || '') === key + '_asc') return 'ascending';
          if (String(state.sort || '') === key + '_desc') return 'descending';
          if (key.startsWith('metric:')) {
            if (String(state.sort || '') === key + ':asc') return 'ascending';
            if (String(state.sort || '') === key + ':desc') return 'descending';
          }
          if (key === 'index' && (!state.sort || state.sort === 'index_asc')) return 'ascending';
          if (key === 'item_id' && state.sort === 'item_id') return 'ascending';
          return 'none';
        }
        function sortValueFor(key, nextDir){
          if (key.startsWith('metric:')) return key + ':' + nextDir;
          return key + '_' + nextDir;
        }
        state.itemRowMap = new Map();
        window.QymDataTable.render({
          host: tableWrap,
          tableClass: 'dsx-table',
          storageKey: 'datasets.items.v2',
          minWidth: 1200,
          scrollLeft: options && options.scrollLeft != null ? options.scrollLeft : null,
          columns: columnDefs,
          rows: items,
          sortState: sortStateFor,
          onSort: (_column, nextDir, sortKey) => {
            state.sort = sortValueFor(sortKey, nextDir);
            state.page = 0;
            navigate({ sort: state.sort, page: 0 }, { replace: true, silent: true });
            loadItems({ keepTable: true });
          },
          renderRow: item => {
            const tr = renderItemRow(item, editable, showIdColumn, metricNames);
            state.itemRowMap.set(item.id, tr);
            return tr;
          },
        });

        if (editable) {
          const addBtn = el('button', { className: 'dsx-addrow', onclick: () => openNewItemFlow() }, '+ Add new item');
          const ftr = el('div', { style: { padding: '10px var(--space-xl)' } });
          ftr.appendChild(addBtn);
          tableWrap.appendChild(ftr);
        }
      }

      function renderItemRow(item, isDraft, showIdColumn, metricNames){
        const tr = el('tr', { dataset: { itemPk: item.id, itemId: item.item_id } });
        // The index is the row's link: one tab stop per row, Enter opens the item,
        // and it opens in a new tab like any link.
        const openLabel = 'Open item ' + (hasUserProvidedItemId(item.item_id) ? item.item_id : '#' + item.index);
        tr.appendChild(el('td', { className: 'col-idx' }, spaLink(
          buildUrl({ item: item.item_id, tab: 'details' }),
          () => navigate({ item: item.item_id, tab: 'details' }),
          { className: 'dsx-row-link', 'aria-label': openLabel, title: openLabel },
          String(item.index),
        )));
        if (showIdColumn) {
          const idTd = el('td', { className: 'col-id' });
          if (hasUserProvidedItemId(item.item_id)) {
            const idSpan = el('span', null, item.item_id);
            idTd.appendChild(idSpan);
            const copyBtn = el('button', { className: 'copy qym-icon-action', type: 'button', title: 'Copy item ID', 'aria-label': 'Copy item ID', onclick: e => { e.stopPropagation(); copyToClipboard(item.item_id); }, html: ICON_COPY });
            idTd.appendChild(copyBtn);
          }
          tr.appendChild(idTd);
        }

        tr.appendChild(makePreviewCell(item, 'input'));
        tr.appendChild(makePreviewCell(item, 'expected_output'));
        tr.appendChild(makePreviewCell(item, 'metadata'));
        const summary = item.result_summary || {};
        tr.appendChild(el('td', { className: 'col-runs' }, String(summary.run_count || item.run_count || 0)));
        const metrics = summary.metrics || {};
        (metricNames || []).forEach(metric => {
          const value = (metrics[metric] || {}).avg;
          const peers = ((state.itemsList && state.itemsList.items) || []).map(i => (((i.result_summary || {}).metrics || {})[metric] || {}).avg);
          const direction = ((state.itemsList && state.itemsList.metricDirections) || {})[metric];
          tr.appendChild(el('td', { className: 'col-metric' }, metricScoreNode(value, peers, direction)));
        });
        tr.appendChild(el('td', { className: 'col-latency' }, fmtSeconds(summary.avg_latency_ms)));
        tr.appendChild(el('td', { className: 'col-edits' }, String(item.edit_count || 0)));

        const actTd = el('td', { className: 'col-actions' });
        const menuBtn = el('button', { className: 'actions-trigger', type: 'button', title: 'Actions', 'aria-label': 'Row actions', html: ICON_DOTS });
        menuBtn.addEventListener('click', e => { e.stopPropagation(); openContextMenu(menuBtn, rowMenuItems(item, isDraft)); });
        actTd.appendChild(menuBtn);
        tr.appendChild(actTd);

        tr.addEventListener('click', e => {
          if (e.target.closest('input,button,textarea,a')) return;
          navigate({ item: item.item_id, tab: 'details' });
        });
        return tr;
      }

      // Cells are read-only previews; items are edited on the item page only.
      function makePreviewCell(item, field){
        const td = el('td', { className: field === 'input' ? 'col-input' : (field === 'metadata' ? 'col-metadata' : 'col-expected') });
        const val = item[field];
        const preview = el('div', { className: 'dsx-preview' + ((val == null || val === '') ? ' muted' : '') });
        if (val == null || val === '') preview.textContent = '—';
        else preview.textContent = (field === 'input' || field === 'metadata') ? rawItemPreview(val) : compactItemPreview(val);
        QymSafe.applyTextDir(preview, preview.textContent);
        const fullText = fullPreview(val);
        if (fullText) {
          // Hover preview only: cells are not tab stops (the row link is), so
          // keyboard users reach the full value on the item page.
          preview.addEventListener('mouseenter', () => schedulePreviewPopover(preview, fullText));
          preview.addEventListener('mouseleave', hidePreviewPopover);
        }
        td.appendChild(preview);
        return td;
      }

      function rowMenuItems(item, isDraft){
        // Opening the item page (click the row) and copying the ID (hover ⧉) are already one
        // click away, so the menu only carries actions that aren't directly on the row.
        const items = [
          { label: 'Copy as JSON', onClick: () => copyToClipboard(JSON.stringify({ item_id: item.item_id, input: item.input, expected_output: item.expected_output, metadata: item.metadata, labels: item.labels }, null, 2)) },
        ];
        if (isDraft) {
          items.push({ sep: true });
          items.push({ label: 'Delete', danger: true, onClick: async () => {
            const ok = await Shell.openConfirmDialog({ title: 'Delete item?', description: 'This will remove "' + item.item_id + '" from this draft.', confirmLabel: 'Delete', danger: true });
            if (!ok || !ok.confirmed) return;
            try { await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '?project_slug=' + encodeURIComponent(state.slug), { method: 'DELETE' }); Shell.toast('Item deleted', 'success'); refreshDetailView({ force: true }); }
            catch(e) { Shell.toast(e.message || 'Delete failed', 'error'); }
          } });
        }
        return items;
      }

      function renderPager(){
        const total = state.itemsList.total;
        const start = total === 0 ? 0 : (state.page * state.pageSize + 1);
        const end = Math.min(total, (state.page + 1) * state.pageSize);
        const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
        window.QymUIComponents?.renderPagination(pager, {
          page: state.page + 1,
          pageCount: totalPages,
          pageSize: state.pageSize,
          pageSizeOptions: [25, 50, 100, 250],
          total,
          start,
          end,
          noun: 'items',
          onPageChange: page => {
            state.page = page - 1;
            navigate({ page: state.page }, { replace: true, silent: true });
            loadItems();
          },
          onPageSizeChange: pageSize => {
            state.pageSize = pageSize;
            state.page = 0;
            navigate({ page: 0 }, { replace: true, silent: true });
            loadItems();
          },
        });
      }
    }

    // Build a stacked before->after diff for item history fields.
    const HISTORY_DIFF_FIELDS = [['input', 'input'], ['expected_output', 'expected'], ['metadata', 'metadata'], ['labels', 'labels']];
    function historyDiffBody(before, after){
      before = before || {}; after = after || {};
      const wrap = el('div', { className: 'dsx-hist-diff' });
      let changed = 0;
      HISTORY_DIFF_FIELDS.forEach(([key, label]) => {
        const texts = diffValueTexts(before[key], after[key]);
        const beforeStr = texts.before;
        const afterStr = texts.after;
        if (beforeStr === afterStr) return;
        changed++;
        const field = el('div', { className: 'dsx-hist-diff-field' });
        field.appendChild(el('div', { className: 'name' }, [label, texts.note ? el('span', { className: 'dsx-diff-typenote' }, texts.note) : null]));
        const pair = diffHtmlPair(beforeStr, afterStr);
        if (beforeStr !== '') field.appendChild(el('div', { className: 'dsx-hist-diff-pane before', html: '<span class="label">before</span>' + pair.before }));
        if (afterStr !== '') field.appendChild(el('div', { className: 'dsx-hist-diff-pane after', html: '<span class="label">after</span>' + pair.after }));
        if (pair.tooLarge) field.appendChild(el('p', { className: 'dsx-diff-toolarge', role: 'note' }, 'This field is too large to highlight word changes, so both versions are shown side by side.'));
        wrap.appendChild(field);
      });
      if (!changed) wrap.appendChild(el('div', { className: 'dsx-history-unchanged' }, 'No field changes recorded.'));
      return wrap;
    }

    // -------------------------------------------------------------
    // ITEM PAGE
    // -------------------------------------------------------------
    async function renderItemPage(){
      const root = document.getElementById('dsx-root');
      const restoreTabFocus = !!document.activeElement?.closest?.('.dsx-item-tabs [role="tab"]');
      const renderSeq = ++itemPageRenderSeq;
      const hadContent = !!root.children.length;
      if (!hadContent) {
        root.appendChild(el('div', { className: 'dsx-page' }, [
          el('div', { className: 'dsx-skel-row' }, [el('div', { className: 'dsx-skeleton', style: { width: '70%' } })]),
        ]));
      }
      const ok = await ensureDatasetDetailLoaded();
      if (renderSeq !== itemPageRenderSeq) return;
      if (!ok) {
        renderDatasetLoadError(root, 'Couldn\u2019t load this dataset', state.detailError, () => renderItemPage());
        return;
      }
      normalizeActiveVersionUrl();
      const v = state.activeVersion;
      if (!v || !state.itemId) {
        navigate({ item: null, tab: 'items' }, { replace: true });
        return;
      }
      if (window.QymTraceViewer) window.QymTraceViewer.init({ exportMode: false });

      let item;
      try {
        const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(state.itemId) + '?project_slug=' + encodeURIComponent(state.slug));
        if (renderSeq !== itemPageRenderSeq) return;
        item = resp.item;
      } catch(e) {
        if (renderSeq !== itemPageRenderSeq) return;
        renderDatasetLoadError(root, 'Couldn\u2019t load this item', e, () => renderItemPage(), {
          notFoundTitle: 'Item not found',
          notFoundMessage: 'This item is not in version ' + v.version + '. It may have been removed or the link is wrong.',
        });
        return;
      }

      const itemTab = ['details', 'runs', 'history'].includes(state.tab) ? state.tab : 'details';
      const datasetHref = appPath('/projects/' + encodeURIComponent(state.slug) + '/datasets/' + encodeURIComponent(state.datasetRef)) + '?tab=items&v=' + encodeURIComponent(v.version);
      const itemTitle = hasUserProvidedItemId(item.item_id) ? item.item_id : ('Item #' + item.index);
      setDatasetBreadcrumbs([
        { label: 'Datasets', href: appPath('/projects/' + state.slug + '/datasets') },
        { label: state.dataset.name, href: datasetHref },
        { label: itemTitle },
      ]);

      const page = el('div', { className: 'dsx-item-page' });
      const header = el('div', { className: 'dsx-item-header' });
      const main = el('div', { className: 'dsx-item-head-main' });
      const titleWrap = el('div', { className: 'dsx-item-title-wrap' });
      titleWrap.appendChild(el('div', { className: 'dsx-item-title-line' }, [
        el('h1', { className: 'dsx-item-title' }, itemTitle),
        el('button', { className: 'tv-copy-btn qym-icon-action', type: 'button', title: 'Copy item ID', 'aria-label': 'Copy item ID', onclick: () => copyToClipboard(item.item_id), html: ICON_COPY }),
      ]));
      const meta = el('div', { className: 'dsx-item-meta' }, [
        el('span', null, 'index ' + item.index),
        el('span', { className: 'dot' }),
        el('span', null, 'updated ' + relTime(item.updated_at)),
        el('span', { className: 'dot' }),
        el('span', null, 'created ' + fullDate(item.created_at)),
      ]);
      if (hasUserProvidedItemId(item.item_id)) {
        meta.appendChild(el('span', { className: 'dot' }));
        meta.appendChild(el('span', null, 'id ' + item.item_id));
      }
      titleWrap.appendChild(meta);
      main.appendChild(titleWrap);

      const actions = el('div', { className: 'dsx-item-actions' });
      if (v.status !== 'draft' && !projectReadOnly()) {
        actions.appendChild(el('button', { className: 'shell-btn shell-btn-primary qym-inline-action', type: 'button', onclick: () => createDraftFromVersionFlow(v.version, { itemId: item.item_id }) }, 'Create draft to edit'));
      }
      if (canEditVersion(v) && itemTab === 'details') {
        actions.appendChild(el('button', { className: 'shell-btn shell-btn-danger qym-inline-action', type: 'button', onclick: () => deleteItemPageItem(item, v) }, 'Delete'));
        actions.appendChild(el('span', { className: 'dsx-item-actions-sep', 'aria-hidden': 'true' }));
      }
      actions.appendChild(el('button', { className: 'shell-btn shell-btn-secondary qym-inline-action', type: 'button', title: 'Previous item', onclick: () => navigateItemPage(item, -1) }, 'Previous'));
      actions.appendChild(el('button', { className: 'shell-btn shell-btn-secondary qym-inline-action', type: 'button', title: 'Next item', onclick: () => navigateItemPage(item, 1) }, 'Next'));
      if (canEditVersion(v) && itemTab === 'details') {
        actions.appendChild(el('button', { className: 'shell-btn shell-btn-primary qym-inline-action', type: 'button', onclick: () => saveItemPageItem(item, v) }, 'Save changes'));
      }
      main.appendChild(actions);
      header.appendChild(main);
      page.appendChild(header);

      const tabs = el('div', { className: 'dsx-item-tabs qym-tabs', role: 'tablist', 'aria-label': 'Dataset item sections' });
      [['details', 'Details'], ['runs', 'Runs'], ['history', 'History']].forEach(([key, label]) => {
        tabs.appendChild(el('button', {
          className: 'dsx-item-tab qym-tabs__tab' + (itemTab === key ? ' active' : ''),
          type: 'button',
          role: 'tab',
          id: 'dsx-item-tab-' + key,
          'aria-controls': 'dsx-item-content',
          'aria-selected': itemTab === key ? 'true' : 'false',
          onclick: () => navigate({ tab: key, item: item.item_id }),
        }, label));
      });
      page.appendChild(tabs);

      const content = el('div', {
        className: 'dsx-item-content',
        id: 'dsx-item-content',
        role: 'tabpanel',
        'aria-labelledby': 'dsx-item-tab-' + itemTab,
      });
      page.appendChild(content);
      root.replaceChildren(page);

      if (itemTab === 'runs') renderItemPageRuns(content, item, v);
      else if (itemTab === 'history') renderItemPageHistory(content, item, v);
      else renderItemPageDetails(content, item, v);
      if (restoreTabFocus) {
        requestAnimationFrame(() => {
          document.getElementById('dsx-item-tab-' + itemTab)?.focus({ preventScroll: true });
        });
      }
    }

    async function navigateItemPage(item, delta){
      const v = state.activeVersion;
      if (!v || !item) return;
      try {
        const params = new URLSearchParams();
        params.set('project_slug', state.slug);
        if (state.search) params.set('search', state.search);
        if (state.sort) params.set('sort', state.sort);
        if (state.label) params.set('label', state.label);
        const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '/neighbors?' + params.toString());
        const target = delta < 0 ? resp.previous : resp.next;
        if (!target) {
          Shell.toast(delta < 0 ? 'Already at first item' : 'Already at last item', 'info');
          return;
        }
        navigate({ item: target.item_id, tab: state.tab === 'runs' || state.tab === 'history' ? state.tab : 'details' });
      } catch(e) {
        Shell.toast(e.message || 'Could not navigate item', 'error');
      }
    }

    function renderItemPageDetails(host, item, v){
      const isDraft = canEditVersion(v);

      const side = el('div', { className: 'dsx-item-side' });
      main.appendChild(itemPageJSONPanel('Input', 'input', item, isDraft));

    function itemPageJSONPanel(label, key, item, isDraft){
      const panel = el('div', { className: 'dsx-item-panel' });
      const title = el('div', { className: 'dsx-item-panel-title' });
      // The value's JSON type is always visible, so a type change is never silent.
      const typeTag = el('span', { className: 'qym-tag qym-tag--data dsx-item-type', title: 'Stored JSON type' }, jsonTypeName(item[key]));
      title.appendChild(el('span', { className: 'dsx-item-panel-label' }, [el('span', null, label), typeTag]));
      const actions = el('span', { className: 'tv-inline-actions' });
      title.appendChild(actions);
      panel.appendChild(title);
      const body = el('div', { className: 'dsx-item-panel-body' });
      const raw = fullPreview(item[key]);
      let expanded = false;
      const expandBtn = el('button', { className: 'tv-expand-btn qym-icon-action', type: 'button', title: 'Expand', 'aria-label': 'Expand', html: ICON_EXPAND });
      const copyBtn = el('button', { className: 'tv-copy-btn qym-icon-action', type: 'button', title: 'Copy', 'aria-label': 'Copy', onclick: () => copyToClipboard(raw), html: ICON_COPY });
      actions.appendChild(expandBtn);
      actions.appendChild(copyBtn);

      if (!isDraft) {
        const view = el('pre', { className: 'dsx-json-view' + (raw === '' ? ' empty' : '') });
        if (raw === '') view.textContent = '(empty)';
        else view.innerHTML = highlightJSONHtml(raw);
        expandBtn.addEventListener('click', () => {
          expanded = !expanded;
          view.classList.toggle('expanded', expanded);
          expandBtn.setAttribute('title', expanded ? 'Collapse' : 'Expand');
          expandBtn.setAttribute('aria-label', expanded ? 'Collapse' : 'Expand');
        });
        body.appendChild(view);
      } else {
        const code = el('div', { className: 'dsx-code' });
        const hl = el('pre', { className: 'dsx-code-hl' });
        const ed = el('textarea', { className: 'dsx-code-input', spellcheck: 'false', dataset: { field: key }, 'aria-label': label });
        ed.value = raw;
        code.appendChild(hl);
        code.appendChild(ed);
        // Edit state: the original text and how it is parsed. Text mode saves the text as a
        // string; JSON mode parses it. Strings start in Text mode, everything else in JSON mode.
        // originalText is read back from the textarea, which turns \r\n into \n, so an
        // untouched multi-line string is not mistaken for an edit (and rewritten) on Save.
        const field = { originalText: ed.value, originalMode: itemFieldInitialMode(key, item[key]), originalType: jsonTypeName(item[key]) };
        field.mode = field.originalMode;
        ed._dsxField = field;
        const status = el('div', { className: 'dsx-item-field-status' });
        const statusText = el('span', { className: 'dsx-item-field-state', 'aria-live': 'polite' });
        if (key !== 'metadata') {
          const modes = el('div', { className: 'qym-segmented', role: 'group', 'aria-label': label + ' value type' });
          [['text', 'Text'], ['json', 'JSON']].forEach(([mode, text]) => {
            const btn = el('button', { className: 'qym-segmented__option', type: 'button', dataset: { mode }, 'aria-pressed': field.mode === mode ? 'true' : 'false', title: mode === 'text' ? 'Save the value as a string' : 'Parse the value as JSON (number, boolean, object, array, null)' }, text);
            btn.addEventListener('click', () => {
              field.mode = mode;
              modes.querySelectorAll('.qym-segmented__option').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode ? 'true' : 'false'));
              validate();
            });
            modes.appendChild(btn);
          });
          status.appendChild(modes);
        }
        status.appendChild(statusText);
        function sync(){ hl.innerHTML = highlightJSONHtml(ed.value) + '\n'; hl.scrollTop = ed.scrollTop; hl.scrollLeft = ed.scrollLeft; }
        function validate(){
          const res = parseItemField(ed.value, key, field.mode);
          code.classList.toggle('invalid', !res.ok);
          ed.setAttribute('aria-invalid', res.ok ? 'false' : 'true');
          statusText.replaceChildren();
          statusText.appendChild(el('span', { className: 'dsx-json-dot' + (res.ok ? '' : ' invalid') }));
          if (!res.ok) {
            statusText.appendChild(document.createTextNode(' ' + (res.error || 'invalid')));
            return;
          }
          const unchanged = ed.value === field.originalText && field.mode === field.originalMode;
          const nextType = unchanged ? field.originalType : jsonTypeName(res.value);
          typeTag.textContent = nextType === field.originalType ? nextType : (field.originalType + ' → ' + nextType);
          typeTag.classList.toggle('qym-tag--warning', nextType !== field.originalType);
          statusText.appendChild(document.createTextNode(' ' + (unchanged ? 'unchanged' : (nextType === 'null' ? 'will be saved empty' : 'will be saved as ' + nextType))));
        }
        function autoGrow(){
          ed.style.height = 'auto';
          const cap = expanded ? Infinity : Math.round(window.innerHeight * 0.62);
          ed.style.height = Math.max(120, Math.min(ed.scrollHeight, cap)) + 'px';
        }
        expandBtn.addEventListener('click', () => {
          expanded = !expanded;
          code.classList.toggle('expanded', expanded);
          expandBtn.setAttribute('title', expanded ? 'Collapse' : 'Expand');
          expandBtn.setAttribute('aria-label', expanded ? 'Collapse' : 'Expand');
          autoGrow();
        });
        ed.addEventListener('input', () => { sync(); validate(); autoGrow(); });
        ed.addEventListener('scroll', () => { hl.scrollTop = ed.scrollTop; hl.scrollLeft = ed.scrollLeft; });
        sync(); validate(); requestAnimationFrame(autoGrow);
        body.appendChild(code);
        body.appendChild(status);
      }
      panel.appendChild(body);
      return panel;
    }

    // Only fields the user touched are sent (PATCH is a partial update), so untouched values
    // keep their exact JSON type and labels are never dropped.
    function collectItemPageValues(){
      const body = {};
      document.querySelectorAll('.dsx-item-page textarea[data-field]').forEach(ed => {
        const key = ed.dataset.field;
        const field = ed._dsxField;
        if (!field || (ed.value === field.originalText && field.mode === field.originalMode)) return;
        const res = parseItemField(ed.value, key, field.mode);
        if (!res.ok) throw new Error(ITEM_FIELD_LABELS[key] + ': ' + (res.error || 'invalid value'));
        body[key] = res.value;
      });
      return body;
    }

    async function saveItemPageItem(item, v){
      try {
        const body = collectItemPageValues();
        if (!Object.keys(body).length) { Shell.toast('No changes to save', 'info'); return; }
        const upd = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '?project_slug=' + encodeURIComponent(state.slug), { method: 'PATCH', body });
        Shell.toast('Saved', 'success');
        state.itemId = upd.item.item_id;
        renderItemPage();
      } catch(e) {
        Shell.toast(e.message || 'Save failed', 'error');
      }
    }

    async function deleteItemPageItem(item, v){
      const ok = await Shell.openConfirmDialog({ title: 'Delete item?', description: 'This will remove "' + item.item_id + '" from this draft.', confirmLabel: 'Delete', danger: true });
      if (!ok || !ok.confirmed) return;
      try {
        await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '?project_slug=' + encodeURIComponent(state.slug), { method: 'DELETE' });
        Shell.toast('Item deleted', 'success');
        navigate({ item: null, tab: 'items' }, { forceReload: true });
      } catch(e) {
        Shell.toast(e.message || 'Delete failed', 'error');
      }
    }

    async function renderItemPageRuns(host, item, v){
      host.innerHTML = '<div class="dsx-skel-row"><div class="dsx-skeleton" style="width:80%"></div></div>';
      try {
        const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '/runs?project_slug=' + encodeURIComponent(state.slug));
        host.innerHTML = '';
        const runs = resp.runs || [];
        if (!runs.length) {
          host.appendChild(el('div', { className: 'dsx-empty' }, [el('h3', null, 'No runs yet'), el('p', null, 'This item has not been used in any run.')])); return;
        }
        const agg = resp.aggregates || {};
        const aggWrap = el('div', { className: 'dsx-run-aggregate qym-stat-strip', style: { marginBottom: '12px' } });
        [['Runs', agg.run_count], ['Errors', agg.error_count || 0], ['Avg latency', fmtSeconds(agg.avg_latency_ms)]].forEach(([label, value]) => {
          aggWrap.appendChild(el('div', { className: 'tile qym-stat-strip__item' }, [el('div', { className: 'label qym-stat-strip__label' }, label), el('div', { className: 'value qym-stat-strip__value' }, String(value == null ? '—' : value))]));
        });
        Object.keys(agg.metrics || {}).sort().forEach(metric => {
          const m = agg.metrics[metric] || {};
          aggWrap.appendChild(el('div', { className: 'tile qym-stat-strip__item' }, [el('div', { className: 'label qym-stat-strip__label' }, metric), el('div', { className: 'value qym-stat-strip__value' }, metricScoreNode(m.avg, null, (agg.metric_directions || {})[metric]))]));
        });
        host.appendChild(aggWrap);

        const wrap = el('div', { className: 'dsx-item-runs-wrap' });
        host.appendChild(wrap);

        function runScoreByMetric(run){
          const out = {};
          (run.scores || []).forEach(score => { out[score.metric_name] = score; });
          return out;
        }
        const metricNames = Array.from(new Set(runs.flatMap(r => (r.scores || []).map(s => s.metric_name)))).sort();
        function currentSort(){
          const raw = state.itemRunSort || 'created_desc';
          if (raw.startsWith('metric:')) {
            const parts = raw.split(':');
            return { key: 'metric:' + (parts[1] || ''), dir: parts[2] === 'asc' ? 'asc' : 'desc' };
          }
          const idx = raw.lastIndexOf('_');
          return idx > 0 ? { key: raw.slice(0, idx), dir: raw.slice(idx + 1) === 'asc' ? 'asc' : 'desc' } : { key: 'created', dir: 'desc' };
        }
        function sortValue(run, key){
          const runName = run.run_name || run.external_run_id || run.run_id || '';
          if (key === 'run_name') return runName.toLowerCase();
          if (key === 'created') return new Date(run.created_at || run.started_at || 0).getTime();
          if (key === 'model') return String(run.model || '').toLowerCase();
          if (key === 'output') return String(run.error ? ('ERROR: ' + run.error) : fullPreview(run.output)).toLowerCase();
          if (key === 'latency') return run.latency_ms == null ? null : Number(run.latency_ms);
          if (key.startsWith('metric:')) {
            const metric = key.slice('metric:'.length);
            const score = runScoreByMetric(run)[metric];
            if (!score) return null;
            if (score.score_numeric != null) return Number(score.score_numeric);
            return score.score_raw == null ? null : String(score.score_raw).toLowerCase();
          }
          return runName.toLowerCase();
        }
        function sortedRuns(){
          const sort = currentSort();
          return runs.slice().sort((a, b) => {
            const av = sortValue(a, sort.key);
            const bv = sortValue(b, sort.key);
            const am = av == null || av === '';
            const bm = bv == null || bv === '';
            if (am !== bm) return am ? 1 : -1;
            let cmp = 0;
            if (typeof av === 'number' && typeof bv === 'number') cmp = av - bv;
            else cmp = String(av).localeCompare(String(bv));
            if (cmp === 0) cmp = String(a.run_id || '').localeCompare(String(b.run_id || ''));
            return sort.dir === 'desc' ? -cmp : cmp;
          });
        }
        function sortStateFor(key){
          const sort = currentSort();
          return sort.key === key ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
        }
        function sortValueFor(key, nextDir){
          if (key.startsWith('metric:')) return key + ':' + nextDir;
          return key + '_' + nextDir;
        }
        function runTableColumns(){
          const columns = [
            { id: 'run_name', label: 'Run name', className: 'col-run-name', sortKey: 'run_name', width: 230, minWidth: 150 },
            { id: 'created', label: 'Run date', className: 'col-run-date', sortKey: 'created', width: 150, minWidth: 120 },
            { id: 'model', label: 'Model', className: 'col-run-model', sortKey: 'model', width: 130, minWidth: 96 },
            { id: 'output', label: 'Output', className: 'col-run-output', sortKey: 'output', width: 255, minWidth: 170, flex: 1 },
            { id: 'latency', label: 'Latency', className: 'col-latency', sortKey: 'latency', width: 94, minWidth: 92 },
          ];
          metricNames.forEach(metric => columns.push({ id: 'metric:' + metric, label: metric, className: 'col-metric', sortKey: 'metric:' + metric, width: metricColumnWidth(metric), minWidth: 72 }));
          columns.push({ id: 'trace', label: 'Trace', className: 'col-run-trace', width: 64, minWidth: 62, resizable: false });
          return columns;
        }
        function renderRunRow(r){
          const row = el('tr');
          const runName = r.run_name || r.external_run_id || r.run_id;
          const runBtn = runLinkEl('run-name', r.run_id, runName, { itemId: r.item_id, title: 'Open this item in ' + runName });
          row.appendChild(el('td', { className: 'col-run-name' }, runBtn));
          row.appendChild(el('td', { className: 'col-run-date' }, fullDateTime(r.created_at || r.started_at)));
          row.appendChild(el('td', { className: 'col-run-model' }, r.model || '—'));
          const outputText = r.error ? ('ERROR: ' + r.error) : fullPreview(r.output);
          const outputWrap = el('div', { className: 'dsx-run-output-body' });
          const output = el('div', { className: 'dsx-item-run-output' }, outputText || '—');
          QymSafe.applyTextDir(output, outputText || '');
          if (state.itemRunOutputsExpanded && outputText) {
            output.classList.add('expanded');
            row.classList.add('output-expanded');
          }
          outputWrap.appendChild(output);
          row.appendChild(el('td', { className: 'col-run-output' }, outputWrap));
          row.appendChild(el('td', { className: 'col-latency', style: { fontFamily: 'var(--font-mono)' } }, fmtSeconds(r.latency_ms)));
          const scoresByMetric = runScoreByMetric(r);
          metricNames.forEach(metric => {
            const score = scoresByMetric[metric];
            const value = score ? (score.score_numeric != null ? score.score_numeric : score.score_raw) : null;
            const peers = runs.map(run => {
              const peerScore = runScoreByMetric(run)[metric];
              return peerScore ? (peerScore.score_numeric != null ? peerScore.score_numeric : peerScore.score_raw) : null;
            });
            row.appendChild(el('td', { className: 'col-metric', title: score ? (score.explanation || score.label || '') : '' }, metricScoreNode(value, peers, (r.metric_directions || {})[metric])));
          });
          const traceEndpoint = apiUrl('/api/runs/' + encodeURIComponent(r.run_id) + '/items/' + encodeURIComponent(r.item_id) + '/trace');
          row.appendChild(el('td', { className: 'col-run-trace' }, el('button', {
            className: 'dsx-trace-icon-btn trace-drawer-btn qym-icon-action',
            type: 'button',
            title: 'Open trace viewer',
            'aria-label': 'Open trace viewer',
            'data-trace-endpoint': traceEndpoint,
            'data-trace-item-label': runName + ' · ' + r.item_id,
            'data-trace-id': r.trace_id || '',
            'data-trace-url': r.trace_url || '',
            html: ICON_TRACE,
          })));
          return row;
        }
        function renderRunsTable(){
          const scrollLeft = wrap.scrollLeft;
          const columns = runTableColumns();
          const minTableWidth = columns.reduce((sum, column) => sum + (column.width || column.minWidth || 44), 0);
          window.QymDataTable.render({
            host: wrap,
            tableClass: 'dsx-table dsx-item-runs-table',
            storageKey: 'datasets.item.runs.v4',
            minWidth: Math.max(1120, minTableWidth),
            scrollLeft,
            columns,
            rows: sortedRuns(),
            sortState: sortStateFor,
            onSort: (_column, nextDir, sortKey) => {
              state.itemRunSort = sortValueFor(sortKey, nextDir);
              renderRunsTable();
            },
            renderRow: renderRunRow,
          });
          const outputHeader = wrap.querySelector('th.col-run-output');
          if (outputHeader) {
            const expanded = !!state.itemRunOutputsExpanded;
            const toggle = el('button', {
              className: 'tv-expand-btn dsx-output-expand-btn qym-icon-action',
              type: 'button',
              title: expanded ? 'Collapse outputs' : 'Expand outputs',
              'aria-label': expanded ? 'Collapse outputs' : 'Expand outputs',
              html: ICON_EXPAND,
            });
            toggle.addEventListener('click', e => {
              e.preventDefault();
              e.stopPropagation();
              state.itemRunOutputsExpanded = !state.itemRunOutputsExpanded;
              renderRunsTable();
            });
            outputHeader.appendChild(toggle);
          }
        }
        renderRunsTable();
      } catch(e) {
        host.innerHTML = '<div class="dsx-empty"><p>' + escapeHtml(e.message || 'Failed to load runs') + '</p></div>';
      }
    }

      try {
        const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + '/items/' + encodeURIComponent(item.item_id) + '/lineage?project_slug=' + encodeURIComponent(state.slug));
        host.innerHTML = '';

          const version = node.version || {};

          head.appendChild(el('span', null, [
            el('span', { className: 'qym-tag qym-tag--version', title: 'Version status: ' + (version.status || 'unknown') }, version.version || 'version'),

          entry.appendChild(head);
