    // ============================================================
    // UPLOAD WIZARD (3 steps)
    // ============================================================
    // Text encodings offered for CSV/TSV files. Values are TextDecoder labels, which the
    // upload API accepts as `encoding`. Excel on Arabic Windows saves "CSV" as Windows-1256.
    const CSV_ENCODINGS = [
      ['utf-8', 'UTF-8'],
      ['utf-16le', 'UTF-16 LE'],
      ['utf-16be', 'UTF-16 BE'],
      ['windows-1256', 'Windows-1256 (Arabic)'],
      ['iso-8859-6', 'ISO-8859-6 (Arabic)'],
      ['windows-1252', 'Windows-1252 (Western European)'],
    ];
    // Tried in this order when a file is not UTF-8; ties keep the historic Windows-1252.
    const LEGACY_CSV_ENCODINGS = ['windows-1252', 'windows-1256', 'iso-8859-6'];
    const ENCODING_SAMPLE_CHARS = 262144;
    const NEUTRAL_TEXT_CHARS = new Set(Array.from('\u00a0\u00ab\u00bb\u201c\u201d\u2018\u2019\u201e\u2013\u2014\u2026\u2022\u20ac\u00a3\u00a5\u00b0\u00a9\u00ae\u2122\u00a7\u00b7\u00bf\u00a1\u00d7\u00ac\u060c\u061b\u061f\u066a\u066b\u066c'));
    // Keys the importer reads from a JSON/JSONL record (same aliases as the server).
    const JSON_ITEM_KEYS = ['item_id', 'id', 'input', 'expected_output', 'expected', 'metadata', 'labels'];
    function encodingLabel(encoding){
      const hit = CSV_ENCODINGS.find(entry => entry[0] === encoding);
      return hit ? hit[1] : encoding;
    }
    function isArabicCodePoint(cp){
      return (cp >= 0x0600 && cp <= 0x06FF) || (cp >= 0x0750 && cp <= 0x077F) || (cp >= 0x08A0 && cp <= 0x08FF)
        || (cp >= 0xFB50 && cp <= 0xFDFF) || (cp >= 0xFE70 && cp <= 0xFEFF);
    }
    // Mirrors _legacy_text_score in api/datasets.py. Arabic read with the wrong code page
    // becomes words made of accented Latin letters; Latin read as Arabic mixes scripts
    // inside a word. Real text keeps one script per word, so it scores higher.
    // A one-letter word is no evidence (French "à" is an Arabic letter in ISO-8859-6).
    function legacyTextScore(text){
      let total = 0;
      let word = [];
      const flush = () => {
        const nonAscii = word.filter(ch => ch.codePointAt(0) > 0x7f);
        if (nonAscii.length && word.length > 1) {
          const arabic = word.some(ch => isArabicCodePoint(ch.codePointAt(0)));
          const latin = word.some(ch => ch.codePointAt(0) < 0x250);
          const other = word.some(ch => { const cp = ch.codePointAt(0); return cp >= 0x250 && !isArabicCodePoint(cp); });
          if (other || (arabic && latin)) total -= 2 * nonAscii.length;
          else if (arabic) total += word.length;
          else if (2 * nonAscii.length <= word.length) total += nonAscii.length;
          else total -= nonAscii.length;
        }
        word = [];
      };
      for (const ch of text) {
        if (/[\p{L}\p{M}]/u.test(ch)) { word.push(ch); continue; }
        flush();
        if (ch.codePointAt(0) > 0x7f && !/[\p{N}\p{Z}]/u.test(ch) && !NEUTRAL_TEXT_CHARS.has(ch)) total -= 1;
      }
      flush();
      return total;
    }
    function decodeBytes(bytes, encoding){
      return new TextDecoder(encoding, { fatal: true }).decode(bytes);
    }
    function detectCSVEncoding(bytes){
      if (bytes[0] === 0xff && bytes[1] === 0xfe) return 'utf-16le';
      if (bytes[0] === 0xfe && bytes[1] === 0xff) return 'utf-16be';
      try { decodeBytes(bytes, 'utf-8'); return 'utf-8'; } catch (_) { /* not UTF-8: score the legacy code pages */ }
      let best = null;
      LEGACY_CSV_ENCODINGS.forEach(encoding => {
        let text;
        try { text = decodeBytes(bytes, encoding); } catch (_) { return; }
        const score = legacyTextScore(text.slice(0, ENCODING_SAMPLE_CHARS));
        if (!best || score > best.score) best = { encoding, score };
      });
      return best ? best.encoding : 'windows-1252';
    }
    // Mirrors _slugify in api/datasets.py ('' means the server generates one).
    function slugifyDatasetName(value){
      const text = String(value || '').normalize('NFKC').trim().toLowerCase();
      const chars = [];
      for (const ch of text) {
        const last = chars[chars.length - 1];
        if (/[\p{L}\p{N}]/u.test(ch)) chars.push(ch);
        else if (/\p{M}/u.test(ch) && chars.length && last !== '-') chars.push(ch);
        else if (chars.length && last !== '-') chars.push('-');
      }
      return chars.slice(0, 120).join('').replace(/^-+|-+$/g, '');
    }
    function nextVersionAfter(version){
      const m = /^v(\d+)$/.exec(String(version || ''));
      return m ? 'v' + (parseInt(m[1], 10) + 1) : null;
    }
    // Mirrors _labels in api/datasets.py: a comma-separated string or a list of values.
    function importLabels(value){
      if (typeof value === 'string') return value.split(',').map(part => part.trim()).filter(Boolean);
      if (Array.isArray(value)) return value.map(part => String(part).trim()).filter(Boolean);
      return [];
    }
    function jsonRecordProblem(obj){
      if (obj === null || typeof obj !== 'object' || Array.isArray(obj)) return 'must be a JSON object';
      if (obj.metadata != null && (typeof obj.metadata !== 'object' || Array.isArray(obj.metadata))) return 'metadata must be a JSON object';
      return '';
    }
    // Parse a .json/.jsonl upload with the server's rules: a .json file holding an array is
    // JSON, anything else is JSONL, and every record must be an object. Nothing is dropped:
    // records that cannot be imported are returned as errors with their line/item number.
    function parseJSONRecords(text, fileName){
      const body = String(text || '').replace(/^\uFEFF/, '');
      const rows = [];
      const errors = [];
      if (String(fileName || '').toLowerCase().endsWith('.json') && body.trim().startsWith('[')) {
        let doc;
        try { doc = JSON.parse(body); }
        catch (e) { return { format: 'json', rows, errors: [{ where: 'File', message: 'is not valid JSON (' + e.message + ')' }], total: 0 }; }
        doc.forEach((obj, index) => {
          const problem = jsonRecordProblem(obj);
          if (problem) errors.push({ where: 'Item ' + (index + 1), message: problem });
          else rows.push(obj);
        });
        return { format: 'json', rows, errors, total: doc.length };
      }
      let total = 0;
      body.split('\n').forEach((line, index) => {
        const t = line.trim();
        if (!t) return;
        total += 1;
        let obj;
        try { obj = JSON.parse(t); }
        catch (_) { errors.push({ where: 'Line ' + (index + 1), message: 'is not valid JSON' }); return; }
        const problem = jsonRecordProblem(obj);
        if (problem) errors.push({ where: 'Line ' + (index + 1), message: problem });
        else rows.push(obj);
      });
      return { format: 'jsonl', rows, errors, total };
    }

    function openUploadWizard(opts){
      opts = opts || {};
      // 'new' creates a dataset (never appends to one), 'new-version' adds the file as a new
      // version of opts.target, 'add-to-draft' upserts the rows into an existing draft.
      let mode = opts.mode || 'new';
      const targetVersionLabel = opts.versionLabel || null;

      const wstate = {
        step: 1,
        file: null,
        format: null,           // 'csv' | 'jsonl' | 'json'
        reading: false,
        readSeq: 0,
        readError: '',
        csvBytes: null,         // raw bytes, kept so another encoding can re-decode the preview
        encoding: null,         // encoding used for the CSV (detected or chosen)
        detectedEncoding: null,
        encodingError: '',
        encodingSuspicious: false,
        csvDelimiter: ',',
        csvHeaders: [],
        csvRows: [],            // all rows for import; only the preview is truncated
        jsonlRows: [],          // every valid JSON/JSONL record
        jsonErrors: [],         // records that cannot be imported: [{ where, message }]
        jsonTotal: 0,
        name: '',
        description: '',
        versionName: '',
        // A brand-new dataset can safely become production; a new version of an existing
        // dataset stays a draft unless the user explicitly opts in.
        publish: mode === 'new',
        setAlias: mode === 'new',
        mapping: { input: [], expected: [], id: '', metadata: [] },
        target: opts.target || null, // 'new-version': { id, name, slug, nextVersion }
        errors: {},                  // inline errors shown next to fields: name, file, mapping, submit
        // for add-to-draft
        draftRef: opts.ref || state.datasetRef,
        draftVersion: targetVersionLabel,
      };
      let nameInputEl = null;
      let nameErrorEl = null;
      let slugHelpEl = null;
      let fileStatusEl = null;
      let fileInputEl = null;

      function wizardTitle(){ return mode === 'new' ? 'Upload dataset' : (mode === 'new-version' ? 'Upload new version' : 'Add items to draft'); }
      function wizardSubtitle(){
        if (mode === 'new-version' && wstate.target) return 'Upload a CSV, TSV, JSON, or JSONL file as a new version of "' + wstate.target.name + '".';
        return 'Upload a CSV, TSV, JSON, or JSONL file.';
      }
      function submitLabel(){ return mode === 'new' ? 'Create dataset' : (mode === 'new-version' ? 'Create version' : 'Add items'); }

      // Modal scaffold on the shell modal markup, with dialog semantics: a labelled
      // role="dialog", focus moved into it, Tab kept inside, focus returned to the
      // control that opened it, and no silent loss of a loaded file (requestClose).
      const opener = document.activeElement;
      const backdrop = el('div', { className: 'shell-modal-backdrop' });
      const modal = el('div', {
        className: 'shell-modal',
        role: 'dialog',
        'aria-modal': 'true',
        'aria-labelledby': 'dsx-wiz-title',
        'aria-describedby': 'dsx-wiz-subtitle',
        style: { maxWidth: '780px', width: '100%' },
      });
      const header = el('div', { className: 'shell-modal-header' });
      const titleWrap = el('div');
      const titleEl = el('h2', { className: 'shell-modal-title', id: 'dsx-wiz-title' }, wizardTitle());
      const subtitleEl = el('div', { className: 'shell-modal-subtitle', id: 'dsx-wiz-subtitle' }, wizardSubtitle());
      titleWrap.appendChild(titleEl);
      titleWrap.appendChild(subtitleEl);
      header.appendChild(titleWrap);
      const closeBtn = el('button', { className: 'shell-modal-close qym-icon-action', type: 'button', 'aria-label': 'Close', onclick: () => requestClose() }, '×');
      header.appendChild(closeBtn);
      modal.appendChild(header);

      const steps = el('ol', { className: 'dsx-wizard-steps', 'aria-label': 'Upload steps' });
      const stepEls = ['Source', 'Map columns', 'Review'].map((label, i) => {
        const s = el('li', { className: 'dsx-wizard-step' + (i === 0 ? ' active' : '') });
        s.appendChild(el('span', { className: 'num', 'aria-hidden': 'true' }, String(i + 1)));
        s.appendChild(document.createTextNode(label));
        steps.appendChild(s);
        return s;
      });
      modal.appendChild(steps);

      const body = el('div', { className: 'shell-modal-body', id: 'dsx-wiz-body', style: { minHeight: '320px' } });
      modal.appendChild(body);

      const footer = el('div', { className: 'shell-modal-footer' });
      const backBtn = el('button', { className: 'shell-btn shell-btn-secondary', type: 'button', onclick: stepBack }, '← Back');
      const nextBtn = el('button', { className: 'shell-btn shell-btn-primary', type: 'button', onclick: stepNext }, 'Continue →');
      footer.appendChild(el('button', { className: 'shell-btn shell-btn-secondary', type: 'button', onclick: () => requestClose() }, 'Cancel'));
      const spacer = el('div', { style: { flex: 1 } });
      footer.appendChild(spacer);
      footer.appendChild(backBtn);
      footer.appendChild(nextBtn);
      modal.appendChild(footer);

      backdrop.appendChild(modal);
      document.body.appendChild(backdrop);
      requestAnimationFrame(() => backdrop.classList.add('shell-modal-open'));

      let closed = false;
      let confirmingClose = false;
      function close(){
        if (closed) return;
        closed = true;
        document.removeEventListener('keydown', onWizardKey, true);
        // Focus goes to the opener below (the menu trigger), not the
        // contract's remembered element.
        if (window.QymUIComponents) window.QymUIComponents.releaseDialog(modal, { restoreFocus: false });
        backdrop.classList.remove('shell-modal-open');
        setTimeout(() => backdrop.remove(), 200);
        if (opener && opener.isConnected && typeof opener.focus === 'function') opener.focus();
      }
      // Escape, the backdrop, x and Cancel all ask first once a file is loaded:
      // closing throws away the parsed file and the column mapping.
      async function requestClose(){
        if (closed || confirmingClose) return;
        if (!wstate.file) { close(); return; }
        confirmingClose = true;
        let res = null;
        try {
          res = await Shell.openConfirmDialog({
            title: 'Discard this upload?',
            description: '"' + wstate.file.name + '" and your column choices will be lost.',
            confirmLabel: 'Discard upload',
            cancelLabel: 'Keep editing',
            confirmClass: 'shell-btn-danger',
          });
        } finally {
          confirmingClose = false;
        }
        if (res && res.confirmed) close();
        else focusFirst();
      }
      function focusables(){
        return Array.from(modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
          .filter(node => !node.disabled && node.getAttribute('aria-hidden') !== 'true' && node.offsetParent !== null && !(node.type === 'file' && node.closest('.dsx-file-drop')));
      }
      function focusFirst(){
        requestAnimationFrame(() => {
          // Closed before this frame (a quick Escape): focus stays on the opener.
          if (closed) return;
          const preferred = body.querySelector('[data-autofocus]') || focusables().find(node => body.contains(node));
          (preferred || nextBtn).focus();
        });
      }
      // The wizard keeps its own Escape (ask first) and Tab trap, so it holds
      // even where the shared contract (ui_components.js) is not loaded.
      function onWizardKey(e){
        if (closed || confirmingClose) return;
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); requestClose(); return; }
        if (e.key !== 'Tab') return;
        const nodes = focusables();
        if (!nodes.length) return;
        const first = nodes[0], last = nodes[nodes.length - 1];
        if (!modal.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      function updateSteps(){
        stepEls.forEach((s, i) => {
          s.classList.toggle('active', wstate.step === i + 1);
          s.classList.toggle('done', wstate.step > i + 1);
          if (wstate.step === i + 1) s.setAttribute('aria-current', 'step'); else s.removeAttribute('aria-current');
        });
        backBtn.style.visibility = wstate.step === 1 ? 'hidden' : 'visible';
        nextBtn.textContent = wstate.step === 3 ? submitLabel() : 'Continue →';
      }
      function stepBack(){ if (wstate.step > 1) { wstate.errors = {}; wstate.step = wstate.step === 3 && wstate.format !== 'csv' ? 1 : wstate.step - 1; render(); } }
      function stepNext(){
        if (wstate.step === 1) {
          const errors = {};
          const nameProblem = mode === 'new' ? nameError() : '';
          if (nameProblem) errors.name = nameProblem;
          const fileProblem = fileError();
          if (fileProblem) errors.file = fileProblem;
          wstate.errors = errors;
          if (Object.keys(errors).length) {
            refreshNameError();
            refreshFileStatus();
            (errors.name && nameInputEl ? nameInputEl : body.querySelector('.dsx-file-browse'))?.focus?.();
            return;
          }
          wstate.step = wstate.format === 'csv' ? 2 : 3; render(); return;
        }
        if (wstate.step === 2) {
          if (!wstate.mapping.input || !wstate.mapping.input.length) {
            wstate.errors = { mapping: 'Choose Input for at least one column before you continue.' };
            rerenderStep2();
            body.querySelector('select[data-column]')?.focus();
            return;
          }
          wstate.errors = {};
          wstate.step = 3; render(); return;
        }
        if (wstate.step === 3) { submit(); return; }
      }

      function render(){
        updateSteps();
        body.innerHTML = '';
        if (wstate.step === 1) body.appendChild(renderStep1());
        else if (wstate.step === 2) body.appendChild(renderStep2());
        else body.appendChild(renderStep3());
        focusFirst();
      }

      // ---- Step 1: name + file -------------------------------------------------------
      function nameClash(){
        const clean = wstate.name.trim();
        if (!clean) return null;
        const slug = slugifyDatasetName(clean);
        const lower = clean.toLowerCase();
        return (state.datasets || []).find(d => String(d.name || '').trim().toLowerCase() === lower
          || d.slug === clean || (slug && d.slug === slug)) || null;
      }
      function nameError(){
        if (!wstate.name.trim()) return 'Enter a name for the dataset.';
        const clash = nameClash();
        if (clash) return 'A dataset named "' + clash.name + '" already exists (slug ' + clash.slug + '). Choose another name, or upload this file as a new version of it.';
        return '';
      }
      function refreshNameError(){
        if (!nameInputEl || !nameErrorEl) return;
        const clash = nameClash();
        // A clash shows as you type; "required" only after Continue.
        const message = clash ? nameError() : (wstate.errors.name ? nameError() : '');
        nameInputEl.setAttribute('aria-invalid', message ? 'true' : 'false');
        nameErrorEl.replaceChildren();
        if (message) {
          nameErrorEl.appendChild(el('span', null, message));
          if (clash) {
            nameErrorEl.appendChild(el('button', { type: 'button', className: 'dsx-wiz-link', onclick: () => switchToNewVersion(clash) }, 'Upload as a new version of "' + clash.name + '"'));
          }
        }
        if (slugHelpEl) {
          const slug = slugifyDatasetName(wstate.name);
          slugHelpEl.textContent = wstate.name.trim() ? ('Slug: ' + (slug || 'generated automatically')) : '';
        }
      }
      function switchToNewVersion(dataset){
        mode = 'new-version';
        wstate.target = {
          id: dataset.id,
          name: dataset.name,
          slug: dataset.slug,
          nextVersion: nextVersionAfter(dataset.latest_version && dataset.latest_version.version),
          permissions: dataset.permissions || {},
        };
        wstate.publish = false;
        wstate.setAlias = false;
        wstate.errors = {};
        titleEl.textContent = wizardTitle();
        subtitleEl.textContent = wizardSubtitle();
        render();
      }
      function jsonErrorsSummary(){
        const errs = wstate.jsonErrors;
        if (errs.length === 1 && errs[0].where === 'File') return 'The file ' + errs[0].message + '. Fix it and choose the file again.';
        const unit = wstate.format === 'json' ? 'items' : 'lines';
        return errs.length + ' of ' + wstate.jsonTotal + ' ' + unit + ' cannot be imported, so nothing will be uploaded. Fix these ' + unit + ' and choose the file again.';
      }
      function fileError(){
        if (!wstate.file) return 'Choose a file to upload.';
        if (wstate.reading) return 'Still reading the file. Try again in a moment.';
        if (wstate.readError) return wstate.readError;
        if (wstate.format === 'csv') {
          if (wstate.encodingError) return wstate.encodingError;
          if (!wstate.csvHeaders.length) return 'The file has no header row.';
          if (!wstate.csvRows.length) return 'The file has a header row but no data rows.';
          return '';
        }
        if (wstate.jsonErrors.length) return jsonErrorsSummary();
        if (!wstate.jsonlRows.length) return 'The file has no items.';
        return '';
      }

      function renderStep1(){
        const wrap = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '14px' } });
        nameInputEl = null; nameErrorEl = null; slugHelpEl = null;
        if (mode === 'new') {
          const nameField = el('div', { className: 'shell-form-field' });
          nameField.appendChild(el('label', { className: 'shell-form-label', for: 'dsx-wiz-name' }, 'Name *'));
          nameInputEl = el('input', { className: 'shell-form-input', id: 'dsx-wiz-name', placeholder: 'e.g. Customer Support QA', value: wstate.name, 'aria-describedby': 'dsx-wiz-name-error dsx-wiz-slug', 'aria-required': 'true', 'data-autofocus': wstate.name ? null : 'true' });
          nameInputEl.addEventListener('input', e => { wstate.name = e.target.value; refreshNameError(); });
          nameField.appendChild(nameInputEl);
          slugHelpEl = el('div', { className: 'shell-form-help', id: 'dsx-wiz-slug' });
          nameField.appendChild(slugHelpEl);
          nameErrorEl = el('div', { className: 'dsx-field-error', id: 'dsx-wiz-name-error', role: 'alert' });
          nameField.appendChild(nameErrorEl);
          wrap.appendChild(nameField);

          const descField = el('div', { className: 'shell-form-field' });
          descField.appendChild(el('label', { className: 'shell-form-label', for: 'dsx-wiz-description' }, 'Description'));
          const descInput = el('textarea', { className: 'shell-form-input', id: 'dsx-wiz-description', rows: 2, placeholder: 'Optional', style: { resize: 'vertical' } });
          descInput.value = wstate.description;
          descInput.addEventListener('input', e => { wstate.description = e.target.value; });
          descField.appendChild(descInput);
          wrap.appendChild(descField);
        } else if (mode === 'new-version') {
          wrap.appendChild(el('div', { className: 'shell-form-help' }, 'The file becomes a new version of "' + (wstate.target && wstate.target.name) + '". Existing versions and the production alias are not changed unless you choose to on the Review step.'));
        } else {
          wrap.appendChild(el('div', { className: 'shell-form-help' }, 'Items will be added to version "' + (wstate.draftVersion || state.versionLabel || 'current draft') + '" of "' + (state.dataset && state.dataset.name) + '".'));
        }

        const fileField = el('div', { className: 'shell-form-field' });
        fileField.appendChild(el('label', { className: 'shell-form-label', for: 'dsx-wiz-file', id: 'dsx-wiz-file-label' }, 'File (CSV, TSV, JSON, or JSONL) *'));
        const drop = el('div', { className: 'dsx-file-drop' });
        fileInputEl = el('input', { type: 'file', id: 'dsx-wiz-file', tabindex: '-1', accept: '.csv,.tsv,.txt,.jsonl,.ndjson,.json,text/csv,text/tab-separated-values,text/plain,application/json', 'aria-describedby': 'dsx-wiz-file-status' });
        // The visible control is a real button (Enter/Space open the file picker);
        // dropping a file on the area still works for mouse users.
        const browseBtn = el('button', {
          type: 'button',
          className: 'dsx-file-browse',
          'aria-describedby': 'dsx-wiz-file-status',
          'aria-labelledby': 'dsx-wiz-file-label dsx-wiz-file-choose',
          'data-autofocus': (mode !== 'new' || wstate.name) && !wstate.file ? 'true' : null,
        }, [el('strong', null, 'Drag & drop'), ' or ', el('span', { id: 'dsx-wiz-file-choose', className: 'dsx-file-choose' }, wstate.file ? 'choose another file' : 'choose a file')]);
        browseBtn.addEventListener('click', e => { e.stopPropagation(); fileInputEl.click(); });
        drop.appendChild(fileInputEl);
        drop.appendChild(browseBtn);
        const fileNameEl = el('div', { className: 'filename' }, wstate.file ? wstate.file.name : '');
        drop.appendChild(fileNameEl);
        drop.addEventListener('click', () => fileInputEl.click());
        ['dragover','dragenter'].forEach(evt => drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.add('dragover'); }));
        ['dragleave','dragend','drop'].forEach(evt => drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.remove('dragover'); }));
        drop.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
        fileInputEl.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
        fileField.appendChild(drop);

        fileStatusEl = el('div', { className: 'dsx-wiz-filestatus', id: 'dsx-wiz-file-status' });
        fileField.appendChild(fileStatusEl);
        wrap.appendChild(fileField);
        refreshNameError();
        refreshFileStatus();
        return wrap;

        function handleFile(file){
          wstate.file = file;
          wstate.errors = Object.assign({}, wstate.errors, { file: '' });
          fileNameEl.textContent = file.name;
          wstate.format = /\.(jsonl|ndjson|json)$/i.test(file.name) ? 'jsonl' : 'csv';
          if (mode === 'new' && !wstate.name) {
            wstate.name = file.name.replace(/\.(csv|tsv|txt|jsonl|ndjson|json)$/i, '');
            if (nameInputEl) nameInputEl.value = wstate.name;
            refreshNameError();
          }
          readFile(file);
        }
      }

      function readFile(file){
        const seq = ++wstate.readSeq;
        const isCSV = wstate.format === 'csv';
        wstate.reading = true;
        wstate.readError = '';
        wstate.csvBytes = null; wstate.csvHeaders = []; wstate.csvRows = [];
        wstate.jsonlRows = []; wstate.jsonErrors = []; wstate.jsonTotal = 0;
        wstate.encoding = null; wstate.detectedEncoding = null; wstate.encodingError = ''; wstate.encodingSuspicious = false;
        refreshFileStatus();
        const reader = new FileReader();
        reader.onload = () => {
          if (seq !== wstate.readSeq) return;
          wstate.reading = false;
          const bytes = new Uint8Array(reader.result || new ArrayBuffer(0));
          if (isCSV) {
            wstate.csvBytes = bytes;
            wstate.detectedEncoding = detectCSVEncoding(bytes);
            applyCSVEncoding(wstate.detectedEncoding);
          } else {
            let text = '';
            try { text = decodeBytes(bytes, 'utf-8'); }
            catch (_) { wstate.readError = 'JSON and JSONL files must be UTF-8 encoded. Save the file as UTF-8 and choose it again.'; }
            if (!wstate.readError) {
              const parsed = parseJSONRecords(text, file.name);
              wstate.format = parsed.format;
              wstate.jsonlRows = parsed.rows;
              wstate.jsonErrors = parsed.errors;
              wstate.jsonTotal = parsed.total;
            }
          }
          if (wstate.step === 1) refreshFileStatus();
        };
        reader.onerror = () => {
          if (seq !== wstate.readSeq) return;
          wstate.reading = false;
          wstate.readError = 'The file could not be read. Choose it again.';
          if (wstate.step === 1) refreshFileStatus();
        };
        reader.readAsArrayBuffer(file);
      }

      function applyCSVEncoding(encoding){
        wstate.encoding = encoding;
        wstate.encodingError = '';
        wstate.encodingSuspicious = false;
        let text;
        try { text = decodeBytes(wstate.csvBytes, encoding); }
        catch (_) {
          wstate.encodingError = 'This file is not valid ' + encodingLabel(encoding) + '. Choose the encoding the file was saved with, or save it as "CSV UTF-8" and choose it again.';
          wstate.csvHeaders = []; wstate.csvRows = [];
          wstate.mapping = { input: [], expected: [], id: '', metadata: [] };
          return;
        }
        text = text.replace(/^\uFEFF/, '');
        if (LEGACY_CSV_ENCODINGS.includes(encoding)) wstate.encodingSuspicious = legacyTextScore(text.slice(0, ENCODING_SAMPLE_CHARS)) < 0;
        wstate.csvDelimiter = detectCSVDelimiter(text);
        const rows = csvParseLite(text, wstate.csvDelimiter);
        wstate.csvHeaders = rows.length ? rows[0].map(header => header.trim()) : [];
        wstate.csvRows = rows.slice(1);
        autoMap();
      }

      function refreshFileStatus(){
        if (!fileStatusEl) return;
        fileStatusEl.replaceChildren();
        const formatLabel = wstate.format ? wstate.format.toUpperCase() : '—';
        const info = el('div', { className: 'dsx-wiz-fileinfo' });
        info.appendChild(el('span', { className: 'shell-form-help', id: 'dsx-wiz-fmt' }, ['Detected format: ', el('strong', null, wstate.reading ? 'reading…' : formatLabel)]));
        if (wstate.format === 'csv' && wstate.csvBytes) {
          const select = el('select', { className: 'qym-control qym-select', id: 'dsx-wiz-encoding', 'aria-label': 'File encoding' });
          CSV_ENCODINGS.forEach(([value, label]) => {
            const option = el('option', { value }, label + (value === wstate.detectedEncoding ? ' · detected' : ''));
            if (value === wstate.encoding) option.selected = true;
            select.appendChild(option);
          });
          select.addEventListener('change', () => {
            applyCSVEncoding(select.value);
            wstate.errors = Object.assign({}, wstate.errors, { file: '' });
            refreshFileStatus();
            document.getElementById('dsx-wiz-encoding')?.focus();
          });
          info.appendChild(el('label', { className: 'dsx-wiz-encoding shell-form-help', for: 'dsx-wiz-encoding' }, 'Encoding'));
          info.appendChild(select);
        }
        fileStatusEl.appendChild(info);
        if (wstate.format === 'csv' && wstate.encoding && !wstate.encodingError) {
          if (wstate.encodingSuspicious) {
            fileStatusEl.appendChild(el('div', { className: 'dsx-wiz-alert warning', role: 'status' }, 'Some text looks garbled (words made of accented Latin letters). If the file has Arabic text, choose Windows-1256 above, or save it from Excel as "CSV UTF-8" and choose it again.'));
          } else if (LEGACY_CSV_ENCODINGS.includes(wstate.encoding)) {
            fileStatusEl.appendChild(el('div', { className: 'shell-form-help' }, 'This file is not UTF-8, so it was read as ' + encodingLabel(wstate.encoding) + '. Check the preview; saving files as "CSV UTF-8" avoids this.'));
          }
        }
        // Problems found while reading the file show right away; "choose a file" only after Continue.
        const message = wstate.file && !wstate.reading ? fileError() : (wstate.errors.file || '');
        if (fileInputEl) fileInputEl.setAttribute('aria-invalid', message ? 'true' : 'false');
        const browse = fileStatusEl.parentElement && fileStatusEl.parentElement.querySelector('.dsx-file-browse');
        if (browse) browse.setAttribute('aria-invalid', message ? 'true' : 'false');
        if (!message) return;
        const alert = el('div', { className: 'dsx-wiz-alert error', role: 'alert', id: 'dsx-wiz-file-error' });
        alert.appendChild(el('div', null, message));
        if (wstate.format !== 'csv' && wstate.jsonErrors.length && wstate.jsonErrors[0].where !== 'File') {
          const list = el('ul', { className: 'dsx-wiz-errlist' });
          wstate.jsonErrors.slice(0, 8).forEach(err => list.appendChild(el('li', null, err.where + ' ' + err.message)));
          if (wstate.jsonErrors.length > 8) list.appendChild(el('li', null, 'and ' + (wstate.jsonErrors.length - 8) + ' more'));
          alert.appendChild(list);
        }
        fileStatusEl.appendChild(alert);
      }

      function detectCSVDelimiter(text){
        const candidates = [',', ';', '\t', '|'];
        let best = { delimiter: ',', score: -1 };
        candidates.forEach(delimiter => {
          const rows = csvParseLite(text.slice(0, 65536), delimiter)
            .filter(row => row.some(cell => String(cell || '').trim()))
            .slice(0, 20);
          if (!rows.length || rows[0].length < 2) return;
          const width = rows[0].length;
          const matching = rows.filter(row => row.length === width).length;
          const score = matching * 100 - (rows.length - matching) * 100 + width;
          if (score > best.score) best = { delimiter, score };
        });
        return best.delimiter;
      }
      function csvParseLite(text, delimiter){
        // Minimal RFC-4180-ish CSV parser
        delimiter = delimiter || ',';
        const rows = []; let row = []; let cell = ''; let inQ = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (inQ) {
            if (ch === '"' && text[i+1] === '"') { cell += '"'; i++; }
            else if (ch === '"') { inQ = false; }
            else { cell += ch; }
          } else {
            if (ch === '"') { inQ = true; }
            else if (ch === delimiter) { row.push(cell); cell = ''; }
            else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
            else if (ch === '\r') { /* skip */ }
            else { cell += ch; }
          }
        }
        if (cell.length || row.length) { row.push(cell); rows.push(row); }
        return rows;
      }
      // Best-effort detection of the core fields by column name. Every other column
      // defaults to Metadata, so nothing is dropped unless the user picks Ignore.
      function autoMap(){
        const h = wstate.csvHeaders.map(s => s.toLowerCase());
        const find = (...names) => { for (const n of names) { const i = h.indexOf(n); if (i !== -1) return wstate.csvHeaders[i]; } return ''; };
        const inputCol = find('input', 'question', 'prompt', 'text');
        const expectedCol = find('expected_output', 'expected', 'answer', 'output', 'target', 'label');
        const idCol = find('id', 'item_id', 'example_id');
        wstate.mapping.input = inputCol ? [inputCol] : [];
        wstate.mapping.expected = expectedCol ? [expectedCol] : [];
        wstate.mapping.id = idCol;
        wstate.mapping.metadata = wstate.csvHeaders.filter(col => col && col !== inputCol && col !== expectedCol && col !== idCol);
      }

      function rerenderStep2(focusCol){
        body.innerHTML = '';
        body.appendChild(renderStep2());
        if (focusCol != null) {
          const select = body.querySelector('select[data-column="' + CSS.escape(focusCol) + '"]');
          if (select) select.focus();
        }
      }
      const COLUMN_ROLES = [
        ['input', 'Input'],
        ['expected', 'Expected output'],
        ['metadata', 'Metadata'],
        ['id', 'Item ID'],
        ['ignore', 'Ignore (not imported)'],
      ];
      function columnRole(col){
        if (wstate.mapping.id === col) return 'id';
        if ((wstate.mapping.input || []).includes(col)) return 'input';
        if ((wstate.mapping.expected || []).includes(col)) return 'expected';
        if ((wstate.mapping.metadata || []).includes(col)) return 'metadata';
        return 'ignore';
      }
      // Assign one column to one role, keeping file order inside each list.
      function setColumnRole(col, role){
        if (wstate.mapping.id === col) wstate.mapping.id = '';
        ['input', 'expected', 'metadata'].forEach(k => { wstate.mapping[k] = (wstate.mapping[k] || []).filter(c => c !== col); });
        if (role === 'id') {
          // One Item ID column: the previous one becomes Metadata instead of vanishing.
          const previous = wstate.mapping.id;
          if (previous && previous !== col) wstate.mapping.metadata.push(previous);
          wstate.mapping.id = col;
        } else if (role !== 'ignore') {
          wstate.mapping[role].push(col);
        }
        const order = col => wstate.csvHeaders.indexOf(col);
        ['input', 'expected', 'metadata'].forEach(k => wstate.mapping[k].sort((a, b) => order(a) - order(b)));
      }

      function renderStep2(){
        const outer = el('div', { className: 'dsx-mapping-step' });
        outer.appendChild(el('p', { className: 'shell-form-help', id: 'dsx-wiz-mapping-help' }, 'Choose what each column becomes. Columns you do not recognise default to Metadata so they are kept; choose Ignore to leave a column out. Several Input (or Expected) columns are combined into one JSON object keyed by column name.'));
        if (wstate.errors.mapping && (wstate.mapping.input || []).length) wstate.errors = {};
        if (wstate.errors.mapping) outer.appendChild(el('div', { className: 'dsx-wiz-alert error', role: 'alert', id: 'dsx-wiz-mapping-error' }, wstate.errors.mapping));
        const tableWrap = el('div', { className: 'dsx-mapping-table-wrap' });
        const table = el('table', { className: 'dsx-mapping-table', 'aria-describedby': 'dsx-wiz-mapping-help' });
        table.appendChild(el('caption', { className: 'dsx-sr-only' }, 'Column mapping'));
        table.appendChild(el('thead', null, el('tr', null, [
          el('th', { scope: 'col' }, 'Column'),
          el('th', { scope: 'col' }, 'Sample value'),
          el('th', { scope: 'col' }, 'Import as'),
        ])));
        const tbody = el('tbody');
        const sample = wstate.csvRows.find(row => row.some(cell => String(cell || '').trim())) || [];
        wstate.csvHeaders.forEach((col, index) => {
          if (!col) return;
          const role = columnRole(col);
          const selectId = 'dsx-wiz-map-' + index;
          const tr = el('tr', { className: role === 'ignore' ? 'ignored' : '' });
          tr.appendChild(el('th', { scope: 'row' }, el('label', { for: selectId, className: 'dsx-mapping-col' }, col)));
          const value = sample[index] == null ? '' : String(sample[index]);
          tr.appendChild(el('td', { className: 'dsx-mapping-sample', title: value }, value ? value.slice(0, 160) : '—'));
          const select = el('select', {
            className: 'qym-control qym-select',
            id: selectId,
            dataset: { column: col },
          });
          COLUMN_ROLES.forEach(([value, label]) => {
            const option = el('option', { value }, label);
            if (value === role) option.selected = true;
            select.appendChild(option);
          });
          select.addEventListener('change', () => { setColumnRole(col, select.value); rerenderStep2(col); });
          tr.appendChild(el('td', null, select));
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        tableWrap.appendChild(table);
        outer.appendChild(tableWrap);

        const summary = el('div', { className: 'dsx-mapping-summary', 'aria-live': 'polite' });
        const input = wstate.mapping.input || [], expected = wstate.mapping.expected || [];
        const ignored = wstate.csvHeaders.filter(col => col && columnRole(col) === 'ignore');
        const parts = [
          'Input: ' + (input.length ? (input.length > 1 ? '{ ' + input.join(', ') + ' }' : input[0]) : 'none yet'),
          'Expected: ' + (expected.length ? (expected.length > 1 ? '{ ' + expected.join(', ') + ' }' : expected[0]) : 'none'),
          'Item ID: ' + (wstate.mapping.id || 'generated'),
          pluralize((wstate.mapping.metadata || []).length, 'metadata column'),
        ];
        if (ignored.length) parts.push('ignored: ' + ignored.join(', '));
        summary.textContent = parts.join(' · ');
        outer.appendChild(summary);

        const remap = el('button', { className: 'shell-btn shell-btn-secondary', type: 'button', title: 'Guess Input / Expected / Item ID from the column names; every other column becomes Metadata', onclick: () => { autoMap(); rerenderStep2(); }, style: { alignSelf: 'flex-start' } }, 'Auto-detect columns');
        outer.appendChild(remap);
        return outer;
      }

      function renderStep3(){
        const wrap = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '14px' } });
        if (mode === 'new' || mode === 'new-version') {
          const verField = el('div', { className: 'shell-form-field' });
          verField.appendChild(el('label', { className: 'shell-form-label', for: 'dsx-wiz-version-name' }, 'Version name'));
          const verIn = el('input', { className: 'shell-form-input', id: 'dsx-wiz-version-name', value: wstate.versionName, placeholder: 'Optional — e.g. initial import' });
          verIn.addEventListener('input', e => { wstate.versionName = e.target.value; });
          verField.appendChild(verIn);
          if (mode === 'new') {
            const slug = slugifyDatasetName(wstate.name);
            verField.appendChild(el('div', { className: 'shell-form-help' }, [
              'Creates a new dataset "' + wstate.name.trim() + '" (slug ',
              el('code', { className: 'dsx-wiz-slug' }, slug || 'generated automatically'),
              ') with this file as version v1.',
            ]));
          } else {
            const target = wstate.target || {};
            verField.appendChild(el('div', { className: 'shell-form-help' }, 'Adds this file to "' + target.name + '" as version ' + (target.nextVersion || 'vN') + '. Version numbers are assigned automatically; earlier versions are not changed.'));
          }
          wrap.appendChild(verField);

          const opts = el('div', { style: { display: 'flex', gap: '14px', flexWrap: 'wrap' } });
          opts.appendChild(checkbox('Publish immediately', wstate.publish, v => {
            wstate.publish = v;
            if (!v) wstate.setAlias = false;
            body.replaceChildren(renderStep3());
          }));
          const targetPerms = (wstate.target && wstate.target.permissions) || {};
          const prodBlocked = mode === 'new-version' && targetPerms.can_set_production === false;
          if (prodBlocked) wstate.setAlias = false;
          opts.appendChild(checkbox('Set as production alias', wstate.publish && wstate.setAlias, v => { wstate.setAlias = v; }, !wstate.publish || prodBlocked, prodBlocked ? PRODUCTION_RULE : null));
          wrap.appendChild(opts);
          if (mode === 'new-version' && wstate.publish && wstate.setAlias) {
            wrap.appendChild(el('div', { className: 'dsx-wiz-alert warning', role: 'status' }, 'Runs that use the "production" alias of "' + (wstate.target && wstate.target.name) + '" will evaluate this file from now on.'));
          }
        }

        if (wstate.errors.submit) {
          wrap.appendChild(el('div', { className: 'dsx-wiz-alert error', role: 'alert', id: 'dsx-wiz-submit-error' }, wstate.errors.submit));
        }

        const rows = wstate.format === 'csv' ? wstate.csvRows : wstate.jsonlRows;
        const rowCount = rows.length;
        const previewRows = rows.slice(0, 10);
        const summaryParts = [
          wstate.format ? wstate.format.toUpperCase() : '—',
        ];
        if (wstate.format === 'csv' && wstate.encoding) summaryParts.push(encodingLabel(wstate.encoding));
        summaryParts.push(rowCount + ' row' + (rowCount === 1 ? '' : 's'));
        summaryParts.push('preview shows first ' + previewRows.length + ' row' + (previewRows.length === 1 ? '' : 's'));
        wrap.appendChild(el('div', { className: 'shell-form-help' }, [
          el('strong', null, wstate.file ? wstate.file.name : '—'),
          ' · ' + summaryParts.join(' · '),
        ]));

        // Say exactly what will not be imported, instead of dropping it silently.
        if (wstate.format === 'csv') {
          const used = new Set([wstate.mapping.id, ...(wstate.mapping.input || []), ...(wstate.mapping.expected || []), ...(wstate.mapping.metadata || [])].filter(Boolean));
          const ignored = wstate.csvHeaders.filter(col => col && !used.has(col));
          if (ignored.length) {
            wrap.appendChild(el('div', { className: 'dsx-wiz-alert warning', role: 'status', id: 'dsx-wiz-ignored' }, 'Not imported: ' + pluralize(ignored.length, 'column') + ' (' + ignored.join(', ') + '), set to Ignore. Go back to Map columns and choose Metadata to keep them.'));
          }
        } else {
          const extra = new Set();
          wstate.jsonlRows.forEach(r => Object.keys(r || {}).forEach(k => { if (!JSON_ITEM_KEYS.includes(k)) extra.add(k); }));
          if (extra.size) {
            wrap.appendChild(el('div', { className: 'dsx-wiz-alert warning', role: 'status', id: 'dsx-wiz-ignored' }, 'Not imported: ' + pluralize(extra.size, 'key') + ' (' + Array.from(extra).join(', ') + '). Only item_id (or id), input, expected_output (or expected), metadata, and labels are read; move other fields into metadata to keep them.'));
          }
        }

        // Preview
        const previewWrap = el('div', { className: 'dsx-preview-table' });
        const tbl = el('table');
        const thead = el('thead'); const trh = el('tr');
        let headers = [];
        if (wstate.format === 'csv') headers = wstate.csvHeaders;
        else if (wstate.jsonlRows.length) {
          const seen = new Set(); wstate.jsonlRows.slice(0, 10).forEach(r => Object.keys(r || {}).forEach(k => seen.add(k)));
          headers = Array.from(seen);
        }
        headers.slice(0, 6).forEach(h => trh.appendChild(el('th', null, h)));
        thead.appendChild(trh); tbl.appendChild(thead);
        const tbody = el('tbody');
        previewRows.forEach(r => {
          const tr = el('tr');
          headers.slice(0, 6).forEach(h => {
            let v;
            if (wstate.format === 'csv') { const idx = wstate.csvHeaders.indexOf(h); v = idx >= 0 ? r[idx] : ''; }
            else { v = r[h]; if (v != null && typeof v === 'object') v = JSON.stringify(v); }
            tr.appendChild(QymSafe.applyTextDir(el('td', null, v == null ? '' : String(v).slice(0, 120)), v == null ? '' : String(v)));
          });
          tbody.appendChild(tr);
        });
        tbl.appendChild(tbody);
        previewWrap.appendChild(tbl);
        wrap.appendChild(previewWrap);
        return wrap;
      }

      function checkbox(label, checked, onChange, disabled, disabledReason){
        const wrap = el('label', { style: { display: 'inline-flex', alignItems: 'center', gap: '6px', cursor: disabled ? 'default' : 'pointer', fontSize: 'var(--font-md)', color: disabled ? 'var(--text-muted)' : 'var(--text-secondary)' }, title: disabled ? (disabledReason || 'Publish the version to set an alias') : null });
        const cb = el('input', { type: 'checkbox' });
        cb.checked = !!checked;
        cb.disabled = !!disabled;
        cb.addEventListener('change', () => onChange(cb.checked));
        wrap.appendChild(cb);
        wrap.appendChild(document.createTextNode(label));
        return wrap;
      }

      function appendCSVMapping(fd){
        if (wstate.encoding) fd.append('encoding', wstate.encoding);
        if (wstate.mapping.input && wstate.mapping.input.length) fd.append('input_cols', wstate.mapping.input.join(','));
        if (wstate.mapping.expected && wstate.mapping.expected.length) fd.append('expected_cols', wstate.mapping.expected.join(','));
        if (wstate.mapping.id) fd.append('id_col', wstate.mapping.id);
        if (wstate.mapping.metadata && wstate.mapping.metadata.length) fd.append('metadata_cols', wstate.mapping.metadata.join(','));
      }

      async function submit(){
        wstate.errors = {};
        nextBtn.disabled = true; nextBtn.innerHTML = '<span class="dsx-spinner"></span> Working...';
        try {
          if (mode === 'new' || mode === 'new-version') {
            const fd = new FormData();
            fd.append('project_slug', state.slug);
            if (mode === 'new') {
              fd.append('name', wstate.name.trim());
              // Never append to an existing dataset from "Create dataset": the API answers 409.
              fd.append('create_only', 'true');
              if (wstate.description) fd.append('description', wstate.description);
            } else {
              fd.append('name', wstate.target.name);
              fd.append('dataset_ref', wstate.target.id);
            }
            if (wstate.versionName) fd.append('version_name', wstate.versionName);
            if (wstate.publish) fd.append('publish', 'true');
            if (wstate.publish && wstate.setAlias) fd.append('set_alias', 'production');
            fd.append('format', wstate.format);
            if (wstate.format === 'csv') appendCSVMapping(fd);
            fd.append('file', wstate.file);
            const created = await apiFetch('/v1/datasets:upload', { method: 'POST', body: fd });
            const totalItems = (created.version && created.version.item_count) || '?';
            close();
            if (mode === 'new') {
              Shell.toast('Dataset "' + (created.dataset.name) + '" created · ' + pluralize(totalItems, 'item'), 'success');
              navigate({ mode: 'detail', ref: created.dataset.slug, tab: 'items', v: null, item: null });
            } else {
              Shell.toast('Version ' + created.version.version + ' of "' + created.dataset.name + '" created · ' + pluralize(totalItems, 'item'), 'success');
              navigate({ mode: 'detail', ref: created.dataset.slug, tab: 'items', v: created.version.version, item: null }, { forceReload: true });
            }
          } else {
            // Add items to existing draft: build bulk upserts
            const upserts = [];
            if (wstate.format === 'csv') {
              wstate.csvRows.forEach(r => {
                const get = (col) => { const i = wstate.csvHeaders.indexOf(col); return i >= 0 ? r[i] : null; };
                // One column → raw value; multiple columns → JSON object keyed by column name.
                const combine = (cols) => {
                  if (!cols || !cols.length) return undefined;
                  if (cols.length === 1) return get(cols[0]);
                  const o = {}; cols.forEach(c => { o[c] = get(c); }); return o;
                };
                const entry = {};
                if (wstate.mapping.id && get(wstate.mapping.id)) entry.item_id = get(wstate.mapping.id);
                entry.input = combine(wstate.mapping.input) ?? null;
                if (wstate.mapping.expected && wstate.mapping.expected.length) entry.expected_output = combine(wstate.mapping.expected);
                if (wstate.mapping.metadata && wstate.mapping.metadata.length) {
                  const meta = {}; wstate.mapping.metadata.forEach(c => { meta[c] = get(c); });
                  entry.metadata = meta;
                }
                upserts.push(entry);
              });
            } else {
              // Same keys and aliases as the server's JSON/JSONL parser.
              wstate.jsonlRows.forEach(r => {
                const entry = {};
                const id = String(r.item_id || r.id || '').trim();
                if (id) entry.item_id = id;
                entry.input = r.input;
                if (r.expected_output !== undefined) entry.expected_output = r.expected_output;
                else if (r.expected !== undefined) entry.expected_output = r.expected;
                if (r.metadata) entry.metadata = r.metadata;
                const labels = importLabels(r.labels);
                if (labels.length) entry.labels = labels;
                upserts.push(entry);
              });
            }
            const ref = wstate.draftRef;
            const ver = wstate.draftVersion || state.versionLabel;
            const resp = await apiFetch('/v1/datasets/' + encodeURIComponent(ref) + '/versions/' + encodeURIComponent(ver) + '/items:bulk?project_slug=' + encodeURIComponent(state.slug), { method: 'POST', body: { upserts: upserts } });
            Shell.toast(pluralize(resp.summary.created + resp.summary.updated, 'item') + ' added', 'success');
            close();
            refreshDetailView({ force: true });
          }
        } catch(e) {
          wstate.errors = { submit: e.message || 'Upload failed' };
          Shell.toast(wstate.errors.submit, 'error');
          nextBtn.disabled = false; nextBtn.textContent = wstate.step === 3 ? submitLabel() : 'Continue →';
          if (wstate.step === 3) {
            body.replaceChildren(renderStep3());
            document.getElementById('dsx-wiz-submit-error')?.scrollIntoView?.({ block: 'nearest' });
          }
        }
      }

      render();
      backdrop.addEventListener('click', e => { if (e.target === backdrop) requestClose(); });
      document.addEventListener('keydown', onWizardKey, true);
      // Registered with the shared modal focus contract too (C049), so a
      // dialog opened over it (the discard confirm) stacks correctly.
      if (window.QymUIComponents) window.QymUIComponents.openDialog(modal, {
        onEscape: requestClose,
        initialFocus: () => body.querySelector('[data-autofocus]') || focusables().find(node => body.contains(node)) || nextBtn,
      });
    }

    // DETAIL VIEW

      root.appendChild(buildHero());
      root.appendChild(buildTabs());
      const tabContent = el('div', {
        id: 'dsx-tab-content',

    }

    function fillHeroMeta(meta){
      meta.innerHTML = '';
      meta.appendChild(el('span', null, pluralize((state.versions || []).length, 'version')));
      meta.appendChild(el('span', { className: 'dot' }));
      meta.appendChild(el('span', null, pluralize(state.dataset.run_count || 0, 'run')));

      // Lineage, in context: where the active version came from. The full tree lives on the Lineage tab.
      const av = state.activeVersion;
      if (av) {
        meta.appendChild(el('span', { className: 'dot' }));
        meta.appendChild(el('span', null, pluralize(av.item_count || 0, 'item')));
        const parent = av.parent_version_id && (state.versions || []).find(x => x.id === av.parent_version_id);
        if (parent) {
          meta.appendChild(el('span', { className: 'dot' }));
          const link = el('a', { href: buildUrl({ tab: 'lineage' }), style: { color: 'var(--accent-secondary)', textDecoration: 'none' }, title: 'View lineage', onclick: e => {
            if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
            e.preventDefault();
            navigate({ tab: 'lineage' });
          } }, 'forked from ' + parent.version);

        }

          meta.appendChild(el('span', { className: 'dot' }));
          meta.appendChild(el('span', null, 'source: ' + av.source_type));
        }

        if (publisherPill) {
          meta.appendChild(el('span', { className: 'dot' }));
          meta.appendChild(publisherPill);
        }

        if (creatorPill) {
          meta.appendChild(el('span', { className: 'dot' }));
          meta.appendChild(creatorPill);
        }
      }
      if (state.dataset.updated_at) {
        meta.appendChild(el('span', { className: 'dot' }));
        meta.appendChild(el('span', null, 'updated ' + relTime(state.dataset.updated_at)));
      }
    }

    function versionIsDraft(v){ return v && v.status === 'draft'; }
    function getProductionVersion(){
      const versions = state.versions || [];
      const byAlias = versions.find(v => (v.aliases || []).includes('production'));
      if (byAlias) return byAlias;
      const prod = state.dataset && state.dataset.production_version;
      if (!prod) return null;
      return versions.find(v => v.id === prod.id || v.version === prod.version) || prod;
    }
    function versionIsProduction(v){
      if (!v) return false;
      if ((v.aliases || []).includes('production')) return true;
      const prod = getProductionVersion();
      return !!prod && (v.id === prod.id || v.version === prod.version);
    }
    function versionStateLabel(v){
      if (!v) return 'No versions';
      if (versionIsDraft(v)) return 'Draft';
      return versionIsProduction(v) ? 'Production' : 'Published';
    }
    function versionStatePillClass(v){
      if (versionIsDraft(v)) return 'warning';
      if (versionIsProduction(v)) return 'success';
      return 'published';
    }
    function sortedVersionsDesc(versions){
      return (versions || []).slice().sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
    }

    function fillHeroActions(right){
      right.innerHTML = '';
      right.appendChild(versionSelectorPill());
      const v = state.activeVersion;
      if (projectReadOnly()) {
        if (v) right.appendChild(overflowMenuButton());
        return;
      }
      if (!v) {
        // No versions yet: the only meaningful action is creating the first draft.
        right.appendChild(el('button', { className: 'shell-btn shell-btn-primary', onclick: () => createDraftFromVersionFlow() }, '+ Create first draft'));
        return;
      }
      const isDraft = versionIsDraft(v);
      const isProd = versionIsProduction(v);

      if (isDraft) {
        right.appendChild(el('button', { className: 'shell-btn shell-btn-secondary', onclick: () => openNewItemFlow() }, '+ Add item'));
        right.appendChild(el('button', { className: 'shell-btn shell-btn-secondary', onclick: () => openUploadWizard({ mode: 'add-to-draft', ref: state.datasetRef, versionLabel: v.version }) }, 'Import'));
        right.appendChild(el('button', { className: 'shell-btn shell-btn-primary', onclick: publishCurrentVersion }, 'Publish'));
      } else if (v.status === 'published' && !isProd) {
        const allowed = canSetProduction();
        right.appendChild(el('button', {
          className: 'shell-btn shell-btn-primary',
          type: 'button',
          'aria-disabled': allowed ? null : 'true',
          title: allowed ? null : PRODUCTION_RULE,
          onclick: () => { if (allowed) setAsProductionFlow(); else Shell.toast(PRODUCTION_RULE, 'info'); },
        }, 'Set as production'));
        right.appendChild(el('button', { className: 'shell-btn shell-btn-secondary', onclick: () => createDraftFromVersionFlow(v.version) }, '+ Create draft'));
      } else {
        right.appendChild(el('button', { className: 'shell-btn shell-btn-primary', onclick: () => createDraftFromVersionFlow(v.version) }, '+ Create draft'));
      }
      right.appendChild(overflowMenuButton());
    }

    function overflowMenuButton(){
      const btn = el('button', { className: 'actions-trigger', type: 'button', title: 'More actions', 'aria-label': 'More actions', html: ICON_DOTS });
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const v = state.activeVersion;
        const menu = [];
        const readOnly = projectReadOnly();
        if (v) {
          if (!readOnly) menu.push({ label: 'Name version…', onClick: nameVersionFlow });
          menu.push({ label: 'Compare…', onClick: openCompareFlow });
          menu.push({ label: '↓ Download JSONL', onClick: () => window.open(apiUrl('/v1/datasets/' + encodeURIComponent(state.datasetRef) + '/versions/' + encodeURIComponent(v.version) + ':download?project_slug=' + encodeURIComponent(state.slug)), '_blank', 'noopener') });
        }
        if (!readOnly) menu.push({ label: '↑ Upload file as new version…', onClick: openNewVersionUpload });
        openContextMenu(btn, menu);
      });
      return btn;
    }

    // Explicit "new version from a file" for this dataset (the catalog's "Create dataset"
    // never appends to an existing dataset).
    function openNewVersionUpload(){
      if (!state.dataset) return;
      openUploadWizard({
        mode: 'new-version',
        target: { id: state.dataset.id, name: state.dataset.name, slug: state.dataset.slug, nextVersion: suggestNextVersion(), permissions: datasetPerms() },
      });
    }

    function refreshDetailChrome(opts){
      opts = opts || {};
      if (!opts.tabOnly) {
        const meta = document.getElementById('dsx-hero-meta');
        if (meta && state.dataset) fillHeroMeta(meta);
        const actions = document.getElementById('dsx-hero-actions');
        if (actions) fillHeroActions(actions);
        const tabs = document.getElementById('dsx-detail-tabs');
        if (tabs) {
          const nextTabs = buildTabs();
          tabs.replaceWith(nextTabs);
        }
      }
      updateActiveTabs();
    }

    function updateActiveTabs(){
      let activeTab = null;
      document.querySelectorAll('#dsx-detail-tabs .dsx-tab').forEach(btn => {
        const isActive = btn.dataset.tabKey === state.tab;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        if (isActive) activeTab = btn;
      });
      if (activeTab) {
        requestAnimationFrame(() => activeTab.scrollIntoView({ block: 'nearest', inline: 'nearest' }));
      }
      const panel = document.getElementById('dsx-tab-content');
      if (panel) panel.setAttribute('aria-labelledby', 'dsx-detail-tab-' + state.tab);
    }

    function buildHero(){
      const hero = el('div', { className: 'dsx-hero' });
      const top = el('div', { className: 'dsx-hero-top' });
      const idCol = el('div', { className: 'dsx-hero-id' });
      const titleRow = el('div', { className: 'dsx-hero-title-row' });

      titleRow.appendChild(Shell.identicon(state.dataset.slug || state.datasetRef, { cell: 4, gap: 2 }));
      const nameEl = el('h1', { className: 'dsx-hero-name' });
      nameEl.appendChild(document.createTextNode(state.dataset.name));
      if (!projectReadOnly()) nameEl.appendChild(el('span', { className: 'dsx-name-edit', title: 'Rename', onclick: renameDatasetFlow }, '✎'));
      titleRow.appendChild(nameEl);
      idCol.appendChild(titleRow);

      if (state.dataset.description && projectReadOnly()) {
        const descEl = el('p', { className: 'dsx-hero-desc' });
        descEl.textContent = state.dataset.description;
        idCol.appendChild(descEl);
      } else if (state.dataset.description) {
        const descEl = el('p', { className: 'dsx-hero-desc', title: 'Click to edit description', style: { cursor: 'pointer' } });
        descEl.textContent = state.dataset.description;
        descEl.addEventListener('click', editDescriptionFlow);
        idCol.appendChild(descEl);
      } else if (!projectReadOnly()) {
        // No description: a compact, obviously-clickable affordance instead of a big italic placeholder.
        const addDesc = el('button', { className: 'dsx-hero-add-desc', type: 'button', title: 'Add a description', onclick: editDescriptionFlow }, '+ Add a description');
        idCol.appendChild(addDesc);

      // Right: version selector plus state-driven actions. Drafts expose editing and
