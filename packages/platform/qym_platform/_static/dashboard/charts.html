<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قيِّم • Charts</title>
  <link rel="icon" type="image/png" href="/static/qym_icon.png">
  <link rel="stylesheet" href="/static/dashboard.css?v=runs-analysis-c1-20260804-16">
  <link rel="stylesheet" href="/static/shell.css">
  <script src="/static/auth.js"></script>
  <script src="/static/shell.js?v=ui-consistency-20260730-15"></script>
  <link rel="stylesheet" href="/static/ui_components.css?v=ui-consistency-20260803-60">
  <script defer src="/static/ui_components.js?v=ui-consistency-20260803-28"></script>
</head>
<body>
  <!-- Command Bar -->
  <div class="command-bar">
    <div class="display-tools" id="display-tools">
      <span class="display-tools-label">Display</span>
      <div class="multi-select-wrapper" id="metric-visibility-wrapper">
        <button class="multi-select-btn" id="metric-visibility-btn">Columns</button>
        <div class="multi-select-dropdown" id="metric-visibility-dropdown"></div>
      </div>
    </div>
    <div class="quick-filters qym-segmented" role="group" aria-label="Time range">
      <button class="filter-btn qym-segmented__option active" data-filter="all" aria-pressed="true">All</button>
      <button class="filter-btn qym-segmented__option" data-filter="today" aria-pressed="false">Today</button>
      <button class="filter-btn qym-segmented__option" data-filter="week" aria-pressed="false">7d</button>
    </div>
    <div class="command-bar-filter-row">
      <div class="filter-dropdowns">
        <div class="multi-select-wrapper" id="task-filter-wrapper">
          <button class="multi-select-btn" id="filter-task-btn">All Tasks</button>
          <div class="multi-select-dropdown" id="filter-task-dropdown"></div>
        </div>
        <div class="multi-select-wrapper" id="dataset-filter-wrapper">
          <button class="multi-select-btn" id="filter-dataset-btn">All Datasets</button>
          <div class="multi-select-dropdown" id="filter-dataset-dropdown"></div>
        </div>
        <div class="multi-select-wrapper" id="model-filter-wrapper">
          <button class="multi-select-btn" id="filter-model-btn">All Models</button>
          <div class="multi-select-dropdown" id="filter-model-dropdown"></div>
        </div>
        <div class="multi-select-wrapper" id="version-filter-wrapper">
          <button class="multi-select-btn" id="filter-version-btn">All Versions</button>
          <div class="multi-select-dropdown" id="filter-version-dropdown"></div>
        </div>
        <div class="multi-select-wrapper" id="status-filter-wrapper">
          <button class="multi-select-btn" id="filter-status-btn">All Status</button>
          <div class="multi-select-dropdown" id="filter-status-dropdown"></div>
        </div>
        <div class="multi-select-wrapper" id="user-filter-wrapper">
          <button class="multi-select-btn" id="filter-user-btn">All Users</button>
          <div class="multi-select-dropdown" id="filter-user-dropdown"></div>
        </div>
        <button class="clear-filters-btn" id="clear-all-filters" aria-hidden="true" title="Clear all active filters"><svg class="clear-filters-x" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M3 3l6 6M9 3 3 9"/></svg><span class="clear-filters-label">Clear</span><span class="filter-count-badge" id="active-filter-count">0</span></button>
      </div>
    </div>
  </div>

  <main class="dashboard-page-main">
    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <span>Loading charts...</span>
    </div>
    <div id="empty" class="empty" style="display:none;">
      <div class="empty-state">
        <div class="empty-icon">∅</div>
        <h2>No evaluation runs found</h2>
        <p>Run an evaluation to populate the charts.</p>
      </div>
    </div>
    <div id="charts-view" class="charts-container" style="display:none;">
      <div class="charts-header">
        <div class="charts-title-row">
          <h2>Metrics by Task & Dataset</h2>
          <span class="charts-subtitle">Showing average metric scores across all items in matching runs</span>
        </div>
        <div class="charts-legend" id="charts-legend"></div>
      </div>
      <div class="charts-grid" id="charts-grid"></div>
    </div>
  </main>

  <footer class="status-bar">
    <div class="status-left">
      <span id="status-filter">0 runs</span>
    </div>
    <div class="status-right">
      <span>Last Updated: <span id="last-updated" style="font-family:var(--font-mono)">—</span></span>
    </div>
  </footer>

  <script>window.__QYM_INITIAL_VIEW__ = 'charts';</script>
  <script src="/static/metrics.js?v=metric-errors-20260907-3"></script>
  <script src="/static/dashboard.js?v=repeat-compare-pass-selection-20260818-39"></script>
</body>
</html>
