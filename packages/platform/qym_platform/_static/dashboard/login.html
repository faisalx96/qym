<html lang="en">
<head>

  <title>Sign in</title>

  <link rel="stylesheet" href="__QYM_PREFIX__/static/dashboard.css?v=p0-integration-20260929">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      background: var(--bg-void);
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 30%, rgba(0, 212, 170, 0.10), transparent),
        radial-gradient(ellipse 50% 60% at 30% 70%, rgba(0, 168, 255, 0.08), transparent),
        radial-gradient(ellipse 40% 40% at 75% 60%, rgba(168, 85, 247, 0.05), transparent);
      pointer-events: none;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 60% 60% at center, black 10%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse 60% 60% at center, black 10%, transparent 70%);
      animation: grid-drift 25s linear infinite;
      pointer-events: none;
    }

    @keyframes grid-drift {
      from { transform: translate(0, 0); }
      to { transform: translate(60px, 60px); }
    }

    .login-card {
      position: relative;
      width: min(440px, 100%);
      background: rgba(20, 20, 30, 0.92);
      border: 1px solid var(--border-default);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 212, 170, 0.5), rgba(0, 168, 255, 0.3), transparent);
    }

    .login-brand {
      padding: 32px 32px 24px;
      text-align: center;
      border-bottom: 1px solid var(--border-subtle);
      background: radial-gradient(circle at 50% 0%, rgba(0, 212, 170, 0.06), transparent 70%);
    }

    .login-logo {
      height: 64px;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 30px rgba(0, 212, 170, 0.25));
      animation: fade-in 0.6s ease-out both;
    }

    .login-wordmark {
      height: 36px;
      filter: drop-shadow(0 0 16px rgba(0, 212, 170, 0.12));
      animation: fade-in 0.6s ease-out 0.1s both;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-body {
      padding: 24px 32px 32px;
    }

    .login-heading {
      font-size: var(--font-xl);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: var(--font-base);
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .auth-panel {
      display: grid;
      gap: 16px;
      animation: fade-in 0.3s ease-out both;
    }

    .auth-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--bg-elevated);
    }

    .auth-switch-copy {
      min-width: 0;
    }

    .auth-switch-label {
      display: none;
    }

    .auth-switch-title {
      font-size: var(--font-base);
      color: var(--text-secondary);
      font-weight: 500;
      line-height: 1.3;
    }

    .auth-switch-btn {
      border: 1px solid var(--border-default);
      background: var(--bg-surface);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: var(--font-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .auth-switch-btn:hover,
    .auth-switch-btn:focus-visible {
      outline: none;
      border-color: var(--accent-primary);
      color: var(--accent-primary);
      background: var(--bg-elevated);
    }

    .auth-form {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .field-input {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-default);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: var(--font-md);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .field-input::placeholder {
      color: var(--text-dim);
    }

    .field-input:hover {
      background: var(--bg-elevated);
    }

    .field-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.12);
      background: var(--bg-elevated);
    }

    .field-help {
      font-size: var(--font-sm);
      color: var(--text-muted);
      line-height: 1.45;
    }

    .auth-submit {
      width: 100%;
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--accent-primary);
      color: var(--bg-base);
      font-family: var(--font-sans);
      font-size: var(--font-md);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 8px 20px rgba(0, 212, 170, 0.15);
    }

    .auth-submit:hover,
    .auth-submit:focus-visible {
      outline: none;
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(0, 212, 170, 0.22);
    }

    .auth-submit[disabled] {
      opacity: 0.65;
      cursor: progress;
      transform: none;
      box-shadow: none;
    }

    .auth-status {
      min-height: 20px;
      font-size: var(--font-base);
      line-height: 1.4;
      color: var(--text-muted);
    }

    .auth-status.error {
      color: var(--error);
    }

    .auth-status.success {
      color: var(--accent-primary);
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
      font-size: var(--font-sm);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, var(--border-default), transparent);
    }

    .providers {
      display: grid;
      gap: 12px;
    }

    .provider-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-default);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: var(--font-md);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      animation: slide-up 0.35s ease-out both;
    }

    .provider-btn:nth-child(1) { animation-delay: 0.12s; }
    .provider-btn:nth-child(2) { animation-delay: 0.18s; }
    .provider-btn:nth-child(3) { animation-delay: 0.24s; }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .provider-btn:hover,
    .provider-btn:focus-visible {
      outline: none;
      border-color: var(--accent-primary);
      background: var(--bg-elevated);
      box-shadow: 0 4px 20px rgba(0, 212, 170, 0.12), 0 0 0 1px rgba(0, 212, 170, 0.15);
    }

    .provider-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.03);
    }

    .provider-icon svg { width: 18px; height: 18px; display: block; }
    .provider-google .provider-icon { background: #fff; border-color: rgba(255, 255, 255, 0.2); }
    .provider-github .provider-icon { background: rgba(255, 255, 255, 0.06); }
    .provider-gitlab .provider-icon { background: rgba(252, 109, 38, 0.10); }
    .provider-sso .provider-icon { background: linear-gradient(135deg, rgba(0, 168, 255, 0.12), rgba(168, 85, 247, 0.12)); }

    .provider-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .provider-label {
      font-size: var(--font-md);
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .provider-desc {
      font-size: var(--font-sm);
      color: var(--text-muted);
      line-height: 1.35;
    }

    .provider-arrow {
      color: var(--text-dim);
      flex-shrink: 0;
      transition: transform 0.18s ease, color 0.18s ease;
    }

    .provider-btn:hover .provider-arrow {
      color: var(--accent-primary);
      transform: translateX(2px);
    }

    .provider-arrow svg { width: 14px; height: 14px; }

    .provider-empty {
      padding: 20px;
      border-radius: 8px;
      border: 1px dashed var(--border-default);
      background: rgba(16, 16, 24, 0.5);
      color: var(--text-muted);
      font-size: var(--font-base);
      text-align: center;
      line-height: 1.6;
    }

    .providers-loading {
      display: grid;
      gap: 10px;
    }

    .shimmer {
      height: 52px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--bg-surface) 25%, var(--bg-elevated) 50%, var(--bg-surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .login-brand { padding: 24px 20px 20px; }
      .login-logo { height: 48px; }
      .login-wordmark { height: 26px; }
      .login-body { padding: 20px 20px 24px; }
      .login-heading { font-size: var(--font-lg); }
      .auth-switch {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .auth-switch-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>

<body>

  <div class="login-card">
    <div class="login-brand">
      <img src="__QYM_PREFIX__/static/qym_icon.png" alt="" class="login-logo">
      <br>
      <img src="__QYM_PREFIX__/static/qym_text.png" alt="" class="login-wordmark">
    </div>

    <div class="login-body">
      <div class="login-heading">Sign in</div>
      <div class="login-sub">Sign in to your workspace to continue.</div>
      <div id="auth-root">
        <div class="providers-loading">
          <div class="shimmer"></div>

        </div>
      </div>

  </div>

  <script>
    window.__QYM_LOGIN_BOOTSTRAP__ = __QYM_LOGIN_BOOTSTRAP_JSON__;
    window.__QYM_ROOT_PATH__ = __QYM_ROOT_PATH_JSON__;
  </script>
  <script>
    (function () {
      var QYM_PREFIX = (window.__QYM_ROOT_PATH__ || '').replace(/\/$/, '');
      function withPrefix(p) {
        if (!p) return QYM_PREFIX + '/';
        if (p.charAt(0) === '/' && p.charAt(1) !== '/') return QYM_PREFIX + p;
        return p;
      }
      var params = new URLSearchParams(window.location.search);
      var next = params.get('next') || (QYM_PREFIX + '/');
      var root = document.getElementById('auth-root');
      var state = {
        mode: 'signin',
        pending: null,
        loading: false,
        localEnabled: false,
        signupEnabled: false,
        providers: [],
        message: '',
        messageType: ''
      };

      var icons = {
        arrow: '<svg viewBox="0 0 20 20" fill="none"><path d="M7 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        google: '<svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.96h5.5c-.24 1.28-.98 2.37-2.08 3.1l3.36 2.61c1.96-1.81 3.09-4.47 3.09-7.63 0-.73-.06-1.43-.19-2.11H12z"/><path fill="#4285F4" d="M12 22c2.79 0 5.13-.92 6.84-2.5l-3.36-2.61c-.93.63-2.11 1-3.48 1-2.68 0-4.95-1.81-5.76-4.24H2.77v2.66A9.99 9.99 0 0012 22z"/><path fill="#FBBC05" d="M6.24 13.65A5.99 5.99 0 015.92 12c0-.57.08-1.12.22-1.65V7.69H2.77A9.99 9.99 0 002 12c0 1.61.39 3.13 1.08 4.46l3.16-2.81z"/><path fill="#34A853" d="M12 6.11c1.52 0 2.89.52 3.97 1.54l2.98-2.98C17.12 2.98 14.79 2 12 2A9.99 9.99 0 002.77 7.69l3.37 2.66C7.05 7.92 9.32 6.11 12 6.11z"/></svg>',
        github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.72.5 12.15c0 5.15 3.3 9.52 7.89 11.06.58.11.79-.26.79-.58v-2.24c-3.21.71-3.89-1.39-3.89-1.39-.52-1.36-1.28-1.72-1.28-1.72-1.04-.73.08-.72.08-.72 1.15.08 1.75 1.2 1.75 1.2 1.02 1.79 2.69 1.28 3.35.98.1-.76.4-1.28.72-1.58-2.56-.3-5.26-1.31-5.26-5.85 0-1.29.46-2.34 1.2-3.17-.12-.3-.52-1.52.12-3.17 0 0 .98-.32 3.22 1.21a10.93 10.93 0 015.86 0c2.24-1.53 3.22-1.21 3.22-1.21.64 1.65.24 2.87.12 3.17.75.83 1.2 1.88 1.2 3.17 0 4.55-2.7 5.55-5.28 5.84.41.36.78 1.07.78 2.16v3.21c0 .32.21.69.8.58 4.58-1.54 7.88-5.91 7.88-11.06C23.5 5.72 18.35.5 12 .5z"/></svg>',
        gitlab: '<svg viewBox="0 0 24 24"><path fill="#FC6D26" d="m23.6 9.59-.03-.09L20.3.98a.85.85 0 0 0-.34-.4.87.87 0 0 0-1 .05.87.87 0 0 0-.29.44l-2.2 6.75H7.54L5.33 1.07a.86.86 0 0 0-.29-.44.87.87 0 0 0-1-.05.86.86 0 0 0-.34.4L.43 9.5l-.03.09a6.07 6.07 0 0 0 2.01 7.01l.01.01.03.02 4.98 3.73 2.46 1.86 1.5 1.13a1.01 1.01 0 0 0 1.22 0l1.5-1.13 2.46-1.86 5.01-3.75.01-.01a6.07 6.07 0 0 0 2.01-7z"/></svg>',
        sso: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 19h16M6 19V9l6-4 6 4v10M9 13h1m4 0h1m-6 3h1m4 0h1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        email: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16v10H4z" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 8l7.5 6 7.5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      };

      function esc(v) {
        return QymSafe.escapeHtml(String(v || ''));
      }

      function activeProviders() {
        return state.providers.filter(function (provider) { return provider && provider.enabled; });
      }

      function providerTheme(id) {
        var key = String(id || '').toLowerCase();
        if (key === 'google') return { key: 'google', icon: icons.google, desc: 'Use your Google identity to continue' };
        if (key === 'github') return { key: 'github', icon: icons.github, desc: 'Use your GitHub account to continue' };
        if (key === 'gitlab') return { key: 'gitlab', icon: icons.gitlab, desc: 'Use your GitLab account to continue' };
        if (key === 'sso') return { key: 'sso', icon: icons.sso, desc: 'Enterprise identity provider' };
        return { key: 'generic', icon: icons.email, desc: 'Continue with this provider' };
      }

      function providerLabel(provider) {
        if (provider && provider.label) return provider.label;
        var id = String((provider && provider.id) || 'provider');
        return 'Continue with ' + id.charAt(0).toUpperCase() + id.slice(1);
      }

      function changePasswordSection() {
        var statusClass = state.messageType ? 'auth-status ' + state.messageType : 'auth-status';
        return ''
          + '<div class="auth-panel">'
          + '  <div class="auth-switch">'
          + '    <div class="auth-switch-copy">'
          + '      <div class="auth-switch-title">An admin reset the password for ' + esc(state.pending.email) + '. Choose a new password to finish signing in.</div>'
          + '    </div>'
          + '    <button class="auth-switch-btn" type="button" data-cancel-change="1">Cancel</button>'
          + '  </div>'
          + '  <form class="auth-form" id="local-auth-form">'
          + '    <input type="email" name="username" autocomplete="username" value="' + esc(state.pending.email) + '" hidden>'
          + '    <div class="field"><label class="field-label" for="new-password">New password</label><input class="field-input" id="new-password" name="new_password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required></div>'
          + '    <div class="field"><label class="field-label" for="confirm-password">Confirm new password</label><input class="field-input" id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" placeholder="Enter the new password again" minlength="8" required></div>'
          + '    <div class="field-help">Passwords must be at least 8 characters.</div>'
          + '    <button class="auth-submit" type="submit"' + (state.loading ? ' disabled' : '') + '>' + (state.loading ? 'Saving...' : 'Set password and sign in') + '</button>'
          + '    <div class="' + statusClass + '" role="status" aria-live="polite">' + esc(state.message) + '</div>'
          + '  </form>'
          + '</div>';
      }

      function localSection() {
        if (!state.localEnabled) return '';
        if (state.mode === 'change' && state.pending) return changePasswordSection();

        var isSignup = state.mode === 'signup';
        var submitLabel = state.loading
          ? (isSignup ? 'Creating account...' : 'Signing in...')
          : (isSignup ? 'Create account' : 'Sign in');
        var statusClass = state.messageType ? 'auth-status ' + state.messageType : 'auth-status';
        var switchLabel = isSignup ? 'Already have an account?' : 'New to qym?';
        var switchTitle = isSignup ? 'Use your email and password to sign in.' : 'Create an account with email and password.';
        var switchAction = isSignup ? 'Sign in instead' : 'Create account';

        return ''
          + '<div class="auth-panel">'
          + '  <div class="auth-switch">'
          + '    <div class="auth-switch-copy">'
          + '      <div class="auth-switch-label">' + (isSignup ? 'Account creation' : 'Email and password') + '</div>'
          + '      <div class="auth-switch-title">' + esc(switchLabel) + ' ' + esc(switchTitle) + '</div>'
          + '    </div>'
          + (state.signupEnabled
            ? '    <button class="auth-switch-btn" type="button" data-toggle-mode="1">' + esc(switchAction) + '</button>'
            : '')
          + '  </div>'
          + '  <form class="auth-form" id="local-auth-form">'
          + (isSignup
            ? '    <div class="field"><label class="field-label" for="display-name">Display name</label><input class="field-input" id="display-name" name="display_name" type="text" autocomplete="name" placeholder="Team member"></div>'
            : '')
          + '    <div class="field"><label class="field-label" for="email">Email</label><input class="field-input" id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required></div>'
          + '    <div class="field"><label class="field-label" for="password">Password</label><input class="field-input" id="password" name="password" type="password" autocomplete="' + (isSignup ? 'new-password' : 'current-password') + '" placeholder="' + (isSignup ? 'At least 8 characters' : 'Enter your password') + '" required></div>'
          + (isSignup
            ? '    <div class="field-help">Passwords must be at least 8 characters.</div>'
            : '    <div class="field-help">Forgot your password? Ask an admin to reset it.</div>')
          + '    <button class="auth-submit" type="submit"' + (state.loading ? ' disabled' : '') + '>' + esc(submitLabel) + '</button>'
          + '    <div class="' + statusClass + '" role="status" aria-live="polite">' + esc(state.message) + '</div>'
          + '  </form>'
          + '</div>';
      }

      function providersSection() {
        var providers = activeProviders();
        if (!providers.length) return '';
        return ''
          + (state.localEnabled ? '<div class="auth-divider">Or continue with</div>' : '')
          + '<div class="providers">'
          + providers.map(function (provider) {
              var theme = providerTheme(provider.id);
              var href = withPrefix('/v1/auth/login/') + encodeURIComponent(provider.id) + '?next=' + encodeURIComponent(next);
              return ''
                + '<a href="' + esc(href) + '" class="provider-btn provider-' + theme.key + '">'
                + '  <span class="provider-icon">' + theme.icon + '</span>'
                + '  <span class="provider-info">'
                + '    <span class="provider-label">' + esc(providerLabel(provider)) + '</span>'
                + '    <span class="provider-desc">' + esc(theme.desc) + '</span>'
                + '  </span>'
                + '  <span class="provider-arrow">' + icons.arrow + '</span>'
                + '</a>';
            }).join('')
          + '</div>';
      }

      function emptyState() {
        return '<div class="provider-empty">No login methods are configured for this deployment.</div>';
      }

      function render() {
        var hasLocal = state.localEnabled;
        var hasProviders = activeProviders().length > 0;
        root.innerHTML = (hasLocal || hasProviders)
          ? localSection() + providersSection()
          : emptyState();

        var toggle = document.querySelector('[data-toggle-mode]');
        if (toggle) {
          toggle.addEventListener('click', function () {
            state.mode = state.mode === 'signup' ? 'signin' : 'signup';
            state.message = '';
            state.messageType = '';
            render();
          });
        }

        var cancelChange = document.querySelector('[data-cancel-change]');
        if (cancelChange) {
          cancelChange.addEventListener('click', function () {
            state.mode = 'signin';
            state.pending = null;
            state.message = '';
            state.messageType = '';
            render();
          });
        }

        var form = document.getElementById('local-auth-form');
        if (form) {
          form.addEventListener('submit', submitLocalAuth);
        }
      }

      function showError(message) {
        state.message = message;
        state.messageType = 'error';
        state.loading = false;
        render();
      }

      async function postJson(path, payload) {
        var response = await fetch(withPrefix(path) + '?next=' + encodeURIComponent(next), {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        var data = await response.json().catch(function () { return {}; });
        return { response: response, data: data };
      }

      async function submitPasswordChange(form) {
        var formData = new FormData(form);
        var newPassword = String(formData.get('new_password') || '');
        if (newPassword !== String(formData.get('confirm_password') || '')) {
          showError('The passwords do not match.');
          return;
        }

        state.loading = true;
        state.message = '';
        state.messageType = '';
        render();

        try {
          var result = await postJson('/v1/auth/password/change', {
            email: state.pending.email,
            current_password: state.pending.password,
            new_password: newPassword
          });
          if (result.response.status === 401) {
            // The temporary password changed or expired; start over.
            state.mode = 'signin';
            state.pending = null;
            showError('Your temporary password is no longer valid. Ask an admin for a new one.');
            return;
          }
          if (!result.response.ok) {
            showError(String(result.data.detail || 'Could not change the password. Please try again.'));
            return;
          }
          state.pending = null;
          state.message = 'Password changed. Redirecting...';
          state.messageType = 'success';
          render();
          window.location.href = result.data.next || (QYM_PREFIX + '/');
        } catch (err) {
          showError('Could not complete the request. Please try again.');
        }
      }

      async function submitLocalAuth(event) {
        event.preventDefault();
        if (state.loading) return;

        var form = event.currentTarget;
        if (state.mode === 'change' && state.pending) {
          await submitPasswordChange(form);
          return;
        }
        var formData = new FormData(form);
        var payload = {
          email: String(formData.get('email') || ''),
          password: String(formData.get('password') || '')
        };
        if (state.mode === 'signup') {
          payload.display_name = String(formData.get('display_name') || '');
        }

        state.loading = true;
        state.message = '';
        state.messageType = '';
        render();

        try {
          var result = await postJson(state.mode === 'signup' ? '/v1/auth/signup/password' : '/v1/auth/login/password', payload);
          var data = result.data;
          if (result.response.status === 403 && data.code === 'password_change_required') {
            state.mode = 'change';
            state.pending = { email: payload.email, password: payload.password };
            state.message = '';
            state.messageType = '';
            state.loading = false;
            render();
            var newPasswordInput = document.getElementById('new-password');
            if (newPasswordInput) newPasswordInput.focus();
            return;
          }
          if (!result.response.ok) {
            showError(String(data.detail || 'Authentication failed. Please try again.'));
            return;
          }
          state.message = state.mode === 'signup' ? 'Account created. Redirecting...' : 'Signed in. Redirecting...';
          state.messageType = 'success';
          render();
          window.location.href = data.next || (QYM_PREFIX + '/');
        } catch (err) {
          showError('Could not complete the request. Please try again.');
        }
      }

      async function bootstrap() {
        try {
          var data = window.__QYM_LOGIN_BOOTSTRAP__ || {};
          var local = data && data.local_auth ? data.local_auth : {};
          state.localEnabled = !!local.enabled;
          state.signupEnabled = !!local.signup_enabled;
          state.providers = Array.isArray(data.providers) ? data.providers : [];
          render();
        } catch (err) {
          root.innerHTML = '<div class="provider-empty">Could not load login methods. Please try again.</div>';
        }
      }

      bootstrap();
    })();
  </script>
</body>
</html>
