<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قيِّم • Projects</title>
  <link rel="icon" type="image/png" href="/static/qym_icon.png">
  <link rel="stylesheet" href="/static/dashboard.css?v=p1-20261002">
  <link rel="stylesheet" href="/static/shell.css?v=p1-20261001">
  <script src="/static/qym_safe.js?v=p1-20261001"></script>
  <script src="/static/auth.js?v=p0-20260930"></script>
  <script src="/static/shell.js?v=p1-20261001"></script>
  <style>
    .projects-page { }
    .projects-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-md); margin-bottom: var(--space-lg); }
    .projects-header h1 { font-size: var(--font-title); font-weight: 600; margin: 0; letter-spacing: -0.3px; }
    .projects-header p { font-size: var(--font-sm); color: var(--text-muted); margin-top: 6px; }

    .projects-search { width: 100%; max-width: 400px; margin-bottom: var(--space-lg); }
    .projects-search input { width: 100%; }
    .projects-search input::placeholder { color: var(--text-dim); }

    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-md); }

    /* Gallery card anatomy — mirrors the datasets catalog (.dsx-card). */
    .project-card {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: 10px; padding: 16px 16px 12px;
      display: flex; flex-direction: column; gap: 11px;
      cursor: pointer; text-decoration: none;
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .project-card:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.20); }

    .project-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

    .project-card-name { font-size: var(--font-lg); font-weight: 650; color: var(--text-primary); }
    .project-card-slug { font-size: var(--font-sm); font-family: var(--font-mono); color: var(--text-muted); margin-top: 3px; }

    .project-card-stats { display: flex; gap: 12px; flex-wrap: wrap; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-subtle); font-size: var(--font-sm); color: var(--text-muted); }
    .project-card-stats .stat { display: inline-flex; align-items: center; gap: 4px; }
    .project-card-stats .stat strong { color: var(--text-primary); font-weight: 650; font-variant-numeric: tabular-nums; }
    .project-card-dates { display: flex; justify-content: space-between; gap: 10px; font-size: var(--font-xs); color: var(--text-dim); font-variant-numeric: tabular-nums; }

    .empty-state { text-align: center; padding: var(--space-xl); color: var(--text-muted); }
    .empty-state h2 { font-size: var(--font-lg); margin-bottom: var(--space-sm); color: var(--text-primary); }

  </style>
  <link rel="stylesheet" href="/static/ui_components.css?v=p1-20261001">
  <script defer src="/static/ui_components.js?v=p1-20261001"></script>
</head>
<body>
  <main class="projects-page">
    <div class="projects-header">
      <div>
        <h1>Projects</h1>
        <p>Select a project to view its evaluations, or create a new one.</p>
      </div>
      <button class="btn btn-primary" id="new-project-btn" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Project
      </button>
    </div>

    <div class="projects-search qym-search-wrap">
      <input class="qym-control qym-search" type="text" placeholder="Search projects by name…" id="project-search" />
    </div>

    <div class="project-grid" id="project-grid">
      <div class="empty-state" id="loading-state">Loading projects...</div>
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      function apiUrl(path) {
        const root = (window.__QYM_ROOT_PATH__ || '').replace(/\/$/, '');
        return `${window.location.origin}${root}/${String(path || '').replace(/^\/+/, '')}`;
      }

      function esc(v) {
        return QymSafe.escapeHtml(v == null ? '' : String(v));
      }

      function relativeTime(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        const now = new Date();
        const diff = Math.floor((now - d) / 1000);
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      function fullDate(dateStr) {
        if (!dateStr) return '';
        return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      let allProjects = [];

      async function load() {
        // Wait for shell
        if (window.QymShell && !window.__QYM_USER__) {
          await new Promise(r => document.addEventListener('qym:shell-ready', r, { once: true }));
        }

        const user = window.__QYM_USER__;
        if (!user) return;

        allProjects = user.projects || [];

        // Show new project button for admins/managers
        const canCreate = user.role === 'ADMIN' || allProjects.some(p => p.role === 'MANAGER');
        document.getElementById('new-project-btn').style.display = canCreate ? 'inline-flex' : 'none';

        renderProjects(allProjects);
      }

      function renderProjects(projects) {
        const grid = document.getElementById('project-grid');

        if (!projects.length) {
          grid.innerHTML = '<div class="empty-state"><h2>No projects yet</h2><p>Create a project to get started with evaluations.</p></div>';
          return;
        }

        grid.innerHTML = projects.map(p => {
          const role = (p.role || 'MEMBER').toLowerCase();
          const roleClass = role === 'manager' || role === 'admin' ? 'manager' : 'member';
          return `<a class="project-card" href="${esc((window.__QYM_ROOT_PATH__ || '').replace(/\/$/, ''))}/projects/${encodeURIComponent(p.slug)}">
            <div class="project-card-top">
              ${window.QymShell && QymShell.identiconHTML ? QymShell.identiconHTML(p.slug, { cell: 10, gap: 3 }) : ''}
              <span class="role-badge qym-tag qym-tag--role ${roleClass}">${esc(role)}</span>
            </div>
            <div>
              <div class="project-card-name">${esc(p.name)}</div>
              <div class="project-card-slug">${esc(p.slug)}</div>
            </div>
            <div class="project-card-stats">
              <span class="stat"><strong>${p.member_count != null ? p.member_count : '—'}</strong> ${p.member_count === 1 ? 'member' : 'members'}</span>
              <span class="stat"><strong>${p.run_count != null ? p.run_count : '—'}</strong> ${p.run_count === 1 ? 'run' : 'runs'}</span>
            </div>
            <div class="project-card-dates">
              <span>${p.created_at ? 'created ' + fullDate(p.created_at) : ''}</span>
              <span>${p.updated_at ? 'updated ' + relativeTime(p.updated_at) : '—'}</span>
            </div>
          </a>`;
        }).join('');
      }

      // Search
      document.getElementById('project-search').addEventListener('input', function () {
        const q = this.value.toLowerCase();
        if (!q) { renderProjects(allProjects); return; }
        renderProjects(allProjects.filter(p =>
          p.name.toLowerCase().includes(q) || p.slug.toLowerCase().includes(q)
        ));
      });

      // New project button — open the shell's create project modal
      document.getElementById('new-project-btn').addEventListener('click', function () {
        if (window.QymShell && window.QymShell.openCreateProjectDialog) {
          window.QymShell.openCreateProjectDialog();
        }
      });

      load().catch(err => {
        document.getElementById('project-grid').innerHTML = `<div class="empty-state">${esc(err.message)}</div>`;
      });
    })();
  </script>
</body>
</html>
