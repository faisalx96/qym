name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: '1'

jobs:
  # The full SDK + platform suite on the newest supported Python, with PostgreSQL, split into eight
  # slices of about equal time (tests/conftest.py, QYM_TEST_SHARD, tests/.test_durations.json) that run
  # in parallel. The real-browser tests run in the packages job, which installs Chromium.
  python:
    name: python (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: qym_test
          POSTGRES_PASSWORD: qym_test
          POSTGRES_DB: qym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qym_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QYM_DATABASE_URL: 'sqlite:///:memory:'
      QYM_ENVIRONMENT: test
      QYM_TEST_POSTGRES_URL: postgresql+psycopg2://qym_test:qym_test@127.0.0.1:5432/qym_test
      QYM_TEST_SHARD: ${{ matrix.shard }}/8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            packages/*/pyproject.toml
            requirements-test.txt
      - name: Install
        run: |
          python -m pip install uv==0.5.11
          uv pip install --system -e packages/sdk -e packages/platform -r requirements-test.txt
      - name: Test
        run: >-
          python -m pytest -q -n auto --dist worksteal --durations=10 -m "not browser"
          --junitxml=junit-${{ matrix.shard }}.xml
      # Per-test times; scripts/test_durations.py turns them into tests/.test_durations.json.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: junit-python-${{ matrix.shard }}
          path: junit-${{ matrix.shard }}.xml
          retention-days: 14

  # Both packages declare requires-python >=3.9: import every module and run the SDK tests there.
  python-3-9:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QYM_DATABASE_URL: 'sqlite:///:memory:'
      QYM_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: |
            packages/*/pyproject.toml
            requirements-test.txt
      - name: Install
        run: python -m pip install -e packages/sdk -e packages/platform -r requirements-test.txt
      - name: Import every module
        run: |
          python - <<'EOF'
          import importlib, pkgutil
          import qym, qym_platform
          for pkg in (qym, qym_platform):
              for mod in pkgutil.walk_packages(pkg.__path__, pkg.__name__ + "."):
                  # __main__ starts the server; migrations need Alembic's context.
                  if ".migrations" not in mod.name and not mod.name.endswith("__main__"):
                      importlib.import_module(mod.name)
          EOF
      - name: SDK tests
        run: python -m pytest -q -n auto tests/sdk

  # Typecheck, ESLint and Stylelint at the same time (about 1 min).
  # Playwright e2e lives in e2e.yml (manual).
  frontend-static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Typecheck, ESLint, Stylelint (in parallel)
        working-directory: frontend
        run: |
          npm run typecheck > typecheck.log 2>&1 & t=$!
          npm run lint > lint.log 2>&1 & l=$!
          npm run stylelint > stylelint.log 2>&1 & s=$!
          rc=0
          for job in "typecheck:$t" "lint:$l" "stylelint:$s"; do
            name=${job%%:*}; pid=${job##*:}
            if wait "$pid"; then echo "::group::$name passed"; else echo "::group::$name FAILED"; rc=1; fi
            cat "$name.log"; echo "::endgroup::"
          done
          exit $rc

  # Vitest (the design-language guards included) in four parallel slices by file.
  frontend-unit:
    name: frontend-unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Vitest slice ${{ matrix.shard }} of 4
        working-directory: frontend
        run: npx vitest run --shard=${{ matrix.shard }}/4

  # The React bundles, the wheels that ship them, and the Codex reviewer script.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Codex reviewer script
        run: node --test tests/automation/*.test.cjs
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Build the React bundles
        run: |
          npm run --prefix frontend build
          npm run --prefix frontend build:sdk
      - name: Test the built bundle and the real-browser XSS checks
        env:
          QYM_DATABASE_URL: 'sqlite:///:memory:'
          QYM_ENVIRONMENT: test
        run: |
          python -m pip install uv==0.5.11
          uv pip install --system -e packages/sdk -e packages/platform -r requirements-test.txt
          python -m playwright install --with-deps chromium
          python -m pytest -q -n auto -m "bundle or browser" tests/platform
      - name: Build and check the wheels
        run: |
          python -m pip install build==1.6.1
          python -m build --wheel packages/sdk
          python -m build --wheel packages/platform
          python scripts/check_wheels.py packages/sdk/dist/*.whl packages/platform/dist/*.whl
