name: Platform and SDK regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    # A healthy leg takes about 17 minutes; stop a hung lock or browser early.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.12']
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: qym_test
          POSTGRES_PASSWORD: qym_test
          POSTGRES_DB: qym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qym_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QYM_DATABASE_URL: 'sqlite:///:memory:'
      QYM_ENVIRONMENT: test
      QYM_TEST_POSTGRES_URL: postgresql+psycopg2://qym_test:qym_test@127.0.0.1:5432/qym_test
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            packages/*/pyproject.toml
            requirements-test.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: Test shared PR reviewer
        run: node --test tests/automation/*.test.cjs
      - name: Install packages and test tools
        run: >-
          python -m pip install -e packages/sdk -e packages/platform
          -r requirements-test.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Install matching Node browser test tools
        run: |
          qym_playwright_version=$(python -c "from importlib.metadata import version; print(version('playwright'))")
          npm install --prefix "$RUNNER_TEMP/qym-node-tests" "playwright@$qym_playwright_version"
          echo "NODE_PATH=$RUNNER_TEMP/qym-node-tests/node_modules" >> "$GITHUB_ENV"
      - name: Test SDK, platform, PostgreSQL and browser workflows
        run: python -m pytest -q -n auto --junitxml=test-results.xml
      - name: Build both distributions
        run: |
          python -m build --wheel packages/sdk
          python -m build --wheel packages/platform
          python -m build --wheel packages/sdk
          python -m build --wheel packages/platform
          python scripts/check_wheels.py packages/sdk/dist/*.whl packages/platform/dist/*.whl
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-python-${{ matrix.python }}
          path: test-results.xml
