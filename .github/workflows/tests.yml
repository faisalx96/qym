name: Platform and SDK regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qym_test
          POSTGRES_PASSWORD: qym_test
          POSTGRES_DB: qym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qym_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QYM_DATABASE_URL: 'sqlite:///:memory:'
      QYM_ENVIRONMENT: test
      QYM_TEST_POSTGRES_URL: postgresql+psycopg2://qym_test:qym_test@127.0.0.1:5432/qym_test
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages and test tools
        run: >-
          python -m pip install -e packages/sdk -e packages/platform
          pytest pytest-asyncio hypothesis playwright axe-playwright-python build
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test SDK, platform, PostgreSQL and browser workflows
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build both distributions
        run: |
          python -m build --wheel packages/sdk
          python -m build --wheel packages/platform
          python -m build --wheel packages/sdk
          python -m build --wheel packages/platform
          python artifacts/p1-validation/check_wheels.py packages/sdk/dist/*.whl packages/platform/dist/*.whl
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python }}
          path: test-results.xml
