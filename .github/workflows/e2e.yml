name: E2E

# Playwright against the real platform (SQLite) and the SDK viewer, in Chromium.
# Manual: Actions -> E2E -> Run workflow (pick the branch).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      QYM_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            packages/*/pyproject.toml
            requirements-test.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the platform (the suite boots it) and the frontend
        run: |
          python -m pip install -e packages/sdk -e packages/platform -r requirements-test.txt
          npm ci --prefix frontend --no-audit --no-fund
          npx --prefix frontend playwright install --with-deps chromium
      - name: Build the app and the SDK viewer
        run: |
          npm run --prefix frontend build
          npm run --prefix frontend build:sdk
      - name: Playwright (platform app)
        run: npm run --prefix frontend e2e -- --workers 2
      - name: Playwright (SDK viewer)
        if: success() || failure()
        run: npm run --prefix frontend e2e:sdk
      - name: Save the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
